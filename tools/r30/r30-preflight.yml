name: R30 internal Android preflight (final gates still required)
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r30-preflight-request.json', '.github/workflows/r30-preflight.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r30-preflight-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source: ${{ steps.request.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r30-preflight-request.json
      - id: request
        run: |
          python3 - <<'CODE'
          import json,os,re
          r=json.load(open('.github/r30-preflight-request.json'));assert re.fullmatch('[a-f0-9]{40}',r['source'])
          focus=r.get('focus','full');assert focus in ('full','charts-and-faults','charts-and-remaining-faults','sqlite-full-only')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+r['source']+'\nfocus='+focus+'\n')
          CODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/r27-ci-temp-key
          key: starcore-r27-ci-temp-signing-v1
          fail-on-cache-miss: true
      - name: Reuse the existing R27 certificate only (no new key)
        env:
          R29_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib
          root=pathlib.Path.home()/'.starcore/r27-ci-temp-key'
          key=root/'r27-ci.p12'; password=(root/'pw').read_text().strip()
          if not key.is_file() or not password: raise SystemExit('ORIGINAL_SIGNING_UNAVAILABLE')
          print('::add-mask::'+password)
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(key),'-storetype','PKCS12','-alias','starcore-r13','-storepass',password],stderr=subprocess.DEVNULL)
          fingerprint=hashlib.sha256(cert).hexdigest()
          if fingerprint!='d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7': raise SystemExit('R27_SIGNING_CHANGED')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('R13_SIGNING_P12='+str(key)+'\nR13_SIGNING_PASSWORD='+password+'\nR13_EXPECTED_CERT_SHA256='+fingerprint+'\nR29_SIGNING=EXISTING_R27_CI_NOT_OFFICIAL_R13\n')
              credential=os.environ.get('R29_API_KEY','').strip()
              if credential:
                  print('::add-mask::'+credential)
                  out.write('DUOQU_API_KEY='+credential+'\n')
          print('Reused R27 certificate '+fingerprint+'; official R13 upgrade BLOCKED')
          PY
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Internal debug and test APKs only; never a final acceptance or public delivery
        run: |
          ./gradlew --no-daemon --max-workers=4 -Pandroid.injected.build.abi=x86_64 :app:compileDebugJavaWithJavac -x :app:generateR982SourceCallAsset
          ./gradlew --no-daemon --max-workers=4 -Pandroid.injected.build.abi=x86_64 -Pr30Instrumentation=true :app:assembleDebug :app:assembleDebugAndroidTest
          grep -Fq 'android:name="com.ethk3.novaonepro.R30FaultAndroidRunner"' app/build/intermediates/packaged_manifests/debugAndroidTest/processDebugAndroidTestManifest/AndroidManifest.xml
          python3 - <<'PY'
          import json,os,pathlib,shutil
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'r30-internal-apks'
          destination.mkdir()
          roots=[pathlib.Path('app/build/outputs/apk'),pathlib.Path('app/build/intermediates/apk')]
          for variant,application,name in [('debug','com.starcore.research.r13','app.apk'),('debugAndroidTest','com.starcore.research.r13.test','test.apk')]:
              candidates=set()
              for root in roots:
                  for metadata in root.rglob('output-metadata.json'):
                      row=json.loads(metadata.read_text())
                      if row.get('variantName')!=variant or row.get('applicationId')!=application: continue
                      for element in row['elements']:
                          apk=(metadata.parent/element['outputFile']).resolve()
                          assert apk.is_file() and apk.suffix=='.apk',apk
                          candidates.add(apk)
              assert len(candidates)==1,(variant,sorted(map(str,candidates)))
              apk=candidates.pop();shutil.copy2(apk,destination/name)
              print('INTERNAL_APK_LOCATED|'+variant+'|'+str(apk.relative_to(pathlib.Path.cwd()))+'|'+str((destination/name).stat().st_size))
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: adb root && adb wait-for-device && adb install -t "$RUNNER_TEMP/r30-internal-apks/app.apk" && adb install -t "$RUNNER_TEMP/r30-internal-apks/test.apk" && bash tools/r30/run_preflight_runtime.sh '${{ steps.request.outputs.focus }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R30-INTERNAL-ANDROID-PREFLIGHT-EVIDENCE
          path: |
            evidence/r30/android-regression/
            evidence/r30/android-focus/
            evidence/r30/fault-matrix/
            evidence/r30/fault-focus/
            startup-evidence/
