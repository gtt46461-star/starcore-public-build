name: Android 14 report with long RSEC-010 dashboard evidence
on:
  push:
    branches: ['repair/report-rsec010-snapshot']
    paths: ['engineering/field-rsec010-210/phone.py', '.github/workflows/field-rsec010-210.yml']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      VERSION: '577311210'
      SOURCE: 7431739b21cd35ce520a011f43f3dfd928d28395
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engineering/field-rsec010-210
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7431739b21cd35ce520a011f43f3dfd928d28395
          path: source
          sparse-checkout: |
            construction/plans/STARCORE_R34_3_REPAIR_20261126/report
            release
            tools
          persist-credentials: false
      - name: Fetch verified baseline and wait for the exact signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="r34.2-B12-85678fcfd128"
          name="STARCORE-R342-577311204-85678fcfd128-release.apk"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$RUNNER_TEMP/installed-204.apk"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name==\"$name\") | .digest")
          actual=$(sha256sum "$RUNNER_TEMP/installed-204.apk" | cut -d' ' -f1)
          [[ "$digest" == "sha256:$actual" ]]
          echo "BASELINE_SHA=$actual" >> "$GITHUB_ENV"
          asset="r343-signed-build-original-B12-$SOURCE"
          for i in $(seq 1 100); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46004596322/artifacts" --jq "[.artifacts[]|select(.name==\"$asset\")]|length") || count=0
            if [[ "$count" == 1 ]]; then break; fi
            sleep 30
          done
          for i in 1 2 3 4; do
            if gh run download 46004596322 --repo "$GITHUB_REPOSITORY" --name "$asset" --dir "$RUNNER_TEMP/received-$i"; then mv "$RUNNER_TEMP/received-$i" "$RUNNER_TEMP/signed"; break; fi
            sleep 10
          done
          mapfile -t apks < <(find "$RUNNER_TEMP/signed" -name '*.apk')
          mapfile -t receipts < <(find "$RUNNER_TEMP/signed" -name 'CI_BUILD_RECEIPT.json')
          [[ ${#apks[@]} == 1 && ${#receipts[@]} == 1 ]]
          sha=$(sha256sum "${apks[0]}" | cut -d' ' -f1)
          jq -e --arg sha "$sha" --arg src "$SOURCE" '.sourceClean and .sourceCommit==$src and .gradleRelease=="PASS" and .apkSha256==$sha' "${receipts[0]}"
          cp "${apks[0]}" "$RUNNER_TEMP/candidate-tested.apk"
          rm -r "$RUNNER_TEMP/signed"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the baseline and time the report through Android DocumentsUI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 30G
          ram-size: 4096M
          script: python3 -B engineering/field-rsec010-210/phone.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsec010-detail-android-readback-577311210
          path: |
            ${{ runner.temp }}/large-report-evidence/field-size-android-readback.json
            ${{ runner.temp }}/large-report-evidence/sampled-stage-transitions.json
          if-no-files-found: warn
