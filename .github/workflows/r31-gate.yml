# R31 construction gate CI fallback (installed as .github/workflows/r31-gate.yml on construction/r31-final-20261104).
# Runs the same full build as `r31_gate.py build` and uploads BUILD_SUMMARY.json; then locally:
#   git pull; r31_gate.py close --batch Kxx   (the job commits BUILD_SUMMARY.json back to the branch)
# No emulator, no signing, no release identity freeze. Evidence-only pushes do not trigger it.
# SDK setup copies r30.yml (setup-android with explicit packages; without them sdkmanager fails on 'tools').
name: STARCORE R31 construction gate
on:
  push:
    branches: ['construction/r31-final-20261104']
    paths-ignore: ['construction/**', 'verification/**', '**/*.md']
  workflow_dispatch:
    inputs:
      batch:
        description: Batch id (default = open batch)
        required: false
permissions:
  contents: write
concurrency:
  group: r31-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Gate build
        run: |
          G=construction/STARCORE_R31_FINAL_20261104/tools/r31_gate.py
          BATCH="${{ github.event.inputs.batch }}"
          if [ -z "$BATCH" ]; then BATCH=$(python3 $G status | python3 -c 'import json,sys; print(json.load(sys.stdin)["open_batch"])'); fi
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"
          python3 $G build --batch "$BATCH" || true
          L=verification/r31/batches/$BATCH/logs/gradle.log
          if [ -f "$L" ]; then
            { echo '### gradle failures'; echo '```'; grep -n -A12 -E "What went wrong|FAILED$" "$L" | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -n -A12 -E "What went wrong" "$L" | head -80 || true
          fi
      - name: Commit build summary back to the branch
        if: always()
        run: |
          git config user.name  "r31-gate-ci"
          git config user.email "r31-gate-ci@users.noreply.github.com"
          git add -f "verification/r31/batches/$BATCH"
          git commit -q -m "evidence(r31/$BATCH): CI build summary for ${GITHUB_SHA::12} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-gate-${{ env.BATCH }}-${{ github.sha }}
          path: verification/r31/batches/
          retention-days: 30
