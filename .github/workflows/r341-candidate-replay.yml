name: STARCORE R34.1 exact candidate Android replay
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r341-candidate-replay.yml']
permissions: {}
jobs:
  release:
    if: github.repository == 'gtt46461-star/starcore-public-build'
    runs-on: ubuntu-latest
    timeout-minutes: 155
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - suite: startup-and-realtime
            batches: B01,B02,B03,B04,B05
          - suite: research-and-training
            batches: B06,B07
          - suite: matrix-and-quality
            batches: B08,B09
          - suite: retention-and-reports
            batches: B10,B11
    env:
      SOURCE: 6a44cbbba962cf1f56a3cf59774a0601bb26465c
      STAGE: B12
      VERSION: '577311150'
      R341_REPLAY_BATCHES: ${{ matrix.batches }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r341-field-release
          path: dispatch
          persist-credentials: false
      - name: Restore the audited plan and exact stage commit
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          git init -q app-source
          git -C app-source fetch -q --no-tags "$url" "$SOURCE"
          git -C app-source checkout -q --detach "$SOURCE"
          test "$(git -C app-source rev-parse HEAD)" = "$SOURCE"
          git -C app-source merge-base --is-ancestor bb7b49bbcc9266bad548ec37e71403256fc06a4d "$SOURCE"
          git init -q plan-source
          git -C plan-source sparse-checkout init --cone
          git -C plan-source sparse-checkout set construction/plans/STARCORE_R33_5_REVIEW_20261119
          git -C plan-source remote add origin "$url"
          git -C plan-source config remote.origin.promisor true
          git -C plan-source config remote.origin.partialclonefilter blob:none
          git -C plan-source fetch -q --depth=1 --filter=blob:none origin 4e1606e9c20c5f01a82cf495b8d39b2630c766f0
          git -C plan-source checkout -q --detach FETCH_HEAD
          test "$(git -C plan-source rev-parse HEAD)" = "4e1606e9c20c5f01a82cf495b8d39b2630c766f0"
          curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/r33.5-plan/33.5.zip" -o "$RUNNER_TEMP/33.5.zip"
          test "$(sha256sum "$RUNNER_TEMP/33.5.zip" | cut -d ' ' -f1)" = 01af8e98ae4d0917b7dd3abe4bff2c44ef8e47cd80136df635cbb0441d6b3a79
          python3 -B plan-source/construction/plans/STARCORE_R33_5_REVIEW_20261119/prepare.py "$RUNNER_TEMP/33.5.zip" "$RUNNER_TEMP/material"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/0fcf8b9e6286e24dc185328af0d02a0458aaee03/STARCORE-R32.5.1-C1-033-release.apk" -o "$RUNNER_TEMP/formal-033.apk"
          git init -q field-plan
          git -C field-plan sparse-checkout init --cone
          git -C field-plan sparse-checkout set construction/plans/STARCORE_R34_20261123
          git -C field-plan fetch -q --depth=1 --filter=blob:none "$url" 4e1606e9c20c5f01a82cf495b8d39b2630c766f0
          git -C field-plan checkout -q --detach FETCH_HEAD
          field_plan="$PWD/field-plan/construction/plans/STARCORE_R34_20261123"
          echo "STARCORE_R34_PLAN_ROOT=$field_plan" >> "$GITHUB_ENV"
          python3 -B "$field_plan/tools/r34/verify_plan.py" --plan "$field_plan" > "$RUNNER_TEMP/field-plan.json"
          python3 -B app-source/tools/r34/test_legacy_r335.py --plan "$field_plan" --legacy "$RUNNER_TEMP/material/current-review"
          git init -q revision-six
          git -C revision-six remote add origin "$url"
          git -C revision-six sparse-checkout init --cone
          git -C revision-six sparse-checkout set construction/plans/STARCORE_R34_1_REPAIR_20261124
          git -C revision-six fetch -q --depth=1 --filter=blob:none origin 2b0177b77fa5f6079da27c915201b95b8bdcef20
          git -C revision-six checkout -q --detach FETCH_HEAD
          r341="$PWD/revision-six/construction/plans/STARCORE_R34_1_REPAIR_20261124"
          test "$(sha256sum "$r341/MANIFEST_SHA256.json" | cut -d ' ' -f1)" = 30facecd7919242b976606ce74fd4fb961bc6969e4b5e7a7b4d2d9415cf64540
          python3 -B "$r341/tools/verify_plan.py" --plan "$r341" --source-root "$PWD/app-source" > "$RUNNER_TEMP/r341-plan.json"
          echo "STARCORE_R341_PLAN_ROOT=$r341" >> "$GITHUB_ENV"
          echo "STARCORE_R33_PLAN_ROOT=$RUNNER_TEMP/material/STARCORE_R33_5_20261118" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/r34-B12-5562f9b19aa0/STARCORE-R34-577311122-5562f9b19aa0-release.apk" -o "$RUNNER_TEMP/baseline122.apk"
          test "$(sha256sum "$RUNNER_TEMP/baseline122.apk" | cut -d ' ' -f1)" = 5b887677a727e3b8d07362c02bc3cd497ae26de052944e8b399b5cefc9d96cc6
          cd app-source
          python3 -c 'import json,os; m=json.load(open("release/release_manifest.json")); assert m["versionCode"]==int(os.environ["VERSION"]) and m["versionName"].startswith("R34.1-"+os.environ["STAGE"]+"-")'
      - name: Install pinned build dependencies
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python3 -m pip install numpy==2.3.5 'cryptography>=41,<51'
          python3 -B "$RUNNER_TEMP/material/current-review/source/preflight_delivery.py" --repo app-source --android-sdk "$ANDROID_HOME" --baseline-apk "$RUNNER_TEMP/formal-033.apk" > "$RUNNER_TEMP/preflight.json"
      - name: Restore the original installed signer in its authorized branch
        uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/r27-ci-temp-key
          key: starcore-r27-ci-temp-signing-v1
          fail-on-cache-miss: true
      - name: Load original baseline input for the existing signing helper
        uses: actions/download-artifact@v4
        with:
          name: r31-report-032-signed-build
          run-id: 43556844131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original032
      - name: Verify the original signer and initialize existing build bindings
        working-directory: app-source
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          git diff --quiet bb7b49bbcc9266bad548ec37e71403256fc06a4d HEAD -- tools/r3251/prepare_existing_signer.py
          python3 tools/r3251/prepare_existing_signer.py
      - name: Read back the exact original-signed candidate
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/r34.1-B12-${SOURCE:0:12}"
          stem="STARCORE-R341-${VERSION}-${SOURCE:0:12}-release.apk"
          mkdir -p "$RUNNER_TEMP/candidate"
          curl -fsSL --retry 3 "$base/DELIVERY.json" -o "$RUNNER_TEMP/received-delivery.json"
          curl -fsSL --retry 3 "$base/$stem" -o "$RUNNER_TEMP/candidate/$stem"
          python3 - "$RUNNER_TEMP/received-delivery.json" "$RUNNER_TEMP/candidate/$stem" <<'CHECK'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          delivery = json.loads(Path(sys.argv[1]).read_bytes())
          apk = Path(sys.argv[2])
          with apk.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==delivery['apk']['sha256']
          with zipfile.ZipFile(apk) as package:
              identity=json.loads(package.read('assets/diagnostics/build-identity-r341.json'))
          assert identity==delivery['r341']
          assert identity['sourceCommit']==os.environ['SOURCE'] and identity['versionCode']==int(os.environ['VERSION'])
          CHECK
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/candidate/$stem" | grep -F 'certificate SHA-256 digest: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7'
      - name: Allow Android API 34 emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 8G
          ram-size: 4096M
          script: python3 -B dispatch/.github/r341-field-release/android_cases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R341-150-${{ matrix.suite }}-android-replay
          path: |
            ${{ runner.temp }}/engineering/
            ${{ runner.temp }}/r341-plan.json
            ${{ runner.temp }}/preflight.json
            ${{ runner.temp }}/received-delivery.json
          if-no-files-found: warn
