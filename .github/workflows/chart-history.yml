name: Chart readback with a verified prior build and a damaged frame
on:
  push:
    branches: ['repair/field-chart-history-20261127']
    paths: ['engineering/chart-history/**', '.github/workflows/chart-history.yml']
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the reviewed test build
        env:
          REPAIR_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp engineering/chart-history/test_bindings.py "$RUNNER_TEMP/chart-bindings.py"
          git switch --detach 5c7f1b36eaee6036df280e85835bb0fb4ce0b40d
          python3 -B "$RUNNER_TEMP/chart-bindings.py"
          git diff --check
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render the older verified chart through the real Android gallery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          script: ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest -Pr30Instrumentation=true -Pandroid.testInstrumentationRunnerArguments.class=com.ethk3.novaonepro.Field173ChartGalleryCapture#staleFrameAndMissingTableRemainExplicitInNativeGallery -Pandroid.testInstrumentationRunnerArguments.r30Sandbox=R343_57731121157731121157731121110101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-history-android-test
          path: app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
