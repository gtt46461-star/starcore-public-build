name: Android 34 populated report and 203 to 204 cover install
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/scripts/populated-report-204.py', '.github/workflows/populated-report-204.yml']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      SOURCE: 85678fcfd12816aec8b47474cd2349350a5684d7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 85678fcfd12816aec8b47474cd2349350a5684d7
          path: source
          sparse-checkout: |
            release
            tools
          persist-credentials: false
      - name: Fetch verified baseline and wait for the exact signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/r34.2-B12-6ca140d4f41d/STARCORE-R342-577311203-6ca140d4f41d-release.apk" -o "$RUNNER_TEMP/installed-203.apk"
          asset="r343-signed-build-original-B12-$SOURCE"
          for i in $(seq 1 100); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45954414922/artifacts" --jq "[.artifacts[]|select(.name==\"$asset\")]|length") || count=0
            if [[ "$count" == 1 ]]; then break; fi
            sleep 30
          done
          for i in 1 2 3 4; do
            if gh run download 45954414922 --repo "$GITHUB_REPOSITORY" --name "$asset" --dir "$RUNNER_TEMP/received-$i"; then mv "$RUNNER_TEMP/received-$i" "$RUNNER_TEMP/signed"; break; fi
            sleep 10
          done
          mapfile -t apks < <(find "$RUNNER_TEMP/signed" -name '*.apk')
          mapfile -t receipts < <(find "$RUNNER_TEMP/signed" -name 'CI_BUILD_RECEIPT.json')
          [[ ${#apks[@]} == 1 && ${#receipts[@]} == 1 ]]
          sha=$(sha256sum "${apks[0]}" | cut -d' ' -f1)
          jq -e --arg sha "$sha" --arg src "$SOURCE" '.sourceClean and .sourceCommit==$src and .gradleRelease=="PASS" and .apkSha256==$sha' "${receipts[0]}"
          cp "${apks[0]}" "$RUNNER_TEMP/candidate-204.apk"
          rm -r "$RUNNER_TEMP/signed"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the baseline and time the report through Android DocumentsUI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 30G
          ram-size: 4096M
          script: python3 -B .github/scripts/populated-report-204.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: populated-report-204-android-readback
          path: ${{ runner.temp }}/large-report-evidence
          if-no-files-found: warn
