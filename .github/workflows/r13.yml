name: R13 restored latest APK
on:
  push:
    branches: ['construction/r13-restore-latest-20261024']
    paths-ignore: ['release/r982_source_calls*', 'release/r82_training_invalidation.json', 'release/research_dependencies_r967.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: starcore-su1-research-signing-v1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/su1-api-transport
          key: starcore-su1-api-transport-v1
          fail-on-cache-miss: true
      - name: Load existing API configuration privately
        run: python3 scripts/load_su1_bundled_api.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python -m pip install numpy==2.3.5
      - name: Build, unit tests and lint
        run: bash scripts/build_r13.sh
      - name: Record package identity and signature
        run: |
          mkdir -p package-receipt
          git rev-parse HEAD > package-receipt/source-commit.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/*.apk > package-receipt/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/*.apk > package-receipt/package.txt
          sha256sum app/build/outputs/apk/debug/*.apk > package-receipt/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R13-build-and-evidence
          path: |
            app/build/outputs/apk/
            app/build/reports/
            build/strategy_su1-verification.json
            package-receipt/
          if-no-files-found: error
  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R13-build-and-evidence
          path: delivered
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/run_android_r13.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R13-Android-runtime
          path: |
            android-r13.txt
            android-logcat.txt
            r13-*.png
