name: R30 read-only existing Android failure summary
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r30-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13053601682'
          run-id: 41227596487
          github-token: ${{ github.token }}
          path: diagnosis/r27-cp06
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13052863934'
          run-id: 41227845441
          github-token: ${{ github.token }}
          path: diagnosis/official-cp06
      - name: Allowlisted startup failure codes only; no data receipts or free text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('diagnosis')
          names={'upgrade-startup.json','rollback-startup.json','reupgrade-startup.json','startup.json'}
          codes={'Fresh service/heartbeat never remained READY for 60 seconds':'FRESH_SERVICE_60S_GATE_FAILED','STARTUP_RETRIED':'STARTUP_RETRIED','STARTUP_ERROR:':'STARTUP_ERROR','OLD_PROCESS_NOT_STOPPED':'OLD_PROCESS_NOT_STOPPED','ADB_FAILED:':'ADB_FAILED','Caught failure:':'CAUGHT_FAILURE'}
          for p in sorted(root.rglob('*')):
              if not p.is_file():continue
              lane='R27_CP06' if 'r27-cp06' in p.parts else 'OFFICIAL_CP06'
              if p.name in names:
                  j=json.loads(p.read_text());rows=j.get('samples',[])
                  summary={'lane':lane,'stage':p.name,'passed':j.get('passed') is True,'crashPresent':bool(j.get('crash')),'samples':len(rows),'phases':{}}
                  for phase in ['cold','restart']:
                      current=[x for x in rows if x.get('phase')==phase]
                      if not current:continue
                      summary['phases'][phase]={'samples':len(current),'readySamples':sum(x.get('init_status')=='READY' for x in current),'pidMatchesRecorded':sum(bool(x.get('actual_pid')) and x.get('actual_pid')==x.get('process_id') for x in current),'staleHeartbeatSamples':sum(int(x.get('observed_at_ms',0))-int(x.get('heartbeat_at',0))>10000 for x in current),'startupErrorPresent':any(bool(x.get('init_last_error')) for x in current)}
                  previous_ready=0;previous_pid=''
                  for phase in ['cold','restart']:
                      current=[x for x in rows if x.get('phase')==phase]
                      if not current:continue
                      start=None;longest=0;events=[];ages=[];times=[]
                      for i,x in enumerate(current):
                          t=int(x.get('observed_at_ms',0));age=t-int(x.get('heartbeat_at',0));ages.append(age);times.append(t)
                          reasons=[]
                          if x.get('init_status')!='READY':reasons.append('NOT_READY')
                          if not x.get('actual_pid') or x.get('actual_pid')!=x.get('process_id'):reasons.append('PID_NOT_MATCHED')
                          if int(x.get('service_ready_at',0))<=previous_ready:reasons.append('READY_NOT_FRESH')
                          if phase=='restart' and x.get('actual_pid')==previous_pid:reasons.append('PID_NOT_NEW')
                          if age < -2000:reasons.append('HEARTBEAT_FUTURE')
                          if age > 10000:reasons.append('HEARTBEAT_STALE')
                          if reasons:
                              start=None;events.append({'sample':i,'reasons':reasons})
                          else:
                              if start is None:start=t
                              longest=max(longest,t-start)
                      summary['phases'][phase].update(longestFreshStreakMs=longest,freshResetEvents=events[:12],maxObservedSampleGapMs=max([b-a for a,b in zip(times,times[1:])]+[0]),minHeartbeatAgeMs=min(ages),maxHeartbeatAgeMs=max(ages))
                      previous_ready=int(current[-1].get('service_ready_at',0));previous_pid=current[-1].get('actual_pid','')
                  print('SAFE_STARTUP_SUMMARY',json.dumps(summary))
              elif p.name.endswith('-startup.log'):
                  s=p.read_text(errors='replace')
                  print('SAFE_EXCEPTION_SUMMARY',json.dumps({'lane':lane,'stage':p.name,'codes':[safe for text,safe in codes.items() if text in s],'exceptionTypes':sorted(set(re.findall(r'\b(?:AssertionError|RuntimeError|TimeoutExpired|[A-Za-z]+Exception)\b',s)))}))
          PY
