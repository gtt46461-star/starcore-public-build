name: STARCORE R34 independent signed upgrade and compressed Android reports
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r34-report-check-ids.yml', '.github/r34-report-check-ids/**']
permissions: {}
jobs:
  upgrades:
    if: github.repository == 'gtt46461-star/starcore-public-build'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
    steps:
      - name: Receive the public package checksum for this exact release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DIGEST'
          import os,re,time,urllib.request
          tag='r34-B12-5562f9b19aa0'
          member='STARCORE-R34-577311122-5562f9b19aa0-release.apk'
          for _ in range(85):
              try:
                  with urllib.request.urlopen('https://github.com/gtt46461-star/starcore-public-build/releases/download/'+tag+'/SHA256SUMS.txt',timeout=20) as r: text=r.read(16385).decode()
                  matches=[line.split()[0] for line in text.splitlines() if len(line.split())==2 and line.split()[1].lstrip('*')==member]
                  if len(matches)!=1 or not re.fullmatch('[a-f0-9]{64}',matches[0]):raise ValueError('RELEASE_CHECKSUM_MISSING')
                  with open(os.environ['GITHUB_ENV'],'a') as dst: print('REPAIRED_APK_SHA='+matches[0],file=dst)
                  break
              except OSError:time.sleep(30)
          else:raise SystemExit('PUBLISHED_CANDIDATE_UNAVAILABLE')
          PY_DIGEST
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6d23ddc26e2a827daca7efaf55801e90ccd5feb6
          path: reviewed
          sparse-checkout: construction/plans/STARCORE_R33_5_REVIEW_20261119
          persist-credentials: false
      - name: Receive published inputs and restore the original verification program
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://github.com/gtt46461-star/starcore-public-build/releases/download/r34-B12-db60f716c3bc/STARCORE-R34-577311121-db60f716c3bc-release.apk' -o "$RUNNER_TEMP/v121.apk"
          curl --fail --silent --show-error --location --retry 3 'https://github.com/gtt46461-star/starcore-public-build/releases/download/r34-B12-5562f9b19aa0/STARCORE-R34-577311122-5562f9b19aa0-release.apk' -o "$RUNNER_TEMP/v122.apk"
          curl --fail --silent --show-error --location --retry 3 'https://github.com/gtt46461-star/starcore-public-build/releases/download/r33.5-plan/33.5.zip' -o "$RUNNER_TEMP/plan.zip"
          python3 -B reviewed/construction/plans/STARCORE_R33_5_REVIEW_20261119/prepare.py "$RUNNER_TEMP/plan.zip" "$RUNNER_TEMP/restored"
      - name: Prepare API 34 guest
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 12G
          heap-size: 512M
          ram-size: 4096M
          script: python3 -B .github/r34-report-check-ids/android.py > "$RUNNER_TEMP/guest-private.log" 2>&1
      - name: Encrypt the disposable guest's numeric receipt to the workspace recipient
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-qa"
          for kind in report; do
            receipt="$RUNNER_TEMP/$kind-$GITHUB_RUN_ID.json"
            test -s "$receipt"
            test "$(stat -c %s "$receipt")" -lt 500000
            openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$receipt" -out "$RUNNER_TEMP/encrypted-qa/checkids.cms" .github/r335-070-verification/recipient.pem
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r34-report-check-ids-workspace-receipt
          path: ${{ runner.temp }}/encrypted-qa/*.cms
          if-no-files-found: error
          retention-days: 1
