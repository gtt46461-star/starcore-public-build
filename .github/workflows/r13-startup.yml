name: R13 full startup reproduction
on:
  push:
    branches: ['construction/su1-20261022']
    paths: ['.github/workflows/r13-startup.yml', 'scripts/probe_r13_startup.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R13-build-and-evidence
          run-id: 40066618076
          github-token: ${{ github.token }}
          path: delivered
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 1
          script: python3 scripts/probe_r13_startup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R13-startup-${{ matrix.api }}
          path: startup-evidence/
