name: Stop superseded full gate for report-only delivery
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-report-export-only.yml']
permissions:
  contents: read
  actions: write
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const id=43416087251;
            const {data: run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:id});
            if(run.head_sha!=='0164241c32c29430749f8da0e9a03d22ae20347a'||run.path!=='.github/workflows/r31-gate.yml')throw new Error('EXACT_SUPERSEDED_GATE_REQUIRED');
            if(['in_progress','queued','waiting','requested','pending'].includes(run.status)) await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:id});
            core.info('Full construction gate deferred by explicit report-only user scope. Existing failures are not changed to pass. Signed 025 report build is untouched.');
