name: STARCORE current signed release live diagnosis
on:
  push:
    branches: ['construction/r31-final-20261104']
    paths: ['release/R31_LIVE_PROFILE_REQUEST.json']
permissions:
  contents: read
  actions: read
jobs:
  live:
    if: ${{ !contains(github.event.head_commit.message, 'phone-signing-probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: r31-report-025-signed-build
          run-id: 43417298331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: r31v-android-build
          run-id: 43395922679
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: support
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: bash tools/r30-repair/prepare_emulator.sh && python3 -B tools/r31/profile_signed_release.py --built built --support support --out live-public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-current-signed-live-profile
          path: live-public/
          if-no-files-found: error

  installed_signer_probe:
    if: ${{ contains(github.event.head_commit.message, 'phone-signing-probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/r27-ci-temp-key
          key: starcore-r27-ci-temp-signing-v1
          fail-on-cache-miss: true
      - name: Verify original installed signer without exporting private material
        run: |
          set -euo pipefail
          K="$HOME/.starcore/r27-ci-temp-key"
          test -s "$K/r27-ci.p12" && test -s "$K/pw"
          pw=$(cat "$K/pw"); echo "::add-mask::$pw"
          cert=$(keytool -exportcert -keystore "$K/r27-ci.p12" -storetype PKCS12 -alias starcore-r13 -storepass "$pw" | sha256sum | cut -c1-64)
          test "$cert" = d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7
          echo "R31_BRANCH_ORIGINAL_SIGNER_AVAILABLE $cert"
