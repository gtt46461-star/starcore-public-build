name: Verify saved file, Android share chooser and directory copy 209
on:
  push:
    branches: ['repair/report-209-control-headroom']
    paths: ['engineering/delivery-options209/handoff.py', '.github/workflows/delivery-options209.yml']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      SOURCE: ab2695b1b7e764fe4fd057183d2007f35a720a63
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engineering/delivery-options209
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ab2695b1b7e764fe4fd057183d2007f35a720a63
          path: source
          sparse-checkout: |
            release
            tools
          persist-credentials: false
      - name: Fetch and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download r34.2-B12-ab2695b1b7e7 --repo "$GITHUB_REPOSITORY" --pattern STARCORE-R342-577311209-ab2695b1b7e7-release.apk --output "$RUNNER_TEMP/candidate-209.apk"
          sha256sum "$RUNNER_TEMP/candidate-209.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open all three actions on the published APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 30G
          ram-size: 4096M
          script: python3 -B engineering/delivery-options209/handoff.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-207-historical-android-readback
          path: ${{ runner.temp }}/history-evidence/historical-readback.json
          if-no-files-found: warn
