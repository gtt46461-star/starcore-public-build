name: Assemble unchanged diagnostic report 173
on:
  push:
    branches: ['ops/r343-report173-20261126-3fb241']
    paths: ['.github/workflows/r343-report173-transfer.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'gtt46461-star/starcore-public-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify original bytes and exact final tree
        shell: bash
        run: |
          python3 - <<'PY_ASSEMBLE'
          from pathlib import Path
          import hashlib, subprocess
          parts = ['tools/oneoff_r343_report173_3fb241/part-00.bin', 'tools/oneoff_r343_report173_3fb241/part-01.bin']
          report = Path('construction/plans/STARCORE_R34_3_REPAIR_20261126/report/ORIGINAL_DIAGNOSTIC_173.zip')
          payload = b''.join(Path(p).read_bytes() for p in parts)
          assert len(payload) == 19373875
          assert hashlib.sha256(payload).hexdigest() == '3fb241b3181dccd4d149cf91471d86532919f77d943847ff8ce348cce5ec4d86'
          report.write_bytes(payload)
          manifest = report.parent.parent / 'MANIFEST_SHA256.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == 'a057ddc2c3fda21e63ae8727391c175131f587f2b50a4863fe9fc5ba41fb97df'
          subprocess.run(['git', 'add', '--force', '--', str(report)], check=True)
          subprocess.run(['git', 'rm', '--force', '--', *parts, '.github/workflows/r343-report173-transfer.yml'], check=True)
          actual_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual_tree == '23eae5f9865837151fdb5d4648bff4180d35cdff', (actual_tree, 'unexpected source tree')
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'docs: verify and assemble unchanged diagnostic report 173'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/ops/r343-report173-20261126-3fb241'], check=True)
          print('REPORT_SHA256_VERIFIED_AND_EXACT_FINAL_TREE_COMMITTED', actual_tree)
          PY_ASSEMBLE
