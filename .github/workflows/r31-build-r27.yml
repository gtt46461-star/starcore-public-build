  diagnose:
    needs: request
    if: needs.request.outputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r31v-emu-35
          run-id: 43302371411
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inspect
      - name: Read existing sandbox-test failures; do not rerun tests or export live data
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          key=os.environ.get('DUOQU_API_KEY','')
          for name in ['original-runtime-storage-owner.txt','history-publication.txt','platform-startup-readiness.txt']:
              files=list(pathlib.Path('inspect').rglob(name));assert len(files)==1
              raw=files[0].read_text()
              classes=sorted(set(re.findall(r'(?:Caused by: |stack=|^)([a-z][A-Za-z0-9_.$]+(?:Exception|Error))(?:[:\n])',raw,re.M)))
              frames=re.findall(r'^\s*at ((?:com\.ethk3\.novaonepro|android\.database|org\.junit)[A-Za-z0-9_.$]+\([A-Za-z0-9_.$: ]+\))\s*$',raw,re.M)
              tests=re.findall(r'^INSTRUMENTATION_STATUS: test=([A-Za-z0-9_]+)$',raw,re.M)
              codes=sorted(set(re.findall(r'\b(?:R[0-9]{2,4}[A-Z0-9]*|LEGACY|SCHEMA|SQLITE)_[A-Z0-9_]{2,100}\b',raw)))
              # Schema identifiers and source stack locations are metadata,
              # never SQL results, row values, UI text or exception messages.
              missing_tables=re.findall(r'no such table: ((?:r26_|r27_|r30_|r31_|v57_|su1_|su2_)[a-z0-9_]{1,80})\b',raw)
              missing_columns=re.findall(r'(?:no such column: |has no column named )([a-z_][a-z0-9_]{1,60})\b',raw)
              flags={key:bool(re.search(pattern,raw,re.I)) for key,pattern in {
                  'nearTokenSyntax':r'near [^\n]{0,80}syntax error',
                  'checkpointOrJournal':r'journal.mode|wal_checkpoint|checkpoint',
                  'insideTransaction':r'(?:within|inside|in) a transaction',
                  'backupReadonlyOpen':r'read.only|readonly|read only',
                  'malformedSchema':r'malformed database schema',
                  'malformedImage':r'disk image is malformed',
                  'noSuchFunction':r'no such function',
                  'reservedObjectName':r'object name reserved',
                  'fileAccessOrPath':r'unable to open|cannot open|no such file|permission denied',
                  'tableOrDatabaseLock':r'database(?: table)? is locked',
                  'transactionState':r'no transaction|cannot commit|cannot rollback',
                  'tooManyVariables':r'too many sql variables',
                  'noSuchTable':r'no such table',
                  'noSuchColumn':r'no such column|has no column named',
                  'missingCollation':r'no such collation',
                  'authorizerRefusal':r'not authorized|authorization denied',
                  'multipleStatements':r'multiple statements',
                  'unfinalizedStatements':r'unfinalized|unfinished statements'
              }.items()}
              words={'cannot','change','journal','mode','database','transaction','schema','syntax','error','near','checkpoint','locked','not','allowed','table','no','such','column','function','is','a','while','compiling','pragma','vacuum','full','select','from','readonly','read','only','malformed','create','index','trigger','alter','update','insert','delete','sqlite_error','wal_checkpoint','main','temp','exists','backup','too','many','variables','statement','statements','more','than','one','query','execsql','execute','rawquery'}
              sqlite_lines=re.findall(r'SQLite[A-Za-z]*Exception:([^\n]{0,1200})',raw)
              vocabulary=[sorted({word.lower() for word in re.findall('[A-Za-z_]+',line) if word.lower() in words}) for line in sqlite_lines[:8]]
              import json
              print('SQLITE_FAILURE_CATEGORY:'+json.dumps({'fixture':name,'flags':flags,'fixedVocabulary':vocabulary,'rawDataOrMessagesExported':False}))
              import json
              print('SANDBOX_FAILURE_PROJECTION:'+json.dumps({'fixture':name,'tests':tests[:30],'exceptionClasses':classes[:20],'sourceFrames':frames[:120],'fixedErrorCodes':codes[:30],'missingSchemaTables':missing_tables[:10],'missingSchemaColumns':missing_columns[:10],'rawDataOrMessagesExported':False}))
          PY
