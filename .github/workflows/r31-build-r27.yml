          script: adb root && adb wait-for-device && python3 "$RUNNER_TEMP/r31_release_overlay.py" --old "$RUNNER_TEMP/old-020.apk" --new "$OVERLAY_RELEASE_APK" --out overlay
      - name: Project audited public status fields; raw database rows stay ephemeral
        if: always()
        run: |
          python3 - overlay public-overlay <<'PY'
          """An exhaustive public projection. Original DB rows, UI text and arbitrary
          runtime strings are deliberately not copied to artifact or release output.
          Only fixed statuses, bounded counts and public build/test digests leave CI.
          """
          import hashlib,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          def read(name):
           p=root/name
           return json.loads(p.read_text()) if p.is_file() else {}
          def fixed(value,allowed,default='UNAVAILABLE'):return value if value in allowed else default
          def digest(value):return value if isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value) else None
          def source(value):return value if value=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21' else None
          def integer(value,maximum=10**15):return value if type(value)==int and 0<=value<=maximum else None
          def write(name,value):(out/name).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          b=read('APK_BINDING.json');binding={}
