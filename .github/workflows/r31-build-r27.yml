name: STARCORE R31 stop superseded source
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Stop the source superseded by the large-state production fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X POST repos/gtt46461-star/starcore-public-build/actions/runs/43290936026/cancel --silent; then
            echo SUPERSEDED_SOURCE_CANCEL_REQUESTED
          else
            state=$(gh api repos/gtt46461-star/starcore-public-build/actions/runs/43290936026 --jq .status)
            test "$state" = completed
          fi
