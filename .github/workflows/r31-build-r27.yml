name: STARCORE R31 exact current source verification
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - name: Require the actual current R31 source, preserving the installed identity
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert r['source']=='56f230aad786c85ab220eed7090872a24cbd969e'
          assert r['expectedTree']=='06aea904c3743b9fb91dcb44e0f54b8126050fae'
          assert r['expectedVersionCode']==577311021
          assert r['expectedVersionName']=='R31-REPAIR-2026.11.12-021'
          assert r['mode']=='verify'
          print('PINNED_R31_SOURCE='+r['source'])
          PY
  verify:
    needs: request
    uses: gtt46461-star/starcore-public-build/.github/workflows/r31-verification.yml@56f230aad786c85ab220eed7090872a24cbd969e
    with:
      source: 56f230aad786c85ab220eed7090872a24cbd969e
    secrets: inherit
