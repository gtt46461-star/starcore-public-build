name: STARCORE R31 exact-source verification and live observation
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      build_run: ${{ steps.request.outputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - id: request
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert r['source']=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21'
          assert r['expectedVersionCode']==577311021
          assert r['expectedVersionName']=='R31-REPAIR-2026.11.12-021'
          assert r['mode'] in ['verify','live','diagnose']
          if r['mode']=='live':assert str(r['buildRunId']).isdigit()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('mode='+r['mode']+'\n')
              f.write('build_run='+str(r.get('buildRunId',''))+'\n')
          print('PINNED_R31_SOURCE='+r['source']+' mode='+r['mode'])
          PY
  verify:
    needs: request
    if: needs.request.outputs.mode == 'verify'
    uses: gtt46461-star/starcore-public-build/.github/workflows/r31-verification.yml@cd7552121ca01e3c77e8de1e2f2c68ea703d6c21
    with:
      source: cd7552121ca01e3c77e8de1e2f2c68ea703d6c21
    secrets: inherit
  live:
    needs: request
    if: needs.request.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: r31v-android-build
          run-id: ${{ needs.request.outputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Bind the actual APK and the observer to the exact verified source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          r=json.load(open('.github/r31-build-request.json'))
          root=pathlib.Path('built')
          sources=list(root.rglob('source-commit.txt'));assert len(sources)==1
          assert sources[0].read_text().strip()=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21'
          apks=[p for p in root.rglob('*.apk') if p.parent.name=='debug' and 'androidTest' not in p.parts];assert len(apks)==1
          apk=apks[0];sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          sums=list(root.rglob('SHA256SUMS.txt'));assert len(sums)==1
          assert any(line.split()[0]==sha and line.split()[-1].endswith('/'+apk.name) for line in sums[0].read_text().splitlines())
          code=base64.b64decode(r['scriptBase64'],validate=True)
          assert hashlib.sha256(code).hexdigest()==r['scriptSha256']
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'r31_live_observation.py').write_bytes(code)
          pathlib.Path('live').mkdir()
          pathlib.Path('live/APK_BINDING.json').write_text(json.dumps({'source':'cd7552121ca01e3c77e8de1e2f2c68ea703d6c21','apkSha256':sha,'buildRunId':r['buildRunId'],'observerSha256':r['scriptSha256'],'layer':'DEBUG_LIVE_EMULATOR_NOT_PHONE_NOT_NATURAL_ADVANTAGE'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('LIVE_APP_APK='+str(apk.resolve())+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: python3 "$RUNNER_TEMP/r31_live_observation.py" --apk "$LIVE_APP_APK" --source cd7552121ca01e3c77e8de1e2f2c68ea703d6c21 --seconds 1200 --out live
      - name: Project audited public status fields; raw database rows stay ephemeral
        if: always()
        run: |
          python3 - live public-live <<'PY'
          """An exhaustive public projection. Original DB rows, UI text and arbitrary
          runtime strings are deliberately not copied to artifact or release output.
          Only fixed statuses, bounded counts and public build/test digests leave CI.
          """
          import hashlib,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          def read(name):
           p=root/name
           return json.loads(p.read_text()) if p.is_file() else {}
          def fixed(value,allowed,default='UNAVAILABLE'):return value if value in allowed else default
          def digest(value):return value if isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value) else None
          def source(value):return value if value=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21' else None
          def integer(value,maximum=10**15):return value if type(value)==int and 0<=value<=maximum else None
          def write(name,value):(out/name).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          b=read('APK_BINDING.json');binding={}
          for key in ['source','sourceCommit']:
           if key in b:binding[key]=source(b[key])
          for key in ['apkSha256','newReleaseSha256','oldReleaseSha256','observerSha256']:
           if key in b:binding[key]=digest(b[key])
          binding['buildRunId']=integer(b.get('buildRunId'))
          if 'apks' in b:binding['apks']=[{'sha256':digest(row.get('sha256'))} for row in b['apks'][:3]]
          write('APK_BINDING.json',binding)
          if root.name=='live':
           d=read('LIVE_RECEIPT.json');t=d.get('tablesUi',{});z=d.get('safZip',{})
           receipt={'format':'R31_PUBLIC_LIVE_EXECUTION_1','sourceCommit':source(d.get('sourceCommit')),'runId':integer(int(d['runId'])) if str(d.get('runId','')).isdigit() else None,'apkSha256':digest(d.get('apkSha256')),'state':fixed(d.get('state'),['STARTED_NOT_PASS','FAILED_OR_INCOMPLETE','OBSERVED_PARTIAL_NO_WHOLE_LOOP_CLAIM']),
           'observed':{key:d.get('observed',{}).get(key) is True for key in ['newDraws','naturalClosedForecasts','feedbackAndConsumers','verifiedModelConsumer','followingForecasts']},
           'safReadbackVerified':d.get('safReadbackVerified') is True,'safZip':{'sha256':digest(z.get('sha256')),'bytes':integer(z.get('bytes')),'reportHashVerified':z.get('reportHashVerified') is True,'crcVerified':z.get('crcVerified') is True},
           'tablesUi':{'state':fixed(t.get('state'),['STARTED_NOT_PASS','OBSERVED_16_ACTUAL_READERS','OBSERVED_READ_FAILURES']),'reads':[]},
           'forecastConsumesSpecificUpdatedModelPublication':'NOT_PROVEN_REQUIRES_ACTUAL_FORECAST_BINDING','observerPauseCount':len(d.get('observerPauses',[])),'physicalDevice':'NOT_RUN','24h':'NOT_RUN','72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','rawDatabaseRowsOrUiTextPublished':False}
           for row in t.get('reads',[])[:16]:
            identity=row.get('id');identity=identity if identity in ['T%02d'%i for i in range(1,17)] else None
            receipt['tablesUi']['reads'].append({'id':identity,'actualStatus':fixed(row.get('actualStatus'),['READ_OK','EMPTY_NO_ROWS','READ_ERROR']),'shown':integer(row.get('shown'),20),'receiptSha256':digest(row.get('receiptSha256')),'uiPayloadSha256':digest(row.get('uiPayloadSha256'))})
           write('LIVE_RECEIPT.json',receipt)
          elif root.name=='overlay':
           d=read('RELEASE_OVERLAY.json');receipt={'format':'R31_PUBLIC_RELEASE_OVERLAY_1','sourceCommit':source(d.get('sourceCommit')),'oldApkSha256':digest(d.get('oldApkSha256')),'newApkSha256':digest(d.get('newApkSha256')),'fromVersionCode':577311020,'toVersionCode':577311021,'state':fixed(d.get('state'),['STARTED_NOT_PASS','FAILED_OR_INCOMPLETE','OBSERVED_RELEASE_OVERLAY_AND_ORIGINAL_ROWS','OBSERVED_OVERLAY_ONLY_NO_OLD_DRAW_ROWS']),
           'actualReleaseOverlayInstall':fixed(d.get('actualReleaseOverlayInstall'),['PASS']),'oldObservedRowsPreserved':d.get('oldObservedRowsPreserved') is True,'checks':[],
           'trainedAssetMigration':'NOT_PROVEN_FRESH_VM_ASSET_SET_MAY_BE_EMPTY','physicalDevice':'NOT_RUN','old670MHandsetDatabase':'NOT_RUN','24h':'NOT_RUN','72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','rawDatabaseRowsPublished':False}
           for row in d.get('checks',[])[:2]:receipt['checks'].append({'oldObservedRows':integer(row.get('oldObservedRows'),64),'preservedObservedRows':integer(row.get('preservedObservedRows'),64),'databaseIntegrity':fixed(row.get('databaseIntegrity'),['ok'])})
           write('RELEASE_OVERLAY.json',receipt)
          elif root.name=='faults':
           d=read('RESULTS.json');receipt={'sourceCommit':source(d.get('sourceCommit')),'buildRunId':integer(d.get('buildRunId')),'physicalDevice':'NOT_RUN','naturalQuality':'NOT_PROVEN','rawRuntimeLogsPublished':False}
           for key in ['service6Exit','original14Exit','research12Exit','charts47Exit']:receipt[key]=integer(d.get(key),255)
           write('RESULTS.json',receipt)
           matrix={'sourceCommit':source(d.get('sourceCommit')),'original14':[],'research12':[],'chartScenarioCapture':{}}
           original=read('original14/matrix.json')
           for row in original.get('cells',[])[:14]:matrix['original14'].append({'fault':fixed(row.get('fault'),['fetch_timeout','draw_conflict','kill_settlement','kill_freeze','sqlite_full','clock_rollback','service_stop']),'visibility':fixed(row.get('visibility'),['foreground','background']),'mechanics':fixed(row.get('mechanics'),['ANDROID_EMULATOR_MECHANICS_PASS'])})
           research=read('research12/research-fault-matrix.json')
           for row in research.get('cells',[])[:12]:matrix['research12'].append({'stage':fixed(row.get('stage'),['analysis','consume']),'fault':fixed(row.get('fault'),['BUSY','FULL','CANCEL','KILL','CORRUPT','SOURCE_CHANGE']),'pass':row.get('pass') is True})
           charts=read('charts47/repair-chart-acceptance.json')
           for key in ['registeredObjects','displayScenarios','screenshots','originalObjects','researchViews']:matrix['chartScenarioCapture'][key]=integer(charts.get(key),10000)
           artifacts=charts.get('artifacts',[]);matrix['chartScenarioCapture']['imageCount']=len(artifacts);matrix['chartScenarioCapture']['imageSha256']=[digest(row.get('sha256')) for row in artifacts[:200]]
           write('MATRIX_CHECKS.json',matrix)
           # Diagnose a failing test by class/method/line without copying exception
           # messages, JSON payloads, SQL results, credentials or arbitrary UI strings.
           frames=[]
           for p in sorted(root.rglob('*.txt')):
            if p.stat().st_size>8*1024*1024:continue
            for line in p.read_text(errors='replace').splitlines():
             match=re.search(r'^\s*at ((?:com\.ethk3\.novaonepro|org\.junit|android\.database)[A-Za-z0-9_.$]+\([A-Za-z0-9_.$: ]+\))\s*$',line)
             if match and len(frames)<300:frames.append(match.group(1))
           write('FAILURE_STACK_FRAMES.json',{'sourceCommit':source(d.get('sourceCommit')),'frames':frames,'exceptionMessagesAndDataOmitted':True})
          else:raise SystemExit('UNKNOWN_PUBLIC_PROJECTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-live-observation
          path: public-live/

  faults:
    needs: request
    if: needs.request.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
