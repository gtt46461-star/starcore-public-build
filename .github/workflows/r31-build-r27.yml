             match=re.search(r'^\s*at ((?:com\.ethk3\.novaonepro|org\.junit|android\.database)[A-Za-z0-9_.$]+\([A-Za-z0-9_.$: ]+\))\s*$',line)
             if match and len(frames)<300:frames.append(match.group(1))
           write('FAILURE_STACK_FRAMES.json',{'sourceCommit':source(d.get('sourceCommit')),'frames':frames,'exceptionMessagesAndDataOmitted':True})
          else:raise SystemExit('UNKNOWN_PUBLIC_PROJECTION')
