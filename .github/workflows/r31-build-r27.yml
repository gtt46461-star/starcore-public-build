name: STARCORE R31 exact-source verification and live observation
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      build_run: ${{ steps.request.outputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - id: request
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert r['source']=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21'
          assert r['expectedVersionCode']==577311021
          assert r['expectedVersionName']=='R31-REPAIR-2026.11.12-021'
          assert r['mode'] in ['verify','live']
          if r['mode']=='live':assert str(r['buildRunId']).isdigit()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('mode='+r['mode']+'\n')
              f.write('build_run='+str(r.get('buildRunId',''))+'\n')
          print('PINNED_R31_SOURCE='+r['source']+' mode='+r['mode'])
          PY
  verify:
    needs: request
    if: needs.request.outputs.mode == 'verify'
    uses: gtt46461-star/starcore-public-build/.github/workflows/r31-verification.yml@cd7552121ca01e3c77e8de1e2f2c68ea703d6c21
    with:
      source: cd7552121ca01e3c77e8de1e2f2c68ea703d6c21
    secrets: inherit
  live:
    needs: request
    if: needs.request.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: r31v-android-build
          run-id: ${{ needs.request.outputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Bind the actual APK and the observer to the exact verified source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          r=json.load(open('.github/r31-build-request.json'))
          root=pathlib.Path('built')
          sources=list(root.rglob('source-commit.txt'));assert len(sources)==1
          assert sources[0].read_text().strip()=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21'
          apks=[p for p in root.rglob('*.apk') if p.parent.name=='debug' and 'androidTest' not in p.parts];assert len(apks)==1
          apk=apks[0];sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          sums=list(root.rglob('SHA256SUMS.txt'));assert len(sums)==1
          assert any(line.split()[0]==sha and line.split()[-1].endswith('/'+apk.name) for line in sums[0].read_text().splitlines())
          code=base64.b64decode(r['scriptBase64'],validate=True)
          assert hashlib.sha256(code).hexdigest()==r['scriptSha256']
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'r31_live_observation.py').write_bytes(code)
          pathlib.Path('live').mkdir()
          pathlib.Path('live/APK_BINDING.json').write_text(json.dumps({'source':'cd7552121ca01e3c77e8de1e2f2c68ea703d6c21','apkSha256':sha,'buildRunId':r['buildRunId'],'observerSha256':r['scriptSha256'],'layer':'DEBUG_LIVE_EMULATOR_NOT_PHONE_NOT_NATURAL_ADVANTAGE'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('LIVE_APP_APK='+str(apk.resolve())+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: python3 "$RUNNER_TEMP/r31_live_observation.py" --apk "$LIVE_APP_APK" --source cd7552121ca01e3c77e8de1e2f2c68ea703d6c21 --seconds 1200 --out live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-live-observation
          path: live/

  faults:
    needs: request
    if: needs.request.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd7552121ca01e3c77e8de1e2f2c68ea703d6c21
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: r31v-android-build
          run-id: ${{ needs.request.outputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Require the actual APKs from the exact source
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('built')
          sources=list(root.rglob('source-commit.txt'));assert len(sources)==1
          assert sources[0].read_text().strip()=='cd7552121ca01e3c77e8de1e2f2c68ea703d6c21'
          sums=list(root.rglob('SHA256SUMS.txt'));assert len(sums)==1
          originals=sums[0].read_text().splitlines()
          apks=[p for p in root.rglob('*.apk') if p.parent.name=='debug' and 'androidTest' not in p.parts]
          tests=[p for p in root.rglob('*.apk') if 'androidTest' in p.parts]
          assert len(apks)==len(tests)==1
          binding={'sourceCommit':sources[0].read_text().strip(),'buildRunId':${{ needs.request.outputs.build_run }},'apks':[]}
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for name,p in [('FAULT_APP_APK',apks[0]),('FAULT_TEST_APK',tests[0])]:
                  sha=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert any(line.split()[0]==sha and line.split()[-1].endswith('/'+p.name) for line in originals)
                  binding['apks'].append({'file':p.name,'sha256':sha})
                  env.write(name+'='+str(p.resolve())+'\n')
          pathlib.Path('faults').mkdir()
          pathlib.Path('faults/APK_BINDING.json').write_text(json.dumps(binding,indent=2))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare one shell for the complete original Android regressions
        run: |
          cat > "$RUNNER_TEMP/r31_actual_faults.sh" <<'SH'
          set -uo pipefail
          adb root
          adb wait-for-device
          adb install -r -g "$FAULT_APP_APK"
          adb install -r -t -g "$FAULT_TEST_APK"
          set +e
          mkdir -p faults/service6
          adb shell am instrument -w -r -e r30Sandbox "r31-current-service-${{ github.run_id }}" -e r31qRealService true -e class com.ethk3.novaonepro.R31QDeliveryInstrumentedTest com.starcore.research.r13.test/com.ethk3.novaonepro.R30FaultAndroidRunner > faults/service6/instrumentation.txt 2>&1
          service_rc=$?
          grep -Fq "OK (6 tests)" faults/service6/instrumentation.txt || service_rc=1
          bash tools/r30/run_fault_matrix.sh faults/original14 > faults/original14.log 2>&1
          original_rc=$?
          bash tools/r30-repair/run_research_fault_matrix.sh faults/research12 > faults/research12.log 2>&1
          research_rc=$?
          bash tools/r30-repair/run_android_regression.sh faults/charts47 > faults/charts47.log 2>&1
          charts_rc=$?
          python3 -c "import json,pathlib;pathlib.Path('faults/RESULTS.json').write_text(json.dumps({'sourceCommit':'cd7552121ca01e3c77e8de1e2f2c68ea703d6c21','buildRunId':${{ needs.request.outputs.build_run }},'service6Exit':$service_rc,'original14Exit':$original_rc,'research12Exit':$research_rc,'charts47Exit':$charts_rc,'physicalDevice':'NOT_RUN','naturalQuality':'NOT_PROVEN'},indent=2))"
          test "$service_rc" -eq 0 -a "$original_rc" -eq 0 -a "$research_rc" -eq 0 -a "$charts_rc" -eq 0
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: bash "$RUNNER_TEMP/r31_actual_faults.sh"
      - name: Redact credentials from actual fault receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          key=os.environ.get('DUOQU_API_KEY','')
          for private in pathlib.Path('faults').rglob('UI_EXPORTED_FULL_REPORT.zip'):private.unlink()
          for p in pathlib.Path('faults').rglob('*'):
              if not p.is_file() or p.suffix not in ('.json','.xml','.txt','.log','.tsv'):continue
              s=p.read_text(errors='replace')
              if key:s=s.replace(key,'[REDACTED]')
              s=re.sub(r'(?i)([?&](?:key|token|secret|api_key|apikey)=)[^&\s"<>]+',r'\1[REDACTED]',s)
              s=re.sub(r'(?i)Bearer\s+[^\s,;"}]+','Bearer [REDACTED]',s)
              p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-current-original-faults-and-charts
          path: faults/

  release_overlay:
    needs: request
    if: needs.request.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r31-build-request.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: r31v-android-build
          run-id: ${{ needs.request.outputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Bind both genuine release APKs and the observer
        run: |
          mkdir -p overlay
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/old-020.apk" https://github.com/gtt46461-star/starcore-public-build/releases/download/r31q-fix-577311020-5e05e6689f64/STARCORE-R31-EXISTING_R27-5e05e6689f64-release.apk
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          r=json.load(open('.github/r31-build-request.json'));root=pathlib.Path('built')
          sources=list(root.rglob('source-commit.txt'));assert len(sources)==1 and sources[0].read_text().strip()==r['source']
          apks=[p for p in root.rglob('*.apk') if p.parent.name=='release'];assert len(apks)==1
          apk=apks[0];sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          sums=list(root.rglob('SHA256SUMS.txt'));assert len(sums)==1
          assert any(line.split()[0]==sha and line.split()[-1].endswith('/'+apk.name) for line in sums[0].read_text().splitlines())
          old=pathlib.Path(os.environ['RUNNER_TEMP'])/'old-020.apk';assert hashlib.sha256(old.read_bytes()).hexdigest()=='271c4ce17f345306f80e9f686acdf68b0d1cf47c3da857fed811cc69feb1a4f8'
          code=base64.b64decode(r['overlayScriptBase64'],validate=True);assert hashlib.sha256(code).hexdigest()==r['overlayScriptSha256']
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'r31_release_overlay.py').write_bytes(code)
          pathlib.Path('overlay/APK_BINDING.json').write_text(json.dumps({'sourceCommit':r['source'],'buildRunId':r['buildRunId'],'newReleaseSha256':sha,'oldReleaseSha256':hashlib.sha256(old.read_bytes()).hexdigest(),'observerSha256':r['overlayScriptSha256']},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('OVERLAY_RELEASE_APK='+str(apk.resolve())+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify the unchanged public signer of both release APKs
        run: |
          set -euo pipefail
          B=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          test -n "$B"
          "$B" verify --print-certs "$RUNNER_TEMP/old-020.apk" > overlay/old-certificate.txt
          "$B" verify --print-certs "$OVERLAY_RELEASE_APK" > overlay/new-certificate.txt
          for f in overlay/*-certificate.txt; do grep -q 'certificate SHA-256 digest: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7' "$f"; done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: adb root && adb wait-for-device && python3 "$RUNNER_TEMP/r31_release_overlay.py" --old "$RUNNER_TEMP/old-020.apk" --new "$OVERLAY_RELEASE_APK" --out overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-real-release-overlay
          path: overlay/
