           for row in d.get('checks',[])[:2]:receipt['checks'].append({'oldObservedRows':integer(row.get('oldObservedRows'),64),'preservedObservedRows':integer(row.get('preservedObservedRows'),64),'databaseIntegrity':fixed(row.get('databaseIntegrity'),['ok'])})
           write('RELEASE_OVERLAY.json',receipt)
          elif root.name=='faults':
           d=read('RESULTS.json');receipt={'sourceCommit':source(d.get('sourceCommit')),'buildRunId':integer(d.get('buildRunId')),'physicalDevice':'NOT_RUN','naturalQuality':'NOT_PROVEN','rawRuntimeLogsPublished':False}
           for key in ['service6Exit','original14Exit','research12Exit','charts47Exit']:receipt[key]=integer(d.get(key),255)
           write('RESULTS.json',receipt)
