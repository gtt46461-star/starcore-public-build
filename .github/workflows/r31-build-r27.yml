name: STARCORE R31 visible construction source only
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: write
concurrency:
  group: r31-visible-source-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller
      - name: Bind the public source patch; no APK or test result is produced
        id: request
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,re
          r=json.load(open('caller/.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert r['status']=='WORK_IN_PROGRESS_SOURCE_ONLY_NOT_APK_NOT_ACCEPTANCE'
          assert 1<=len(r['patchParts'])<=64
          for key in ['base','tree','appTree','localSource']:assert re.fullmatch('[0-9a-f]{40}',r[key])
          chunks=[]
          for i,p in enumerate(r['patchParts']):
            assert p['path']=='.github/r31-wip-patch/part-%03d.b64'%i
            encoded=pathlib.Path('caller',p['path']).read_text(encoding='ascii')
            assert 1<=len(encoded)<=16384 and len(encoded)==p['characters']
            assert hashlib.sha256(encoded.encode('ascii')).hexdigest()==p['sha256']
            chunks.append(encoded)
          encoded=''.join(chunks)
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()==r['patchGzipSha256']
          patch=gzip.decompress(data);assert len(patch)<2000000
          pathlib.Path('source.patch').write_bytes(patch)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('base='+r['base']+'\n')
          print('WIP_SOURCE_TRANSFER_ONLY patchBytes='+str(len(patch)))
          PY
      - uses: actions/checkout@v4
        with:
          ref: construction/r31-final-20261104
          fetch-depth: 0
          path: source
      - name: Apply only to the exact current application branch
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.request.outputs.base }}"
          git apply --check ../source.patch
          git apply --index ../source.patch
          python3 - <<'PY'
          import json,subprocess
          r=json.load(open('../caller/.github/r31-build-request.json'))
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==r['tree'],'EXACT_SOURCE_TREE_MISMATCH'
          print('EXACT_WIP_TREE='+tree)
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          BASE="${{ steps.request.outputs.base }}"
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m 'wip(r31): publish actual cumulative construction sources; final gates and APK pending [skip ci]')
          if git push origin "$COMMIT:refs/heads/construction/r31-final-20261104"; then
            echo "WIP_FULL_SOURCE_COMMIT=$COMMIT"
          else
            git restore --source="$BASE" --staged --worktree -- .github/workflows/r31-gate.yml .github/workflows/r31-verification.yml .github/workflows/r31-publish-release.yml
            python3 - <<'PY'
          import json,subprocess
          r=json.load(open('../caller/.github/r31-build-request.json'))
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==r['appTree'],'APP_ONLY_TREE_MISMATCH'
          PY
            APP_TREE=$(git write-tree)
            APP_COMMIT=$(git commit-tree "$APP_TREE" -p "$BASE" -m 'wip(r31): visible actual application construction; workflow synchronization pending [skip ci]')
            git push origin "$APP_COMMIT:refs/heads/construction/r31-final-20261104"
            echo "WIP_APP_SOURCE_COMMIT=$APP_COMMIT"
            echo "WIP_APP_TREE=$APP_TREE"
          fi
          echo 'WORK_IN_PROGRESS_NO_APK_NO_FULL_ACCEPTANCE_CLAIM'
