name: STARCORE 029 final cumulative integration and exact signed delivery proofs
'on':
  push:
    branches:
    - construction/r27-20261028
    paths:
    - .github/workflows/r31-build-r27.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: r31-final-029-e83dfad82f5b49949d03688e4a86003bc6b3d371
  cancel-in-progress: false
env:
  SDK_PACKAGES: '''platforms;android-36'' ''build-tools;36.0.0'' ''ndk;28.2.13676358'' ''cmake;3.22.1'''
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.frozen.outputs.source }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e83dfad82f5b49949d03688e4a86003bc6b3d371
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
    - uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
    - name: Compile original production source and freeze its actual call inventory
      id: frozen
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"e83dfad82f5b49949d03688e4a86003bc6b3d371\"\npython3 -B scripts/r967_semantic_identity.py\
        \ --check\n./gradlew --no-daemon --max-workers=4 -Pr31InventoryBootstrap=true -Pr312Development=true :app:compileDebugJavaWithJavac\
        \ 2>&1 | tail -n 110\npython3 -B scripts/r982_source_call_asset.py --freeze --classes app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes\n\
        python3 -B scripts/r982_source_call_asset.py\npython3 -B scripts/r967_semantic_identity.py --check\npython3 - <<'PYCHECK'\n\
        import subprocess\nexpected={'release/r982_source_calls.tsv.gz','release/r982_source_calls.manifest.json'}\nactual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())\n\
        assert actual <= expected, 'UNEXPECTED_GENERATED_SOURCE_CHANGE:'+str(actual-expected)\nPYCHECK\nif ! git diff --quiet\
        \ -- release/r982_source_calls.tsv.gz release/r982_source_calls.manifest.json; then\n  git config user.name \"STARCORE\
        \ CI\"\n  git config user.email \"starcore-ci@users.noreply.github.com\"\n  git add release/r982_source_calls.tsv.gz\
        \ release/r982_source_calls.manifest.json\n  git commit -m \"build(r31): freeze actual 029 cumulative production call\
        \ inventory [skip ci]\"\n  git push origin HEAD:refs/heads/construction/r31-final-20261104 --force-with-lease=refs/heads/construction/r31-final-20261104:e83dfad82f5b49949d03688e4a86003bc6b3d371\n\
        fi\necho \"source=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/r31-frozen-source.txt\"\
        \n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31-029-compiled-inventory-source
        path: ${{ runner.temp }}/r31-frozen-source.txt
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
    - name: Identity, baseline and manifest checks
      run: 'set -o pipefail

        mkdir -p r31v

        test "$(git rev-parse HEAD)" = "$R31_EXPECTED_SOURCE"

        git fetch --no-tags origin refs/heads/construction/r31-final-20261104:refs/remotes/origin/construction/r31-final-20261104

        git merge-base --is-ancestor "$R31_EXPECTED_SOURCE" refs/remotes/origin/construction/r31-final-20261104

        git rev-parse HEAD > r31v/source-commit.txt

        python3 -B scripts/r967_semantic_identity.py --check | tee r31v/r967.txt

        python3 -B tools/r31/test_verify_baseline.py 2>&1 | tail -n 20 | tee r31v/test_verify_baseline.txt

        python3 -B tools/r31/verify_baseline.py --identity-only > r31v/baseline.json

        python3 -B tools/r31/verification_receipt.py --check-manifest | tee r31v/manifest-check.json

        python3 -B tools/r31/test_verification_receipt.py 2>&1 | tail -n 20 | tee r31v/verification-receipt-selftest.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31v-baseline
        path: r31v/
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
    needs:
    - freeze
  contracts:
    needs:
    - baseline
    - freeze
    - targeted_android
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: eval sdkmanager $SDK_PACKAGES > /dev/null
    - uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
    - name: Gradle distribution (cached; fetched with retries; a download timeout is infrastructure, not a result)
      run: for i in 1 2 3 4 5 6 7 8; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "gradle distribution attempt
        $i failed"; sleep $((i*45)); done; exit 1
    - name: Current invocation of the complete cumulative engineering gate
      run: 'mkdir -p r31v

        export R31_INVOCATION_ID=$(python3 -c ''import uuid;print(uuid.uuid4())'')

        set +e

        python3 -B tools/r31/run_current_acceptance.py --batch K11 --out "$RUNNER_TEMP/r31-current"

        gate_exit=$?

        set -e

        cp -a "$RUNNER_TEMP/r31-current" r31v/current

        python3 - <<''PYHOST''

        import json

        s=json.load(open(''r31v/current/BUILD_SUMMARY.json''))

        json.dump({h[''id'']:h[''status''] for h in s[''host'']},open(''r31v/host-results.json'',''w''),indent=1)

        PYHOST

        exit "$gate_exit"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31v-contracts
        path: 'r31v/

          app/build/test-results/testDebugUnitTest/

          app/build/reports/lint-results-debug.*

          '
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  android_build:
    needs:
    - baseline
    - freeze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
    - id: devicekey
      uses: actions/cache/restore@v4
      with:
        path: ~/.starcore/r27-ci-temp-key
        key: starcore-r27-ci-temp-signing-v1
        fail-on-cache-miss: true
    - name: Reuse the installed application's exact signing identity
      env:
        DUOQU_SECRET: ${{ secrets.DUOQU_API_KEY }}
      run: "set -euo pipefail\nV=\"$RUNNER_TEMP/r31v\"; mkdir -p \"$V\"\nK=\"$HOME/.starcore/r27-ci-temp-key\"\nDEVICE_CERT=d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7\n\
        if [ -f \"$K/r27-ci.p12\" ] && [ -s \"$K/pw\" ]; then\n  pw=$(cat \"$K/pw\"); echo \"::add-mask::$pw\"\n  cert=$(keytool\
        \ -exportcert -keystore \"$K/r27-ci.p12\" -storetype PKCS12 -alias starcore-r13 -storepass \"$pw\" | sha256sum | cut\
        \ -c1-64)\n  [ \"$cert\" = \"$DEVICE_CERT\" ] || { echo \"INSTALLED_SIGNER_MISMATCH $cert\"; exit 1; }\n  { echo \"\
        R13_SIGNING_P12=$K/r27-ci.p12\"; echo \"R13_SIGNING_PASSWORD=$pw\"; echo \"R13_EXPECTED_CERT_SHA256=$cert\"; echo\
        \ \"R31_SIGNING=EXISTING_DEVICE_IDENTITY\"; } >> \"$GITHUB_ENV\"\n  echo \"EXISTING_DEVICE_IDENTITY: installed R31\
        \ 577311020 signer $cert\" > \"$V/signing.txt\"\nelse\n  echo \"NOT_AVAILABLE: installed signer private material was\
        \ not restored; no replacement key is generated\" > \"$V/signing.txt\"\n  exit 1\nfi\nif [ -n \"$DUOQU_SECRET\" ];\
        \ then echo \"::add-mask::$DUOQU_SECRET\"; echo \"DUOQU_API_KEY=$DUOQU_SECRET\" >> \"$GITHUB_ENV\"; else echo \"RELEASE_API_SECRET_UNAVAILABLE\"\
        ; exit 1; fi\n"
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: eval sdkmanager $SDK_PACKAGES > /dev/null
    - uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
    - name: Gradle distribution (cached; fetched with retries; a download timeout is infrastructure, not a result)
      run: for i in 1 2 3 4 5 6 7 8; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "gradle distribution attempt
        $i failed"; sleep $((i*45)); done; exit 1
    - name: Require the source-call inventory frozen from these sources
      run: python3 scripts/r982_source_call_asset.py
    - name: Build the real APKs
      run: 'set -o pipefail

        REL=""

        if [ "$R31_SIGNING" != "NOT_AVAILABLE" ] && [ -n "${DUOQU_API_KEY:-}" ]; then REL=":app:assembleRelease"; else echo
        "RELEASE_NOT_BUILT signing=$R31_SIGNING" >> "$RUNNER_TEMP/r31v/signing.txt"; fi

        ./gradlew --no-daemon -Pr30Instrumentation=true :app:assembleDebug :app:assembleDebugAndroidTest $REL 2>&1 | tail
        -n 150

        '
    - name: Signature, badging and digests of what was built
      run: "B=\"$ANDROID_HOME/build-tools/36.0.0\"\nmkdir -p r31v && cp \"$RUNNER_TEMP/r31v/signing.txt\" r31v/signing.txt\n\
        for f in $(ls app/build/outputs/apk/*/*.apk app/build/outputs/apk/androidTest/*/*.apk 2>/dev/null); do\n  n=$(basename\
        \ \"$f\" .apk)\n  \"$B/apksigner\" verify --verbose --print-certs \"$f\" > \"r31v/signature-$n.txt\" 2>&1\n  \"$B/aapt\"\
        \ dump badging \"$f\" > \"r31v/badging-$n.txt\"\ndone\nsha256sum app/build/outputs/apk/*/*.apk app/build/outputs/apk/androidTest/*/*.apk\
        \ > r31v/SHA256SUMS.txt\ngit rev-parse HEAD > r31v/source-commit.txt\ncat r31v/signing.txt r31v/SHA256SUMS.txt\n"
    - name: Verify the current production backup and report controls on the fixed large database
      run: 'R31_PHONE_OUT="$RUNNER_TEMP/r31-current-large-report" bash tools/r31/run_phone_report_host.sh

        cp "$RUNNER_TEMP/r31-current-large-report/receipt.json" r31v/HOST_PHONE_REPORT.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31v-android-build
        path: 'r31v/

          app/build/outputs/apk/

          '
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  instrumentation:
    needs:
    - android_build
    - freeze
    - targeted_android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api:
        - 29
        - 34
        - 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
        path: source
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: harness
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: r31v-android-build
        path: built
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api }}
        arch: x86_64
        target: default
        disable-animations: true
        ram-size: 3072M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
        script: cd source && bash ../harness/.github/r31-final-matrix.sh ${{ matrix.api }} "$(ls ../built/app/build/outputs/apk/debug/*.apk
          | head -1)" "$(ls ../built/app/build/outputs/apk/androidTest/debug/*.apk | head -1)" ../r31v/emu-${{ matrix.api
          }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31v-emu-${{ matrix.api }}
        path: r31v/
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  priority_report_runtime:
    needs:
    - android_build
    - freeze
    - targeted_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: r31v-android-build
        path: built
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: default
        disable-animations: true
        ram-size: 3072M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
        script: bash tools/r31/run_r31q_android_delivery.sh built r31v/priority-report-runtime
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31v-priority-report-runtime
        path: r31v/
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  artifact_receipt:
    needs:
    - baseline
    - contracts
    - android_build
    - instrumentation
    - priority_report_runtime
    - freeze
    - targeted_android
    - live_tables
    - report_saf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        path: stages
    - name: Stage receipts from what actually ran
      run: 'mkdir -p receipt

        V=tools/r31/verification_receipt.py

        python3 -B $V --stage baseline --result "${{ needs.baseline.result }}" --no-tests-expected --artifact stages/r31v-baseline/baseline.json
        --out receipt/stage-baseline.json

        python3 -B $V --stage contracts --result "${{ needs.contracts.result }}" --junit stages/r31v-contracts/app/build/test-results/testDebugUnitTest
        --artifact stages/r31v-contracts/r31v/host-results.json --out receipt/stage-contracts.json

        python3 -B $V --stage android_build --result "${{ needs.android_build.result }}" --no-tests-expected --artifact stages/r31v-android-build/r31v/SHA256SUMS.txt
        --out receipt/stage-android_build.json

        python3 -B $V --stage instrumentation --result "${{ needs.instrumentation.result }}" --no-tests-expected --artifact
        stages/r31v-emu-29/emu-29/upgrade/EMU-UPGRADE-RECEIPT.json --artifact stages/r31v-emu-34/emu-34/upgrade/EMU-UPGRADE-RECEIPT.json
        --artifact stages/r31v-emu-35/emu-35/upgrade/EMU-UPGRADE-RECEIPT.json --out receipt/stage-instrumentation.json

        python3 -B $V --stage priority_report_runtime --result "${{ needs.priority_report_runtime.result }}" --no-tests-expected
        --artifact stages/r31v-priority-report-runtime/priority-report-runtime/ANDROID_PROTOCOL_VERIFICATION.json --out receipt/stage-priority_report_runtime.json

        python3 -B $V --stage targeted_android --result "${{ needs.targeted_android.result }}" --no-tests-expected --artifact
        stages/r31-029-critical-targeted-api-29/SELECTED_ANDROID_RECEIPT.json --out receipt/stage-targeted_android.json

        python3 -B $V --stage live_tables --result "${{ needs.live_tables.result }}" --no-tests-expected --artifact stages/r31-029-exact-live-and-sixteen-readers/TABLE_UI_READERS.json
        --out receipt/stage-live_tables.json

        python3 -B $V --stage report_saf --result "${{ needs.report_saf.result }}" --no-tests-expected --artifact stages/r31-029-exact-report-saf-overlay/REPORT_ONLY_RESULT.json
        --out receipt/stage-report_saf.json

        python3 -B $V --aggregate receipt --out receipt/R31_VERIFICATION_RECEIPT.json

        cat receipt/R31_VERIFICATION_RECEIPT.json

        '
    - name: Delivery package from the real build output only
      if: needs.android_build.result == 'success'
      run: 'python3 -B tools/r31/unified_acceptance_report.py --summary stages/r31v-contracts/r31v/current/BUILD_SUMMARY.json
        --out receipt/acceptance

        python3 -B tools/r31/package_release.py create --built stages/r31v-android-build --verification receipt/R31_VERIFICATION_RECEIPT.json
        --acceptance receipt/acceptance --out delivery

        cat delivery/R31_DELIVERY.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31-verification-receipt
        path: 'receipt/

          delivery/

          '
    env:
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  targeted_android:
    needs:
    - android_build
    - freeze
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api:
        - 29
        - 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
        path: source
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: harness
    - uses: actions/download-artifact@v4
      with:
        name: r31v-android-build
        path: built
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api }}
        arch: x86_64
        target: default
        disable-animations: true
        ram-size: 3072M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
        script: cd source && bash ../harness/.github/r31-critical-targeted.sh ../built ../selected-public
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31-029-critical-targeted-api-${{ matrix.api }}
        path: selected-public/
        if-no-files-found: error
  live_tables:
    needs:
    - android_build
    - targeted_android
    - freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
        path: source
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: harness
    - uses: actions/download-artifact@v4
      with:
        name: r31v-android-build
        path: built
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
        log-accepted-android-sdk-licenses: false
    - name: Verify exact source, build checksums and original installed certificate
      working-directory: source
      run: 'set -euo pipefail

        test "$(cat ../built/r31v/source-commit.txt)" = "$SOURCE"

        (cd ../built && sha256sum -c r31v/SHA256SUMS.txt)

        python3 -B tools/r31/verify_baseline.py --require-clean --apk "$(find ../built -name ''*-release.apk'' -print -quit)"
        --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --expected-cert-sha256
        d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7 --output "$RUNNER_TEMP/exact-apk.json" > "$RUNNER_TEMP/exact-apk-check.txt"

        '
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: default
        disable-animations: true
        ram-size: 3072M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
        script: cd source && bash tools/r30-repair/prepare_emulator.sh && python3 -B ../harness/.github/r31-final-current-android.py
          --built ../built --source "$SOURCE" --out ../final-live-public --mode tables
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31-029-exact-live-and-sixteen-readers
        path: final-live-public/
        if-no-files-found: error
    env:
      SOURCE: ${{ needs.freeze.outputs.source }}
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
  report_saf:
    needs:
    - android_build
    - targeted_android
    - freeze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.freeze.outputs.source }}
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: r31v-android-build
        path: built
    - uses: actions/download-artifact@v4
      with:
        name: r31-report-025-signed-build
        run-id: 43417298331
        github-token: ${{ github.token }}
        path: old-built
    - name: Bind existing report harness to the exact current build
      run: 'set -euo pipefail

        test "$(cat built/r31v/source-commit.txt)" = "$SOURCE"

        (cd built && sha256sum -c r31v/SHA256SUMS.txt)

        mkdir final-built

        cp built/app/build/outputs/apk/release/*.apk final-built/

        cp built/r31v/source-commit.txt final-built/

        '
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      env:
        R31_REPORT_STARTUP_WAIT_SECONDS: '120'
      with:
        api-level: 34
        arch: x86_64
        target: default
        disable-animations: true
        ram-size: 3072M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
        script: bash tools/r31/run_phone_report_android.sh final-built final-report-public old-built
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r31-029-exact-report-saf-overlay
        path: final-report-public/
        if-no-files-found: error
    env:
      SOURCE: ${{ needs.freeze.outputs.source }}
      R31_EXPECTED_SOURCE: ${{ needs.freeze.outputs.source }}
