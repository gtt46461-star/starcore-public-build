name: STARCORE R31 EXISTING_R27 exact-source candidate
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r31-EXISTING_R27-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[R31_ARTIFACT_AUDIT]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      source: ${{ steps.request.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/r31-build-request.json
      - id: request
        run: |
          python3 - <<'CODE'
          import json,os,re
          r=json.load(open('.github/r31-build-request.json'))
          assert r.get('sourceBranch')=='construction/r31-final-20261104','R31_SOURCE_BRANCH_REQUIRED'
          assert re.fullmatch('[a-f0-9]{40}',str(r.get('source',''))),'FULL_SOURCE_SHA_REQUIRED'
          assert type(r.get('expectedVersionCode')) is int and r['expectedVersionCode']>0,'VERSION_CODE_REQUIRED'
          assert re.fullmatch('[A-Za-z0-9._+ -]{1,128}',str(r.get('expectedVersionName',''))),'VERSION_NAME_REQUIRED'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('source='+r['source']+'\n')
              output.write('versionCode='+str(r['expectedVersionCode'])+'\n')
              output.write('versionName='+r['expectedVersionName']+'\n')
          CODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/r27-ci-temp-key
          key: starcore-r27-ci-temp-signing-v1
          fail-on-cache-miss: true
      - name: Reuse the existing R27 certificate only (no new key)
        env:
          R29_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib
          root=pathlib.Path.home()/'.starcore/r27-ci-temp-key'
          key=root/'r27-ci.p12'; password_file=root/'pw'
          if not key.is_file() or not password_file.is_file(): raise SystemExit('ORIGINAL_SIGNING_UNAVAILABLE')
          password=password_file.read_text().strip()
          if not password: raise SystemExit('ORIGINAL_SIGNING_UNAVAILABLE')
          print('::add-mask::'+password)
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(key),'-storetype','PKCS12','-alias','starcore-r13','-storepass',password],stderr=subprocess.DEVNULL)
          fingerprint=hashlib.sha256(cert).hexdigest()
          if fingerprint!='d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7': raise SystemExit('R27_SIGNING_CHANGED')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('R13_SIGNING_P12='+str(key)+'\nR13_SIGNING_PASSWORD='+password+'\nR13_EXPECTED_CERT_SHA256='+fingerprint+'\nR29_SIGNING=EXISTING_R27_CI_NOT_OFFICIAL_R13\n')
              credential=os.environ.get('R29_API_KEY','').strip()
              if credential:
                  print('::add-mask::'+credential)
                  out.write('DUOQU_API_KEY='+credential+'\n')
          print('Reused R27 certificate '+fingerprint+'; official R13 upgrade BLOCKED')
          PY
      - name: Map compatibility variables to the same existing key
        run: |
          python3 - <<'PY'
          import os
          required=('R13_SIGNING_P12','R13_SIGNING_PASSWORD','R13_EXPECTED_CERT_SHA256')
          assert all(os.environ.get(key) for key in required),'EXISTING_SIGNING_BINDINGS_UNAVAILABLE'
          mapping={'STARCORE_SIGNING_P12':os.environ['R13_SIGNING_P12'],'STARCORE_SIGNING_PASSWORD':os.environ['R13_SIGNING_PASSWORD'],'STARCORE_SIGNING_KEY_PASSWORD':os.environ['R13_SIGNING_PASSWORD'],'STARCORE_SIGNING_ALIAS':'starcore-r13','STARCORE_SIGNING_TYPE':'PKCS12','STARCORE_EXPECTED_CERT_SHA256':os.environ['R13_EXPECTED_CERT_SHA256']}
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in mapping.items():output.write(key+'='+value+'\n')
          PY
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Validate exact R31 source and committed version
        env:
          EXPECTED_SOURCE: ${{ steps.request.outputs.source }}
          EXPECTED_VERSION_CODE: ${{ steps.request.outputs.versionCode }}
          EXPECTED_VERSION_NAME: ${{ steps.request.outputs.versionName }}
          R31_EXPECTED_CERT_SHA256: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -f tools/r31/verify_baseline.py
          test -f app/src/androidTest/java/com/ethk3/novaonepro/R31RuntimeProtocolInstrumentedTest.java
          timeout 45s git fetch --no-tags origin refs/heads/construction/r31-final-20261104:refs/remotes/origin/construction/r31-final-20261104
          git merge-base --is-ancestor "$EXPECTED_SOURCE" refs/remotes/origin/construction/r31-final-20261104
          git merge-base --is-ancestor 5237b265a27fe5ad27fd842901c445d5f8c27749 "$EXPECTED_SOURCE"
          git diff --exit-code
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          manifest=json.loads(pathlib.Path('release/release_manifest.json').read_text())
          assert manifest['applicationId']=='com.starcore.research.r13','WRONG_APPLICATION_ID'
          assert int(manifest['versionCode'])==int(os.environ['EXPECTED_VERSION_CODE']),'VERSION_CODE_MISMATCH'
          assert manifest['versionName']==os.environ['EXPECTED_VERSION_NAME'],'VERSION_NAME_MISMATCH'
          assert os.environ.get('DUOQU_API_KEY','').strip(),'API_CONFIGURATION_UNAVAILABLE'
          assert os.environ.get('R13_EXPECTED_CERT_SHA256')==os.environ['R31_EXPECTED_CERT_SHA256'],'WRONG_CERTIFICATE_LANE'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-evidence';out.mkdir(parents=True,exist_ok=True)
          record={'sourceCommit':os.environ['EXPECTED_SOURCE'],'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'sourceBranch':'construction/r31-final-20261104','baseline':'5237b265a27fe5ad27fd842901c445d5f8c27749','baselineAncestry':'PASS','requestedSourceAncestry':'PASS','sourceArchive':'https://github.com/gtt46461-star/starcore-public-build/archive/'+os.environ['EXPECTED_SOURCE']+'.zip','versionCode':manifest['versionCode'],'versionName':manifest['versionName']}
          (out/'source-receipt.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Frozen identities, existing verifiers, canonical checks and signed APKs
        id: build_checks
        run: |
          set -euo pipefail
          # Use committed identities. Do not invoke ci_build.sh/rebind_identity.py or PUSH_REF.
          trap 'r31_status=$?; for r31_log in "$RUNNER_TEMP"/r31-evidence/*.log; do if [ -f "$r31_log" ]; then echo "FAILED_CHECK_LOG:$r31_log"; tail -n 120 "$r31_log"; fi; done; exit "$r31_status"' ERR
          python3 scripts/r926_release_manifest.py --check
          python3 scripts/r967_semantic_identity.py --check
          python3 scripts/test_r13_production_ddl.py
          python3 scripts/generate_strategy_su2_schema.py --check
          ./gradlew --no-daemon --max-workers=4 -Pr30Instrumentation=true :app:compileDebugJavaWithJavac 2>&1 | tee "$RUNNER_TEMP/r31-evidence/compile-before-host.log"
          python3 scripts/verify_strategy_su1.py > "$RUNNER_TEMP/r31-evidence/su1.log" 2>&1
          python3 scripts/verify_plan1025.py > "$RUNNER_TEMP/r31-evidence/plan1025.log" 2>&1
          python3 scripts/verify_r26.py > "$RUNNER_TEMP/r31-evidence/r26.log" 2>&1
          ./gradlew --no-daemon --continue --max-workers=4 -Pr30Instrumentation=true :app:verifyCanonicalPlanBuildCP3 :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/r31-evidence/assemble.log"
          grep -Fq 'android:name="com.ethk3.novaonepro.R30FaultAndroidRunner"' app/build/intermediates/packaged_manifests/debugAndroidTest/processDebugAndroidTestManifest/AndroidManifest.xml
          test -f app/src/androidTest/java/com/ethk3/novaonepro/R31RuntimeProtocolInstrumentedTest.java
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          files=sorted(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files,'NO_ACTUAL_JUNIT_XML'
          totals={k:sum(int(ET.parse(f).getroot().get(k,'0')) for f in files) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>0 and totals['failures']==totals['errors']==totals['skipped']==0,totals
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-evidence/unit-summary.json').write_text(json.dumps({'scope':'HOST_UNIT_NOT_ANDROID_OR_NATURAL','suites':len(files),**totals},indent=2)+'\n')
          PY
      - name: Preserve actual unit results even when a gate fails
        if: ${{ always() }}
        env:
          R31_BUILD_CHECKS_OUTCOME: ${{ steps.build_checks.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-evidence'
          out.mkdir(parents=True,exist_ok=True)
          files=sorted(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          rows=[ET.parse(f).getroot() for f in files]
          totals={k:sum(int(row.get(k,'0')) for row in rows) for k in ('tests','failures','errors','skipped')}
          xmlout=out/'unit-xml'
          xmlout.mkdir(exist_ok=True)
          for f in files:shutil.copy2(f,xmlout/f.name)
          state='NOT_RUN' if not files else 'PASS' if totals['tests']>0 and totals['failures']==totals['errors']==totals['skipped']==0 else 'FAILED_OR_INCOMPLETE'
          (out/'unit-execution-observation.json').write_text(json.dumps({'scope':'ACTUAL_HOST_XML_ONLY_NOT_DEVICE_OR_BUSINESS_ACCEPTANCE','state':state,'build_checks_outcome':os.environ['R31_BUILD_CHECKS_OUTCOME'],'suites':len(files),**totals},indent=2)+'\n')
          PY
      - name: Preserve exact signed APK bytes for validation with gates still pending
        id: validation_apks
        if: ${{ always() }}
        env:
          R31_BUILD_CHECKS_OUTCOME: ${{ steps.build_checks.outcome }}
          R31_EXPECTED_CERT_SHA256: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r31-evidence/validation-apks"
          for r31_variant in release debug; do
            r31_apk=$(find "app/build/outputs/apk/$r31_variant" -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$r31_apk"
            python3 tools/r31/verify_baseline.py --require-clean --apk "$r31_apk" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --expected-cert-sha256 "$R31_EXPECTED_CERT_SHA256" --output "$RUNNER_TEMP/r31-evidence/validation-apks/$r31_variant-identity.json"
            cp "$r31_apk" "$RUNNER_TEMP/r31-evidence/validation-apks/STARCORE-R31-validation-$r31_variant.apk"
          done
          r31_test_apk=$(find app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)
          test -n "$r31_test_apk"
          cp "$r31_test_apk" "$RUNNER_TEMP/r31-evidence/validation-apks/STARCORE-R31-instrumentation-only.apk"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-evidence/validation-apks'
          d={'scope':'ACTUAL_SIGNED_VALIDATION_BYTES_NOT_FINAL_ENGINEERING_RELEASE','canonical_build_step_outcome':os.environ['R31_BUILD_CHECKS_OUTCOME'],'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'required_remaining':['all legacy native host gates','Android integration jobs','physical device fault matrix','24h and72h real device run'],'natural_quality':'NOT_PROVEN','apks':{f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.glob('*.apk')}}
          (p/'VALIDATION-BOUNDARY.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Existing production-bytecode and native SQLite host regressions
        if: ${{ !cancelled() && steps.validation_apks.outcome == 'success' }}
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          repair_deps=$(mktemp -d)
          trap 'rm -rf "$repair_deps"' EXIT
          export SQLITE_JDBC="$repair_deps/sqlite-jdbc.jar"
          curl -fLsS --connect-timeout 15 --max-time 90 -o "$SQLITE_JDBC" https://repo.maven.apache.org/maven2/org/xerial/sqlite-jdbc/3.46.1.3/sqlite-jdbc-3.46.1.3.jar
          printf '%s  %s\n' 4a4832720a65eaf7f4d6fd7ede52087b994dc5633c076f9e994dc0c8b4b0b4fa "$SQLITE_JDBC" | sha256sum -c -
          # Isolate legacy test outputs, while reading this exact build's actual compiled classes.
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/r31-host-source"
          git -C "$RUNNER_TEMP/r31-host-source" checkout --detach "$(git rev-parse HEAD)"
          rm -rf "$RUNNER_TEMP/r31-host-source/app/build"
          ln -s "$GITHUB_WORKSPACE/app/build" "$RUNNER_TEMP/r31-host-source/app/build"
          cd "$RUNNER_TEMP/r31-host-source"
          trap 'r31_status=$?; echo "FAILED_HOST_CHECK:${r31_check:-SETUP}"; for r31_log in "$RUNNER_TEMP"/r31-evidence/repair-*.log; do if [ -f "$r31_log" ]; then echo "FAILED_CHECK_LOG:$r31_log"; tail -n 100 "$r31_log"; fi; done; exit "$r31_status"' ERR
          r31_host_failed=0
          for r31_check in diagnosis writer retention timeline commit_failure progress neural qualification input_pin matrix research observatory snapshot; do
            echo "R31_HOST_START:$r31_check"
            if python3 "tools/r30-repair/run_$r31_check""_host.py" > "$RUNNER_TEMP/r31-evidence/repair-$r31_check.log" 2>&1; then
              echo "R31_HOST_PASS:$r31_check"
            else
              r31_status=$?; r31_host_failed=1
              echo "R31_HOST_FAIL:$r31_check:exit=$r31_status"
            fi
          done
          for r31_check in memory pitguard_allocation runtime_memory_control resource_recovery; do
            echo "R31_HOST_START:R31_$r31_check"
            if python3 "tools/r31/verify_$r31_check.py" > "$RUNNER_TEMP/r31-evidence/repair-r31-$r31_check.log" 2>&1; then
              echo "R31_HOST_PASS:R31_$r31_check"
            else
              r31_status=$?; r31_host_failed=1
              echo "R31_HOST_FAIL:R31_$r31_check:exit=$r31_status"
            fi
          done
          for r31_check in task_runtime write_protocol service_protocol runtime_ddl research_schema; do
            echo "R31_HOST_START:R31_$r31_check"
            if python3 "tools/r31/run_$r31_check""_host.py" > "$RUNNER_TEMP/r31-evidence/repair-r31-$r31_check.log" 2>&1; then
              echo "R31_HOST_PASS:R31_$r31_check"
            else
              r31_status=$?; r31_host_failed=1
              echo "R31_HOST_FAIL:R31_$r31_check:exit=$r31_status"
            fi
          done
          for r31_runtime_case in R31RuntimeHealthHost R31ResourceRecoveryConsumerHost; do
            echo "R31_HOST_START:$r31_runtime_case"
            if R31_RUNTIME_HOST_CLASS="$r31_runtime_case" R31_RUNTIME_OUTPUT="verification/r31/ci-scoped-$r31_runtime_case" python3 tools/r31/run_task_runtime_host.py > "$RUNNER_TEMP/r31-evidence/repair-$r31_runtime_case.log" 2>&1; then
              echo "R31_HOST_PASS:$r31_runtime_case"
            else
              r31_status=$?; r31_host_failed=1
              echo "R31_HOST_FAIL:$r31_runtime_case:exit=$r31_status"
            fi
          done
          mkdir -p "$RUNNER_TEMP/r31-evidence/r31-scoped-memory"
          for r31_receipt_dir in verification/r31/memory verification/r31/p02/pitguard-allocation verification/r31/p02/runtime-memory-control verification/r31/p02/resource-recovery verification/r31/p01/task-runtime verification/r31/p02/service-protocol verification/r31/p01/write-protocol verification/r31/p02/runtime-ddl-hotspots verification/r31/p02/research-schema verification/r31/ci-scoped-R31RuntimeHealthHost verification/r31/ci-scoped-R31ResourceRecoveryConsumerHost; do
            if [ -d "$r31_receipt_dir" ]; then cp -a "$r31_receipt_dir" "$RUNNER_TEMP/r31-evidence/r31-scoped-memory/"; fi
          done
          if [ "$r31_host_failed" -ne 0 ]; then
            echo R31_HOST_MATRIX_HAS_REAL_FAILURES_OTHER_CHECKS_EXECUTED
            exit 1
          fi
      - name: Inspect actual signed bytes and package an explicit build candidate
        env:
          EXPECTED_SOURCE: ${{ steps.request.outputs.source }}
          EXPECTED_VERSION_CODE: ${{ steps.request.outputs.versionCode }}
          EXPECTED_VERSION_NAME: ${{ steps.request.outputs.versionName }}
          R31_EXPECTED_CERT_SHA256: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7
          R31_SIGNING_LANE: EXISTING_R27
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code
          for variant in release debug; do
            apk=$(find "app/build/outputs/apk/$variant" -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$apk"
            python3 tools/r31/verify_baseline.py --require-clean --apk "$apk" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --expected-cert-sha256 "$R31_EXPECTED_CERT_SHA256" --output "$RUNNER_TEMP/r31-evidence/$variant-r31-identity.json"
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,subprocess,zipfile
          root=pathlib.Path('.');evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-evidence';out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-candidate'
          source=os.environ['EXPECTED_SOURCE'];lane=os.environ['R31_SIGNING_LANE'];cert_expected=os.environ['R31_EXPECTED_CERT_SHA256']
          assert os.environ['R13_EXPECTED_CERT_SHA256']==cert_expected,'WRONG_CERTIFICATE_LANE'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).strip(),'DIRTY_SOURCE_NO_DELIVERY'
          out.mkdir(exist_ok=True);tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          source_receipt=json.loads((evidence/'source-receipt.json').read_text());rows=[]
          for variant in ('release','debug'):
              identity=json.loads((evidence/(variant+'-r31-identity.json')).read_text())
              assert identity['status']=='PASS' and identity['apk']['status']=='PASS'
              assert identity['identity']['source_dirty'] is False and identity['apk']['embedded_source_dirty'] is False
              assert identity['identity']['source_commit']==source and identity['identity']['source_tree']==source_receipt['sourceTree']
              candidates=list((root/'app/build/outputs/apk'/variant).glob('*.apk'));assert len(candidates)==1,'EXACTLY_ONE_'+variant+'_APK_REQUIRED'
              apk=candidates[0];row=identity['apk']
              assert row['application_id']=='com.starcore.research.r13' and row['certificate_sha256']==[cert_expected]
              assert row['version_code']==int(os.environ['EXPECTED_VERSION_CODE']) and row['version_name']==os.environ['EXPECTED_VERSION_NAME']
              assert row['sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and row['bytes']==apk.stat().st_size
              signature=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
              name='STARCORE-R31-'+lane+'-'+source[:12]+'-'+variant+'.apk';shutil.copy2(apk,out/name)
              record={'apk':name,'lane':lane,'variant':variant,'sourceCommit':source,'sourceTree':source_receipt['sourceTree'],'sourceArchive':source_receipt['sourceArchive'],'package':row['application_id'],'versionCode':row['version_code'],'versionName':row['version_name'],'certificateSha256':cert_expected,'sha256':row['sha256'],'bytes':row['bytes'],'abis':row['abis'],'embeddedSourceDirty':False,'r31IdentityEvidence':variant+'-r31-identity.json','artifactRole':'BUILT_EXACT_SOURCE_PENDING_ANDROID_GATES','overall':'BUILD_PASS_ACCEPTANCE_SEPARATE','physicalDevice':'NOT_RUN','device24h':'NOT_RUN','device72h':'NOT_RUN','naturalQuality':'NOT_PROVEN'}
              rows.append(record)
              (out/(variant+'-public-certificate.txt')).write_text(signature)
              shutil.copy2(evidence/(variant+'-r31-identity.json'),out/(variant+'-r31-identity.json'))
          test_apks=list((root/'app/build/outputs/apk/androidTest/debug').glob('*.apk'));assert len(test_apks)==1,'EXACTLY_ONE_TEST_APK_REQUIRED'
          test_apk=test_apks[0]
          signature=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(test_apk)],text=True)
          assert re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})',signature).group(1)==cert_expected,'TEST_CERTIFICATE_MISMATCH'
          package=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(test_apk)],text=True).splitlines()[0]
          assert "name='com.starcore.research.r13.test'" in package,'WRONG_TEST_APPLICATION_ID'
          test_name='STARCORE-R31-'+lane+'-'+source[:12]+'-androidTest.apk';shutil.copy2(test_apk,out/test_name)
          (out/'androidTest-public-certificate.txt').write_text(signature)
          (out/'delivery.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          shutil.copy2(evidence/'source-receipt.json',out/'source-receipt.json')
          shutil.copy2(evidence/'unit-summary.json',out/'unit-summary.json')
          shutil.copy2(root/'construction/r31/EXECUTION_LEDGER.json',out/'EXECUTION_LEDGER.json')
          acceptance={'sourceCommit':source,'build':'PASS','unitTests':'PASS','androidRuntime':'NOT_RUN_BY_BUILD_JOB','physicalDevice':'NOT_RUN','device24h':'NOT_RUN','device72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','cardImplementation':'SEE_EXECUTION_LEDGER_NOT_INFERRED_FROM_BUILD','deviceInstalledCertificate':'UNKNOWN_NOT_CAPTURED'}
          (out/'ACCEPTANCE.json').write_text(json.dumps(acceptance,ensure_ascii=False,indent=2)+'\n')
          (out/'README_ZH.md').write_text('# STARCORE R31 实际签名构建候选包\n\n本包由完整源码 '+source+' 构建。应用身份 com.starcore.research.r13，签名通道 '+lane+'，指纹 '+cert_expected+'。\n\n源码入口：https://github.com/gtt46461-star/starcore-public-build/tree/'+source+'\n完整快照：https://github.com/gtt46461-star/starcore-public-build/archive/'+source+'.zip\n\n请以 delivery.json 的实际 APK 哈希和版本为准。构建通过不等于全部施工卡、真机持续运行或自然策略质量通过；真实状态见 ACCEPTANCE.json、EXECUTION_LEDGER.json 和独立 CI Android 产物。升级兼容性需核对设备现有应用签名；本流程没有读取用户设备的实际签名。\n')
          release_name=next(row['apk'] for row in rows if row['variant']=='release')
          with zipfile.ZipFile(out/('STARCORE-R31-'+lane+'-'+source[:12]+'-DELIVERY.zip'),'w',zipfile.ZIP_DEFLATED) as z:
              included=[release_name,'delivery.json','source-receipt.json','unit-summary.json','EXECUTION_LEDGER.json','ACCEPTANCE.json','README_ZH.md','release-public-certificate.txt','release-r31-identity.json']
              payloads={name:(out/name).read_bytes() for name in included}
              payloads['delivery.json']=(json.dumps([row for row in rows if row['variant']=='release'],ensure_ascii=False,indent=2)+'\n').encode()
              for name,data in payloads.items():z.writestr(name,data)
              z.writestr('SHA256SUMS.txt',''.join(hashlib.sha256(data).hexdigest()+'  '+name+'\n' for name,data in payloads.items()))
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          print(json.dumps({'sourceCommit':source,'lane':lane,'apks':rows,'scope':'REAL_BUILD_NOT_PHYSICAL_OR_NATURAL'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R31-EXISTING_R27-CANDIDATE-${{ steps.request.outputs.source }}
          path: ${{ runner.temp }}/r31-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-EXISTING_R27-HOST-EVIDENCE-${{ steps.request.outputs.source }}
          path: |
            ${{ runner.temp }}/r31-evidence/
            app/build/test-results/
            app/build/reports/
  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: R31-EXISTING_R27-CANDIDATE-${{ needs.build.outputs.source }}
          path: candidate
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the temporary emulator test script
        run: |
          cat > "$RUNNER_TEMP/r31-emulator-probe.sh" <<'R31_CI_PROBE'
          set -euo pipefail
          out=evidence/r31/android-${{ matrix.api }}
          mkdir -p "$out"
          bash tools/r30-repair/prepare_emulator.sh
          adb install -r "$(find candidate -name '*-release.apk' -print -quit)"
          python3 scripts/probe_r13_startup.py --installed
          cp -a startup-evidence "$out/release-startup"
          adb install -r "$(find candidate -name '*-debug.apk' -print -quit)"
          adb install -r -t "$(find candidate -name '*-androidTest.apk' -print -quit)"
          adb shell am force-stop com.starcore.research.r13
          adb logcat -c
          adb shell am instrument -w -r -e r30Sandbox "r31-ci-$GITHUB_RUN_ID" -e class com.ethk3.novaonepro.R31RuntimeProtocolInstrumentedTest,com.ethk3.novaonepro.R31StorageProtocolInstrumentedTest,com.ethk3.novaonepro.R31OwnerFenceProtocolInstrumentedTest com.starcore.research.r13.test/com.ethk3.novaonepro.R30FaultAndroidRunner > "$out/r31-protocol.txt" 2>&1
          adb logcat -d -v threadtime > "$out/r31-protocol-logcat.txt"
          python3 - "$out" <<'PY'
          import hashlib,json,pathlib,re,subprocess,sys
          out=pathlib.Path(sys.argv[1]);raw=(out/'r31-protocol.txt').read_bytes();text=raw.decode()
          found=re.search(r'OK \((\d+) tests?\)',text)
          assert found and int(found.group(1))==10 and 'FAILURES!!!' not in text and 'INSTRUMENTATION_FAILED' not in text,'R31_ACTUAL_INSTRUMENTATION_FAILED'
          record={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scope':'ACTUAL_ANDROID_EMULATOR_DEBUG_INSTRUMENTATION','tests':int(found.group(1)),'result':'PASS','apiLevel':subprocess.check_output(['adb','shell','getprop','ro.build.version.sdk'],text=True).strip(),'serial':subprocess.check_output(['adb','get-serialno'],text=True).strip(),'physicalDevice':'NOT_RUN','device24h':'NOT_RUN','device72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','outputSha256':hashlib.sha256(raw).hexdigest()}
          (out/'r31-protocol-receipt.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          bash tools/r30/run_fault_matrix.sh "$out/existing-fault-matrix"
          bash tools/r30-repair/run_research_fault_matrix.sh "$out/existing-research-fault-matrix"
          R31_CI_PROBE
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash "$RUNNER_TEMP/r31-emulator-probe.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-EXISTING_R27-ANDROID-${{ matrix.api }}-${{ needs.build.outputs.source }}
          path: |
            evidence/r31/android-${{ matrix.api }}/
            startup-evidence/
  artifact-audit:
    if: ${{ contains(github.event.head_commit.message, '[R31_ARTIFACT_AUDIT]') && !contains(github.event.head_commit.message, '[R31_PROTOCOL_LOGS]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.audit_request.outputs.source }}
      original_run: ${{ steps.audit_request.outputs.validationRunId }}
      artifact_name: ${{ steps.audit_request.outputs.validationArtifactName }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/r31-build-request.json
      - id: audit_request
        run: |
          python3 - <<'PY'
          import json,os,re
          r=json.load(open('.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert re.fullmatch('[a-f0-9]{40}',r['source'])
          assert type(r['validationRunId']) is int and type(r['validationArtifactId']) is int
          assert r['validationArtifactName']=='R31-EXISTING_R27-HOST-EVIDENCE-'+r['source']
          assert re.fullmatch('sha256:[a-f0-9]{64}',r['validationArtifactDigest'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key in ('source','validationRunId','validationArtifactName','validationArtifactId','validationArtifactDigest'):
                  out.write(key+'='+str(r[key])+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.audit_request.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.audit_request.outputs.validationArtifactName }}
          run-id: ${{ steps.audit_request.outputs.validationRunId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/r31-validation-input
      - name: Independently inspect actual APKs and archive the exact source checkpoint
        env:
          R31_EXPECTED_SOURCE: ${{ steps.audit_request.outputs.source }}
          R31_ORIGINAL_RUN: ${{ steps.audit_request.outputs.validationRunId }}
          R31_ORIGINAL_ARTIFACT: ${{ steps.audit_request.outputs.validationArtifactId }}
          R31_ORIGINAL_ARTIFACT_DIGEST: ${{ steps.audit_request.outputs.validationArtifactDigest }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r31-audited-checkpoint"
          mkdir -p "$out"
          git rev-parse HEAD
          git rev-parse --is-shallow-repository
          git status --short
          git diff --exit-code || { echo R31_AUDIT_WORKTREE_DIRTY; exit 1; }
          test "$(git rev-parse HEAD)" = "$R31_EXPECTED_SOURCE" || { echo R31_AUDIT_UNEXPECTED_SOURCE; exit 1; }
          git merge-base --is-ancestor 5237b265a27fe5ad27fd842901c445d5f8c27749 HEAD || { echo R31_AUDIT_BASELINE_ANCESTRY_REJECTED; git log -5 --oneline; exit 1; }
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-validation-input'
          files=list(root.rglob('VALIDATION-BOUNDARY.json'))
          assert len(files)==1,('EXACTLY_ONE_ORIGINAL_VALIDATION_BOUNDARY_REQUIRED',[str(p.relative_to(root)) for p in files])
          evidence=files[0].parent.parent.resolve()
          assert evidence.is_relative_to(root.resolve())
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-validation-evidence-root.txt').write_text(str(evidence)+'\n')
          print('R31_ACTUAL_ARTIFACT_EVIDENCE_ROOT|'+str(evidence.relative_to(root.resolve())))
          PY
          IFS= read -r R31_VALIDATION_EVIDENCE_ROOT < "$RUNNER_TEMP/r31-validation-evidence-root.txt"
          export R31_VALIDATION_EVIDENCE_ROOT
          for variant in release debug; do
            apk="$R31_VALIDATION_EVIDENCE_ROOT/validation-apks/STARCORE-R31-validation-$variant.apk"
            test -f "$apk" || { echo "R31_ACTUAL_APK_MISSING:$variant"; exit 1; }
            python3 tools/r31/verify_baseline.py --require-clean --apk "$apk" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --expected-cert-sha256 d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7 --output "$out/$variant-identity.json"
          done
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,shutil,subprocess,zipfile
          source=os.environ['R31_EXPECTED_SOURCE'];root=pathlib.Path('.')
          original=pathlib.Path(os.environ['R31_VALIDATION_EVIDENCE_ROOT'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-audited-checkpoint'
          cert='d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7'
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):h.update(b)
              return h.hexdigest()
          boundary=json.loads((original/'validation-apks/VALIDATION-BOUNDARY.json').read_text())
          assert boundary['source']==source
          unit=json.loads((original/'unit-execution-observation.json').read_text())
          release=json.loads((root/'release/release_manifest.json').read_text())
          apks=[]
          for variant in ('release','debug'):
              identity=json.loads((out/(variant+'-identity.json')).read_text())
              assert identity['status']=='PASS' and identity['apk']['status']=='PASS'
              assert identity['identity']['source_commit']==source
              assert identity['identity']['source_dirty'] is False
              a=identity['apk']
              assert a['embedded_source_dirty'] is False
              assert a['application_id']=='com.starcore.research.r13'
              assert a['certificate_sha256']==[cert]
              assert a['version_code']==release['versionCode'] and a['version_name']==release['versionName']
              inp=original/'validation-apks'/('STARCORE-R31-validation-'+variant+'.apk')
              assert sha(inp)==a['sha256'] and inp.stat().st_size==a['bytes']
              assert boundary['apks'][inp.name]['sha256']==sha(inp)
              name='STARCORE-R31-'+source[:12]+'-VALIDATION-'+variant+'.apk'
              shutil.copy2(inp,out/name)
              apks.append({'file':name,'variant':variant,'source_commit':source,'source_tree':identity['identity']['source_tree'],'applicationId':a['application_id'],'versionCode':a['version_code'],'versionName':a['version_name'],'signatureSha256':cert,'sha256':a['sha256'],'bytes':a['bytes'],'abis':a['abis'],'identity':'PASS_ACTUAL_SIGNATURE_AND_EMBEDDED_SOURCE','engineeringAcceptance':'FAILED_GATES_REMAIN','installedDeviceCompatibility':'UNKNOWN_INSTALLED_CERT_AND_VERSION'})
          inp=original/'validation-apks/STARCORE-R31-instrumentation-only.apk'
          assert inp.is_file()
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          signature=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(inp)],text=True)
          fingerprint=re.search(r'Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9]+)',signature)
          assert fingerprint and fingerprint.group(1).lower()==cert
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(inp)],text=True)
          assert "package: name='com.starcore.research.r13.test'" in badging
          assert boundary['apks'][inp.name]['sha256']==sha(inp)
          companion={'file':'ENGINEERING-TEST-ONLY.apk','applicationId':'com.starcore.research.r13.test','sha256':sha(inp),'signatureSha256':cert,'bytes':inp.stat().st_size,'role':'ISOLATED_INSTRUMENTATION_COMPANION_NOT_MAIN_APPLICATION','deviceExecution':'NOT_RUN'}
          shutil.copy2(inp,out/'ENGINEERING-TEST-ONLY.apk')
          ledger=json.loads((root/'construction/r31/EXECUTION_LEDGER.json').read_text())
          unfinished=[{'id':c['id'],'title':c['title'],'phase':c['phase'],'status':c['status'],'remaining':c['remaining'],'next_step':c['next_step']} for c in ledger['cards'] if c['status']!='DEVICE_PASS']
          (out/'UNFINISHED-CARDS.json').write_text(json.dumps(unfinished,ensure_ascii=False,indent=2)+'\n')
          (out/'ORIGINAL-UNIT-RESULT.json').write_text(json.dumps(unit,ensure_ascii=False,indent=2)+'\n')
          (out/'ORIGINAL-VALIDATION-BOUNDARY.json').write_text(json.dumps(boundary,ensure_ascii=False,indent=2)+'\n')
          forbidden=subprocess.check_output(['git','ls-files','*.jks','*.p12','*.pfx','*.keystore'],text=True).strip()
          assert not forbidden,'SIGNING_CONTAINER_TRACKED_NO_SOURCE_EXPORT'
          source_zip=out/('SOURCE-'+source+'.zip')
          subprocess.run(['git','archive','--format=zip','--output',str(source_zip),'HEAD'],check=True)
          notes=('STARCORE R31 SOURCE CHECKPOINT / VALIDATION ONLY\n'
                 'This is an actual signed build of source '+source+'.\n'
                 'It is NOT the final accepted R31 product. Engineering gates failed in the original run.\n'
                 'Current construction phase P02 (B03/B04/B05 front); 18 of56 cards started,0 mandatory closed.\n'
                 'Original unit result is included verbatim. Native HOST diagnosis and Android API21 lint remain unresolved.\n'
                 'Android runtime instrumented tests: NOT_RUN. Physical device,24h and72h: NOT_RUN; user has no connectable device.\n'
                 'Natural future quality: NOT_PROVEN. No historical/synthetic/shadow result grants natural quality.\n'
                 'The release and debug APKs share public applicationId com.starcore.research.r13 and the original5237 public R30 certificate.\n'
                 'Coverage install is conditional on the installed certificate/version. No uninstall or database reset is authorized by this package.\n'
                 'ENGINEERING-TEST-ONLY.apk is an instrumentation companion, not the application.\n'
                 'Migration contracts are in release/release_manifest.json and construction/r31/EXECUTION_LEDGER.json in the source archive.\n'
                 'Additive domain migrations have HOST evidence; actual device upgrade/restore remains NOT_RUN.\n'
                 'Do not delete r27_chart_cache/mainline/choice before P05 typed authority switch.\n'
                 'Signing private keys, signing cache and GitHub tokens are not part of this archive.\n'
                 'New private-buffer revisions after this source checkpoint are not included.\n')
          (out/'DELIVERY-READ-ME.txt').write_text(notes)
          receipt={'scope':'ACTUAL_SIGNED_APK_CHECKPOINT_WITH_FAILED_ENGINEERING_GATES_NOT_FINAL_PRODUCT','observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':source,'source_url':'https://github.com/gtt46461-star/starcore-public-build/tree/'+source,'source_archive':source_zip.name,'source_archive_sha256':sha(source_zip),'original_run':int(os.environ['R31_ORIGINAL_RUN']),'original_artifact':int(os.environ['R31_ORIGINAL_ARTIFACT']),'original_artifact_zip_digest_from_GitHub':os.environ['R31_ORIGINAL_ARTIFACT_DIGEST'],'original_unit':unit,'apks':apks,'mandatory_closed_cards':0,'physical_device':'NOT_RUN_USER_CONFIRMED_UNAVAILABLE','24h':'NOT_RUN','72h':'NOT_RUN','natural_quality':'NOT_PROVEN','overall':'FAILED_ENGINEERING_GATES_CONTINUE_REPAIR'}
          receipt['instrumentation_companion']=companion
          (out/'DELIVERY-RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          bundle=out/('STARCORE-R31-'+source[:12]+'-VALIDATION-FAILED-GATES.zip')
          members=[p for p in out.iterdir() if p.is_file() and p!=bundle]
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(members):z.write(p,p.name)
          with zipfile.ZipFile(bundle) as z:assert z.testzip() is None
          digest={'file':bundle.name,'sha256':sha(bundle),'bytes':bundle.stat().st_size,'source':source,'engineeringAcceptance':'FAILED_NOT_FINAL_PRODUCT'}
          (out/'BUNDLE-SHA256.json').write_text(json.dumps(digest,indent=2)+'\n')
          print('R31_ACTUAL_APK_RECEIPT_JSON|'+json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          print('R31_ACTUAL_BUNDLE_JSON|'+json.dumps(digest,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-AUDITED-VALIDATION-${{ steps.audit_request.outputs.source }}
          path: ${{ runner.temp }}/r31-audited-checkpoint/
          if-no-files-found: error
          retention-days: 90
  artifact-audit-android:
    needs: artifact-audit
    if: ${{ always() && contains(github.event.head_commit.message, '[R31_ARTIFACT_AUDIT]') && needs['artifact-audit'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29,35]
    env:
      R31_VALIDATION_SOURCE: ${{ needs['artifact-audit'].outputs.source }}
      R31_EMULATOR_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs['artifact-audit'].outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs['artifact-audit'].outputs.artifact_name }}
          run-id: ${{ needs['artifact-audit'].outputs.original_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/r31-validation-input
      - name: Enable disposable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare bounded install and original10-case protocol execution
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          version=json.load(open('release/release_manifest.json'))['versionCode']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-validation-input'
          files=list(root.rglob('VALIDATION-BOUNDARY.json'));assert len(files)==1
          evidence=files[0].parent.parent.resolve();assert evidence.is_relative_to(root.resolve())
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('R31_EXPECTED_VERSION_CODE='+str(version)+'\n')
              f.write('R31_VALIDATION_EVIDENCE_ROOT='+str(evidence)+'\n')
          PY
          cat > "$RUNNER_TEMP/r31-validation-emulator.sh" <<'R31_VALIDATION_PROBE'
          set -euo pipefail
          out="$RUNNER_TEMP/r31-validation-android-$R31_EMULATOR_API"
          mkdir -p "$out"
          inp="$R31_VALIDATION_EVIDENCE_ROOT/validation-apks"
          adb wait-for-device
          adb install -r "$inp/STARCORE-R31-validation-release.apk" > "$out/release-install.txt" 2>&1
          grep -Fq 'Success' "$out/release-install.txt"
          adb shell dumpsys package com.starcore.research.r13 > "$out/release-installed-package.txt"
          adb install -r "$inp/STARCORE-R31-validation-debug.apk" > "$out/debug-cover-install.txt" 2>&1
          grep -Fq 'Success' "$out/debug-cover-install.txt"
          adb install -r "$inp/STARCORE-R31-instrumentation-only.apk" > "$out/test-install.txt" 2>&1
          grep -Fq 'Success' "$out/test-install.txt"
          adb shell dumpsys package com.starcore.research.r13 > "$out/debug-installed-package.txt"
          adb shell am force-stop com.starcore.research.r13
          adb shell am instrument -w -r -e r30Sandbox "r31-audit-$GITHUB_RUN_ID-$R31_EMULATOR_API" -e class com.ethk3.novaonepro.R31RuntimeProtocolInstrumentedTest,com.ethk3.novaonepro.R31StorageProtocolInstrumentedTest,com.ethk3.novaonepro.R31OwnerFenceProtocolInstrumentedTest com.starcore.research.r13.test/com.ethk3.novaonepro.R30FaultAndroidRunner > "$out/protocol.txt" 2>&1
          python3 - "$out" <<'PY'
          import datetime,hashlib,json,os,pathlib,re,subprocess,sys
          p=pathlib.Path(sys.argv[1]);raw=(p/'protocol.txt').read_bytes();text=raw.decode(errors='replace')
          found=re.search(r'OK \((\d+) tests?\)',text)
          passed=bool(found and int(found.group(1))==10 and 'FAILURES!!!' not in text and 'INSTRUMENTATION_FAILED' not in text)
          for kind in ('release','debug'):
              package=(p/(kind+'-installed-package.txt')).read_text()
              assert 'versionCode='+os.environ['R31_EXPECTED_VERSION_CODE'] in package
          receipt={'scope':'ACTUAL_DISPOSABLE_ANDROID_EMULATOR_INSTALL_AND10_ENGINEERING_PROTOCOL_CASES_ON_KNOWN_FAILED_GATE_APK_NOT_FINAL_PRODUCT','observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':os.environ['R31_VALIDATION_SOURCE'],'api':int(os.environ['R31_EMULATOR_API']),'serial':subprocess.check_output(['adb','get-serialno'],text=True).strip(),'releaseInstall':'PASS_ACTUAL_ADB_SUCCESS','sameSignatureDebugCoverInstall':'PASS_ACTUAL_ADB_SUCCESS_CLEAN_TEST_DEVICE_ONLY','instrumentationCompanionInstall':'PASS_ACTUAL_ADB_SUCCESS','protocolTests':int(found.group(1)) if found else None,'protocolResult':'PASS' if passed else 'FAILED_OR_INCOMPLETE','protocolOutputSha256':hashlib.sha256(raw).hexdigest(),'physicalDevice':'NOT_RUN','24h':'NOT_RUN','72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','originalCanonicalFailures':'REMAIN_FAILED; this does not override unit/lint/HOST failures'}
          (p/'RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('R31_EMULATOR_VALIDATION_JSON|'+json.dumps(receipt,sort_keys=True))
          assert passed,'R31_ACTUAL_PROTOCOL_FAILED'
          PY
          R31_VALIDATION_PROBE
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash "$RUNNER_TEMP/r31-validation-emulator.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-VALIDATION-ANDROID-${{ matrix.api }}-${{ needs['artifact-audit'].outputs.source }}
          path: ${{ runner.temp }}/r31-validation-android-${{ matrix.api }}/
          if-no-files-found: error
          retention-days: 90
  protocol-log-audit:
    if: ${{ contains(github.event.head_commit.message, '[R31_PROTOCOL_LOGS]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/r31-build-request.json
      - id: protocol_request
        run: |
          python3 - <<'PY'
          import json,os,re
          r=json.load(open('.github/r31-build-request.json'))
          assert r['sourceBranch']=='construction/r31-final-20261104'
          assert re.fullmatch('[a-f0-9]{40}',r['source'])
          assert type(r['protocolRunId']) is int and r['protocolRunId']>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('source='+r['source']+'\n')
              f.write('run='+str(r['protocolRunId'])+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: R31-VALIDATION-ANDROID-*-${{ steps.protocol_request.outputs.source }}
          run-id: ${{ steps.protocol_request.outputs.run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/r31-protocol-text-input
      - name: Read actual failed emulator output with credential fields redacted
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-protocol-text-input'
          files=sorted(root.rglob('protocol.txt'))
          assert len(files)==2,('EXPECTED_TWO_ACTUAL_EMULATOR_OUTPUTS',[str(p) for p in files])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-protocol-text-audit';out.mkdir()
          records=[]
          for i,p in enumerate(files):
              raw=p.read_bytes();text=raw.decode(errors='replace')
              text=re.sub(r'(?i)(\b(?:api[_-]?key|key|token|secret|password)\s*[=:]\s*)[^\s&]+',r'\1<REDACTED>',text)
              text=re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+',r'\1<REDACTED>',text)
              rel=str(p.relative_to(root));print('R31_ACTUAL_PROTOCOL_FILE|'+rel)
              for line in text.splitlines():print('R31_PROTOCOL_LINE|'+line)
              (out/('protocol-'+str(i)+'-redacted.txt')).write_text(text)
              records.append({'original_file':rel,'original_sha256':hashlib.sha256(raw).hexdigest(),'redacted_sha256':hashlib.sha256(text.encode()).hexdigest(),'scope':'ORIGINAL_FAILED_EMULATOR_OUTPUT_NOT_A_TEST_RERUN_OR_PASS'})
              receipt=p.parent/'RECEIPT.json'
              if receipt.is_file():
                  data=json.loads(receipt.read_text());print('R31_ORIGINAL_EMULATOR_RECEIPT|'+json.dumps(data,sort_keys=True))
          (out/'RECEIPT.json').write_text(json.dumps({'scope':'READ_ONLY_EXISTING_FAILED_ANDROID_LOGS','files':records,'test_result_override':False,'physical_device':'NOT_RUN','natural_quality':'NOT_PROVEN'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-PROTOCOL-LOG-AUDIT-${{ steps.protocol_request.outputs.source }}
          path: ${{ runner.temp }}/r31-protocol-text-audit/
          if-no-files-found: error
          retention-days: 90

  validation-android:
    needs: build
    if: ${{ always() && !contains(github.event.head_commit.message, '[R31_ARTIFACT_AUDIT]') && needs.build.result == 'failure' && needs.build.outputs.source != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29,35]
    env:
      R31_VALIDATION_SOURCE: ${{ needs.build.outputs.source }}
      R31_EMULATOR_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: R31-EXISTING_R27-HOST-EVIDENCE-${{ needs.build.outputs.source }}
          path: ${{ runner.temp }}/r31-validation-input
      - name: Enable disposable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare bounded install and original10-case protocol execution
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          version=json.load(open('release/release_manifest.json'))['versionCode']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r31-validation-input'
          files=list(root.rglob('VALIDATION-BOUNDARY.json'));assert len(files)==1
          evidence=files[0].parent.parent.resolve();assert evidence.is_relative_to(root.resolve())
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('R31_EXPECTED_VERSION_CODE='+str(version)+'\n')
              f.write('R31_VALIDATION_EVIDENCE_ROOT='+str(evidence)+'\n')
          PY
          cat > "$RUNNER_TEMP/r31-validation-emulator.sh" <<'R31_VALIDATION_PROBE'
          set -euo pipefail
          out="$RUNNER_TEMP/r31-validation-android-$R31_EMULATOR_API"
          mkdir -p "$out"
          inp="$R31_VALIDATION_EVIDENCE_ROOT/validation-apks"
          adb wait-for-device
          adb install -r "$inp/STARCORE-R31-validation-release.apk" > "$out/release-install.txt" 2>&1
          grep -Fq 'Success' "$out/release-install.txt"
          adb shell dumpsys package com.starcore.research.r13 > "$out/release-installed-package.txt"
          adb install -r "$inp/STARCORE-R31-validation-debug.apk" > "$out/debug-cover-install.txt" 2>&1
          grep -Fq 'Success' "$out/debug-cover-install.txt"
          adb install -r "$inp/STARCORE-R31-instrumentation-only.apk" > "$out/test-install.txt" 2>&1
          grep -Fq 'Success' "$out/test-install.txt"
          adb shell dumpsys package com.starcore.research.r13 > "$out/debug-installed-package.txt"
          adb shell am force-stop com.starcore.research.r13
          adb shell am instrument -w -r -e r30Sandbox "r31-validation-$GITHUB_RUN_ID-$R31_EMULATOR_API" -e class com.ethk3.novaonepro.R31RuntimeProtocolInstrumentedTest,com.ethk3.novaonepro.R31StorageProtocolInstrumentedTest,com.ethk3.novaonepro.R31OwnerFenceProtocolInstrumentedTest com.starcore.research.r13.test/com.ethk3.novaonepro.R30FaultAndroidRunner > "$out/protocol.txt" 2>&1
          python3 - "$out" <<'PY'
          import datetime,hashlib,json,os,pathlib,re,subprocess,sys
          p=pathlib.Path(sys.argv[1]);raw=(p/'protocol.txt').read_bytes();text=raw.decode(errors='replace')
          found=re.search(r'OK \((\d+) tests?\)',text)
          current={};completed=[]
          for line in text.splitlines():
              if line.startswith('INSTRUMENTATION_STATUS: '):
                  key,sep,value=line[len('INSTRUMENTATION_STATUS: '):].partition('=')
                  if sep:current[key]=value
              elif line.startswith('INSTRUMENTATION_STATUS_CODE: '):
                  code=int(line.split(':',1)[1])
                  if code in (0,-1,-2):completed.append({'class':current.get('class'),'test':current.get('test'),'status_code':code})
                  current={}
          print('R31_ORIGINAL_PROTOCOL_COUNTS|'+json.dumps({'executed':len(completed),'passed':sum(x['status_code']==0 for x in completed),'failed':sum(x['status_code']!=0 for x in completed)}))
          for line in text.splitlines():
              redacted=re.sub(r'(?i)((?:api[_-]?key|password|token)\s*[=:]\s*)[^\s,;]+',r'\1[REDACTED]',line)
              redacted=re.sub(r'(?i)Bearer\s+[^\s]+','Bearer [REDACTED]',redacted)
              print('R31_ORIGINAL_PROTOCOL_LINE|'+redacted)
          passed=bool(found and int(found.group(1))==10 and 'FAILURES!!!' not in text and 'INSTRUMENTATION_FAILED' not in text)
          for kind in ('release','debug'):
              package=(p/(kind+'-installed-package.txt')).read_text()
              assert 'versionCode='+os.environ['R31_EXPECTED_VERSION_CODE'] in package
          receipt={'scope':'ACTUAL_DISPOSABLE_ANDROID_EMULATOR_INSTALL_AND10_ENGINEERING_PROTOCOL_CASES_ON_KNOWN_FAILED_GATE_APK_NOT_FINAL_PRODUCT','observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':os.environ['R31_VALIDATION_SOURCE'],'api':int(os.environ['R31_EMULATOR_API']),'serial':subprocess.check_output(['adb','get-serialno'],text=True).strip(),'releaseInstall':'PASS_ACTUAL_ADB_SUCCESS','sameSignatureDebugCoverInstall':'PASS_ACTUAL_ADB_SUCCESS_CLEAN_TEST_DEVICE_ONLY','instrumentationCompanionInstall':'PASS_ACTUAL_ADB_SUCCESS','protocolTests':int(found.group(1)) if found else len(completed),'actualCompletedCases':completed,'protocolResult':'PASS' if passed else 'FAILED_OR_INCOMPLETE','protocolOutputSha256':hashlib.sha256(raw).hexdigest(),'physicalDevice':'NOT_RUN','24h':'NOT_RUN','72h':'NOT_RUN','naturalQuality':'NOT_PROVEN','originalCanonicalFailures':'REMAIN_FAILED; this does not override unit/lint/HOST failures'}
          (p/'RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('R31_EMULATOR_VALIDATION_JSON|'+json.dumps(receipt,sort_keys=True))
          assert passed,'R31_ACTUAL_PROTOCOL_FAILED'
          PY
          R31_VALIDATION_PROBE
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash "$RUNNER_TEMP/r31-validation-emulator.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R31-VALIDATION-ANDROID-${{ matrix.api }}-${{ needs.build.outputs.source }}
          path: ${{ runner.temp }}/r31-validation-android-${{ matrix.api }}/
          if-no-files-found: error
          retention-days: 90
