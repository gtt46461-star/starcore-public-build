name: R31 023 compile and freeze exact report runtime sources
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r31-build-request.json', '.github/workflows/r31-build-r27.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: r31-current-source-call-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0e1439fa765d524dd2985c2726eb11818d2622b
          fetch-depth: 0
      - name: Require exact source and release identity
        run: |
          test "$(git rev-parse HEAD)" = "c0e1439fa765d524dd2985c2726eb11818d2622b"
          python3 - <<'PY'
          import json
          r=json.load(open('release/release_manifest.json'))
          assert r['applicationId']=='com.starcore.research.r13'
          assert r['versionCode']==577311023
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Compile actual product classes for the provisional inventory only
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pr312Development=true :app:compileDebugJavaWithJavac -x :app:generateR997ConstructionAssets -x :app:generateR967Semantics -x :app:verifyR967Semantics -x :app:verifyFinalR967Semantics 2>&1 | tail -n 120
          python3 -B scripts/r982_source_call_asset.py --freeze --classes app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          python3 -B scripts/r967_semantic_identity.py --check
      - name: Commit only the compiled inventory with a fast-forward lease
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/construction/r31-final-20261104 | cut -f1)
          test "$remote" = "c0e1439fa765d524dd2985c2726eb11818d2622b" || { echo "SOURCE_ADVANCED_REVIEW_REQUIRED"; exit 1; }
          git add release/r982_source_calls.tsv.gz release/r982_source_calls.manifest.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'build(r31): freeze actual 023 report recovery compiled call inventory [skip ci]'
          git push origin HEAD:refs/heads/construction/r31-final-20261104
          echo "FROZEN_SOURCE=$(git rev-parse HEAD)"
          echo "THIS_IS_COMPILE_PROVENANCE_NOT_APK_OR_RUNTIME_ACCEPTANCE"
