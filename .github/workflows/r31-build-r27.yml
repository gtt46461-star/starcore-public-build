           research=read('research12/research-fault-matrix.json')
           for row in research.get('cells',[])[:12]:matrix['research12'].append({'stage':fixed(row.get('stage'),['analysis','consume']),'fault':fixed(row.get('fault'),['BUSY','FULL','CANCEL','KILL','CORRUPT','SOURCE_CHANGE']),'pass':row.get('pass') is True})
           charts=read('charts47/repair-chart-acceptance.json')
