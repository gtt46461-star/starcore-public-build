name: STARCORE R31 fixed-code failure diagnostics
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-publish-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  source-symbols-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abaf5bd42119f02433acac8207a926c520467a2f
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: gtt46461-star/starcore-public-build
          run-id: 43379857398
          name: r31v-emu-35
          path: ${{ runner.temp }}/private-failure-input
      - name: Emit only public source symbols and fixed error enums, never log lines or data
        run: |
          python3 - <<'PY'
          import os,pathlib,re,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-failure-input'
          selectors={'delivery-and-live-service.txt':'delivery_protocol','foreground-kill_freeze-recover.txt':'freeze_foreground','background-kill_freeze-recover.txt':'freeze_background','background-service_stop-run.txt':'service_stop_background','background-service_stop-recover.txt':'service_stop_background_recovery'}
          java=list(pathlib.Path('app/src').rglob('*.java'))
          public_files={p.name for p in java}
          public_text='\n'.join(p.read_text(errors='replace') for p in java)
          public_tests=set(re.findall(r'public void ([A-Za-z0-9_]+)\(',public_text))
          enums={'CENSUS_STALE','STORAGE_BUDGET_CENSUS_STALE','NO_FRESH_API_FETCH','NO_NEW_FUTURE_FREEZE','NO_NEW_FROZEN_SETTLEMENT','BUILD_IDENTITY_ERROR','SCHEMA_PENDING','LEGACY_RUNTIME_SCHEMA','DEDICATED_MIGRATION_OWNER_REQUIRED','MISSING_COLUMN','MISSING_OR_WRONG_OBJECT','F02_CURRENT_RECOVERY_TRANSACTION_FAILED','R31_WRITER_HOLD_FAULT_BACKLOG_PENDING_DURABLE_DRAIN','REPORT_ACK_NEVER_WRITTEN','REPORT_RESOURCE_WAIT','SCHEMA_READINESS','DEPENDENCY'}
          enums.update(x for x in re.findall(r'"([A-Z][A-Z0-9_]{5,100})"',public_text))
          public_schema=set(re.findall(r'\b(?:r26|r27|r29|r30|r31|r35|r36|su1|su2)_[a-z][a-z0-9_]+\b',public_text))
          for p in sorted(root.rglob('*.txt')):
              if p.name not in selectors:continue
              s=p.read_text(errors='replace')
              # Only a failing test's public method and public source call frames
              # are output. No exception message, raw log line, value, private
              # path, URL, report body, database row or credential can be emitted.
              frames=[]
              for cls,method,file,line in re.findall(r'at (com\.ethk3\.novaonepro\.[A-Za-z0-9_.$]+)\.([A-Za-z0-9_$]+)\(([A-Za-z0-9_]+\.java):(\d+)\)',s):
                  if file in public_files:
                      row=[cls,method,file,int(line)]
                      if row not in frames:frames.append(row)
              bad_tests=[]
              for m in re.finditer(r'INSTRUMENTATION_STATUS: stack=',s):
                  end=s.find('INSTRUMENTATION_STATUS_CODE:',m.start())
                  block=s[m.start():end if end>=0 else len(s)]
                  for name in re.findall(r'INSTRUMENTATION_STATUS: test=([A-Za-z0-9_]+)',block):
                      if name in public_tests and name not in bad_tests:bad_tests.append(name)
              tokens=set(re.findall(r'[A-Z][A-Z0-9_]{3,}',s))
              # Schema identifiers are emitted only if they are already literal
              # public repository identifiers and occur in a failure cause.
              cause='\n'.join(x for x in s.splitlines() if 'SCHEMA_PENDING:' in x or 'Caused by:' in x)
              schema=sorted(public_schema.intersection(re.findall(r'\b[a-z][a-z0-9_]+\b',cause)))
              print(json.dumps({'protocol':selectors[p.name],'failedPublicTestMethods':bad_tests,'publicErrorEnums':sorted(tokens.intersection(enums)),'publicSchemaSymbols':schema,'publicSourceFrames':frames},sort_keys=True),flush=True)
          PY
