name: R31 current Android public source diagnostics
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-publish-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6d9a99782cdf7fe7f69efef67d673259dd71c1d
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43395922679
          name: r31v-emu-35
          path: ${{ runner.temp }}/private-current-artifact
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43395922679
          name: r31v-emu-29
          path: ${{ runner.temp }}/private-current-artifact/api29
      - name: Emit only public source symbols and fixed source assertion identifiers
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-current-artifact'
          files=list(pathlib.Path('app/src').rglob('*.java'));names={x.name for x in files}
          safe=list(root.rglob('safe-recovery-failure.json'))
          for p in safe:
              r=json.loads(p.read_text());assert r['sourceCommit']=='e6d9a99782cdf7fe7f69efef67d673259dd71c1d'
              print('SAFE_RECOVERY|'+json.dumps(r,sort_keys=True))
          test=pathlib.Path('app/src/androidTest/java/com/ethk3/novaonepro/R31ChartLifecycleInstrumentedTest.java').read_text()
          literals=re.findall(r'"([^"\n]{12,180})"',test)
          logs=list(root.rglob('ui-lifecycle-100.txt'))
          for p in logs:
              raw=p.read_text(errors='replace')
              frames=[list(x) for x in re.findall(r'at (com\.ethk3\.novaonepro\.[A-Za-z0-9_.$]+)\.([A-Za-z0-9_$]+)\(([A-Za-z0-9_]+\.java):(\d+)\)',raw) if x[2] in names]
              print('UI100_PUBLIC_SOURCE|'+json.dumps({'assertions':[x for x in literals if x in raw and not x.startswith('R31_UI_LIFECYCLE')],'frames':frames[:30]},sort_keys=True))
          source=pathlib.Path('tools/r30-repair/probe_ui_report.py').read_text()
          allowed=set(re.findall(r'[\x27"]([A-Z][A-Z0-9_]{5,})(?=[:\x27"])',source))
          for p in root.rglob('probe-output.txt'):
              raw=p.read_text(errors='replace')
              print('UI_PROBE_PUBLIC_ASSERTIONS|'+json.dumps(sorted({x for x in allowed if x in raw})))
          public_text='\n'.join(p.read_text(errors='replace') for p in files)
          enums=set(re.findall(r'\b[A-Z][A-Z0-9_]{5,80}\b',public_text))
          for filename in ['restore-proof-process.txt','delivery-and-live-service.txt']:
              for p in root.rglob(filename):
                  raw=p.read_text(errors='replace')
                  frames=[list(x) for x in re.findall(r'at (com\.ethk3\.novaonepro\.[A-Za-z0-9_.$]+)\.([A-Za-z0-9_$]+)\(([A-Za-z0-9_]+\.java):(\d+)\)',raw) if x[2] in names]
                  keys=[x for x in re.findall(r'No value for ([A-Za-z][A-Za-z0-9_]*)',raw) if '"'+x+'"' in public_text]
                  print('GROUP_PUBLIC_FAILURE_SYMBOLS|'+json.dumps({'api':29 if 'api29' in p.parts else 35,'group':filename,'sourceEnums':sorted(enums.intersection(re.findall(r'\b[A-Z][A-Z0-9_]{5,80}\b',raw)))[:160],'frames':frames[:45],'missingPublicJsonKeys':sorted(set(keys))},sort_keys=True))
          print('PUBLIC_DIAGNOSTIC_FILES|'+json.dumps({'safeRecovery':len(safe),'ui100':len(logs)}))
          PY

