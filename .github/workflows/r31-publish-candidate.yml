name: R31 current Android public source diagnostics
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-publish-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6d9a99782cdf7fe7f69efef67d673259dd71c1d
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43395877630
          name: r31v-contracts
          path: ${{ runner.temp }}/private-current-artifact
      - name: Emit only public source symbols and fixed source assertion identifiers
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-current-artifact'
          files=list(pathlib.Path('app/src').rglob('*.java'));names={x.name for x in files}
          import xml.etree.ElementTree as ET
          texts='\n'.join(p.read_text(errors='replace') for p in files)
          enums=set(re.findall(r'\b[A-Z][A-Z0-9_]{5,80}\b',texts))
          for p in root.rglob('TEST-*.xml'):
              tree=ET.parse(p)
              for case in tree.findall('.//testcase'):
                  bad=case.find('failure')
                  if bad is None:bad=case.find('error')
                  if bad is None:continue
                  cls=case.get('classname','');method=case.get('name','')
                  assert cls.rsplit('.',1)[-1]+'.java' in names
                  raw=(bad.text or '')+'\n'+bad.get('message','')
                  frames=[list(x) for x in re.findall(r'at (com\.ethk3\.novaonepro\.[A-Za-z0-9_.$]+)\.([A-Za-z0-9_$]+)\(([A-Za-z0-9_]+\.java):(\d+)\)',raw) if x[2] in names]
                  print('FAILED_UNIT_PUBLIC_SOURCE|'+json.dumps({'class':cls,'method':method,'publicEnums':sorted(enums.intersection(re.findall(r'\b[A-Z][A-Z0-9_]{5,80}\b',raw))),'numericComparisons':re.findall(r'expected:<(-?[0-9.]+)> but was:<(-?[0-9.]+)>',raw),'frames':frames[:30]},sort_keys=True))
          java=files+list(pathlib.Path('tools').rglob('*.java'));public='\n'.join(p.read_text(errors='replace') for p in java)
          literals=set(re.findall(r'"([^"\n]{8,200})"',public))
          for p in root.rglob('*'):
              if p.is_file() and 'verify_resource_recovery' in str(p) and p.suffix in ('.log','.txt'):
                  raw=p.read_text(errors='replace')
                  print('RESOURCE_PUBLIC_ASSERTIONS|'+json.dumps({'assertions':sorted(x for x in literals if x in raw and not x.startswith('{'))[:60],'numericComparisons':re.findall(r'expected:<(-?[0-9.]+)> but was:<(-?[0-9.]+)>',raw)},sort_keys=True))
          PY

