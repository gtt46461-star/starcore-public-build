name: R31 exact APK private recovery diagnosis
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-publish-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6d9a99782cdf7fe7f69efef67d673259dd71c1d
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=41,<51'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43395922679
          name: r31v-android-build
          path: ${{ runner.temp }}/built
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify existing APK bytes and signer before fresh execution
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/built"
          sha256sum -c r31v/SHA256SUMS.txt > "$RUNNER_TEMP/apk-hash-check.txt"
          cd "$GITHUB_WORKSPACE"
          python3 -B tools/r31/verify_baseline.py --require-clean --apk "$(find "$RUNNER_TEMP/built/app/build/outputs/apk/debug" -name '*.apk' -print -quit)" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --expected-cert-sha256 d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7 --output "$RUNNER_TEMP/apk-identity.json" > "$RUNNER_TEMP/identity-output.txt"
          git show e64edf1bf775b05a4186e4cb3e35d40239b71edc:tools/r30-repair/probe_ui_report.py > "$RUNNER_TEMP/probe_ui_report.py"
          echo "e73eeec4fca265e819ac34950411f7b59e22e36d95e4c3583c91af275bd990c8  $RUNNER_TEMP/probe_ui_report.py" | sha256sum -c -
          cat > "$RUNNER_TEMP/diagnose.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          adb wait-for-device
          adb install -r -g "$(find "$RUNNER_TEMP/built/app/build/outputs/apk/debug" -name '*.apk' -print -quit)" > "$RUNNER_TEMP/install-app.txt" 2>&1
          adb install -r -g "$(find "$RUNNER_TEMP/built/app/build/outputs/apk/androidTest/debug" -name '*.apk' -print -quit)" > "$RUNNER_TEMP/install-test.txt" 2>&1
          python3 -c 'import importlib.util,os,sys; spec=importlib.util.spec_from_file_location("diag_joint","tools/r31/run_android_joint_protocols.py"); m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);m.SUITES=[s for s in m.SUITES if s[0]!="ui-lifecycle-100"];sys.argv=["diag","--out",os.environ["RUNNER_TEMP"]+"/joint","--sandbox-prefix","r31jsondiag"];m.main()' > "$RUNNER_TEMP/joint-output.txt" 2>&1
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/joint/JOINT-ANDROID-RECEIPT.json'))
          print('FRESH_EXACT_APK_GROUPS|'+json.dumps([{'name':x['name'],'status':x['status'],'observedTests':x.get('observedTests')} for x in r['groups']]))
          PY
          bash tools/r30-repair/prepare_emulator.sh > "$RUNNER_TEMP/prepare.txt" 2>&1
          adb shell am force-stop com.starcore.research.r13
          set +e
          python3 "$RUNNER_TEMP/probe_ui_report.py" --out "$RUNNER_TEMP/private-ui" > "$RUNNER_TEMP/private-ui-output.txt" 2>&1
          result=$?
          set -e
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-ui'/'safe-recovery-failure.json'
          if p.exists(): print('PUBLIC_RECOVERY_SYMBOLS|'+json.dumps(json.loads(p.read_text()),sort_keys=True))
          else: print('RECOVERY_SYMBOL_COLLECTOR_NOT_PRODUCED')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-ui'/'safe-report-semantics.json'
          if p.exists(): print('PUBLIC_REPORT_SEMANTICS|'+json.dumps(json.loads(p.read_text()),sort_keys=True))
          PY
          echo "FRESH_EXACT_APK_UI_EXIT=$result"
          exit "$result"
          SH
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: bash "$RUNNER_TEMP/diagnose.sh"

