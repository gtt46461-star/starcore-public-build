name: STARCORE R32.5.1 exact APK API35 original delivery protocol retest
on:
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/workflows/r31-r3251-c1-api35-delivery-retest.yml']
permissions:
  contents: read
  actions: read
jobs:
  exact_original_delivery_protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb7b49bbcc9266bad548ec37e71403256fc06a4d
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: r3251-C1-android-support-bb7b49bbcc9266bad548ec37e71403256fc06a4d
          run-id: 43796780479
          github-token: ${{ github.token }}
          path: built
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare exact original collector invocation
        run: |
          mkdir -p "$RUNNER_TEMP/r3251-api35-retest"
          cat > "$RUNNER_TEMP/r3251-api35-retest/run.py" <<'PY'
          import hashlib, importlib.util, json, os, pathlib, sys
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r3251-api35-retest/evidence'
          scope={'buildSource':'bb7b49bbcc9266bad548ec37e71403256fc06a4d','originalRun':43796780479,'selectedOriginalGroup':'delivery-and-live-service','expectedOriginalTests':7,'originalLiveFutureFreezeDeadlineMs':360000,'originalAssertionsModified':False,'applicationApksRebuilt':False,'otherPassedApi35Groups':'Retained from original run; not inferred from this selected retest','physicalDevice':'NOT_RUN','naturalQuality':'NOT_PROVEN','apks':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'built').glob('*.apk')}}
          (out.parent/'RETEST_SCOPE.json').write_text(json.dumps(scope,indent=2)+'\n')
          sys.path.insert(0,str(root/'tools/r31'))
          import run_android_joint_protocols as original
          original.SUITES=[s for s in original.SUITES if s[0]=='delivery-and-live-service']
          assert len(original.SUITES)==1 and original.SUITES[0][1]==7
          sys.argv=['run_android_joint_protocols.py','--out',str(out),'--sandbox-prefix','r3251v35-repeat']
          original.main()
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          script: |
            adb install -r -g built/app-debug.apk
            adb install -r -g built/app-debug-androidTest.apk
            python3 "$RUNNER_TEMP/r3251-api35-retest/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3251-bb7-api35-original-delivery-selected-retest
          path: ${{ runner.temp }}/r3251-api35-retest/
          if-no-files-found: error
