name: SU1 verified APK
on:
  push:
    branches: ['construction/su1-20261022']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: su1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: starcore-su1-research-signing-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build and research tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python -m pip install numpy==2.3.5
      - name: Build and verify production source
        run: bash scripts/build_strategy_su1.sh
      - name: Verify and name the installable APK
        run: |
          mkdir -p delivered-apk
          python3 -c 'from pathlib import Path; import shutil; files=list(Path("app/build/outputs/apk/debug").glob("*.apk")); assert len(files)==1,files; shutil.copyfile(files[0],"delivered-apk/STARCORE-SU1.apk")' 
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs delivered-apk/STARCORE-SU1.apk > delivered-apk/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging delivered-apk/STARCORE-SU1.apk > delivered-apk/package.txt
          python3 -c 'from pathlib import Path; p=Path("delivered-apk/package.txt").read_text(); assert "com.starcore.research.su1" in p and "星核创研 SU1" in p, p'
          sha256sum delivered-apk/STARCORE-SU1.apk > delivered-apk/SHA256SUMS.txt
          cp construction/strategy_su1/INSTALL.txt delivered-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: STARCORE-SU1-Install-APK
          path: delivered-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STARCORE-SU1-APK-and-evidence
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            build/strategy_su1-verification.json
            app/build/generated/r967/semantic_manifest.json
            release/r82_training_invalidation.json
            release/research_dependencies_r967.json
          if-no-files-found: warn
  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: STARCORE-SU1-APK-and-evidence
          path: delivered
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SQLite, migration and canonical settlement contracts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r delivered/app/build/outputs/apk/debug/*.apk
            adb install -r delivered/app/build/outputs/apk/androidTest/debug/*.apk
            adb shell am instrument -w -e class com.ethk3.novaonepro.strategyv2.SchemaAndLiveSU1Test com.starcore.research.su1.test/androidx.test.runner.AndroidJUnitRunner > android-su1.txt
            cat android-su1.txt
            python3 -c 'from pathlib import Path; x=Path("android-su1.txt").read_text(); assert "OK (6 tests)" in x and "FAILURES" not in x, x'
            adb shell am start -n com.starcore.research.su1/com.ethk3.novaonepro.MainActivity
            adb shell screencap -p /sdcard/su1-launch.png
            adb pull /sdcard/su1-launch.png su1-launch.png
            adb logcat -d > android-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STARCORE-SU1-Android-runtime
          path: |
            android-su1.txt
            android-logcat.txt
            su1-launch.png
