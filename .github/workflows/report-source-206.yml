name: Prepare verified report source 206
on:
  push:
    branches: ['repair/compact-phone-206-20261127']
    paths: ['engineering/report206/**', '.github/workflows/report-source-206.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate production bindings from the exact 205 parent
        env:
          REPAIR_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          parent=a5b4c26275e7ce74b6a178fe3bbc8ea861a80b5e
          branch=construction/r343-repair-20261126
          git fetch -q --depth=1 origin "refs/heads/$branch"
          [[ "$(git rev-parse FETCH_HEAD)" == "$parent" ]]
          cp engineering/report206/prepare.py "$RUNNER_TEMP/prepare.py"
          git switch --detach "$parent"
          python3 -B "$RUNNER_TEMP/prepare.py"
          git diff --check
          git add -A -- app/src release verification/r343/corrections verification/r36-stubs
          git add --force app/build/generated/r967/semantic_manifest.json app/build/generated/source/r967/com/ethk3/novaonepro/ResearchSemanticsGeneratedR967.java
          git -c user.name='STARCORE release engineering' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save the compact compressed diagnostic ZIP directly to the selected phone document'
          git push origin "HEAD:refs/heads/$branch"
          echo "SOURCE=$(git rev-parse HEAD)"
