name: STARCORE R29.1 source-bound checkpoint
# Push: bind identities and run every suite on the committed R29 source. A signed APK needs an existing signing
# identity; the official R13 key and the R27 CI key live in Actions caches of other branches, so the installable
# R29 APK is built by r29-build.yml on construction/r27-20261028 (same R27 certificate, keeps the phone's data).
on:
  push:
    branches: ['construction/r29-20261029']
    paths-ignore: ['evidence/r29/**', 'construction/r29/**', 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r29-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Identity, all suites (no signing identity on this branch)
        run: bash tools/r29/ci_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R29-HOST-EVIDENCE
          path: |
            evidence/r29/ci/
            app/build/test-results/
            app/build/reports/
