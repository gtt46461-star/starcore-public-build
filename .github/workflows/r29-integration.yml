name: R29 Android batch integration without publication
on:
  push:
    branches: ['construction/su1-20261022']
    paths: ['.github/r29-integration-request.json', '.github/workflows/r29-integration.yml']
permissions:
  contents: read
concurrency:
  group: r29-integration-${{ github.sha }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r29-integration-request.json
      - id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          r=json.load(open('.github/r29-integration-request.json'))
          assert re.fullmatch('[a-f0-9]{40}',r['source'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('source='+r['source']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/su1-api-transport
          key: starcore-su1-api-transport-v1
          fail-on-cache-miss: true
      - name: Use the existing secure CI signing binding
        run: python3 scripts/load_r13_signing.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Compile exact requested source and instrumentation APKs
        run: |
          ./gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee r29-integration-build.log | tail -n 35
          git diff --exit-code -- app/src/main release app/build/generated
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash tools/r29/emulator_integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R29-BATCH-INTEGRATION-${{ steps.request.outputs.source }}
          path: |
            evidence/r29/integration/
            r29-integration-build.log
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
