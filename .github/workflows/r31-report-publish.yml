name: STARCORE R31 report-only direct delivery
true:
  push:
    branches:
    - construction/r31-final-20261104
    paths:
    - release/R31_REPORT_PUBLISH_REQUEST.json
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: request
      run: "python3 - <<'PY'\nimport json,os\nr=json.load(open('release/R31_REPORT_PUBLISH_REQUEST.json'))\nr['reportRunId']=r.get('reportRunId',r['runId'])\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as o:\n    for k in ['runId','reportRunId','artifact','reportArtifact']:\n        o.write(k+'='+str(r[k])+'\\\
        n')\nPY\n"
    - uses: actions/download-artifact@v4
      with:
        name: ${{ steps.request.outputs.artifact }}
        run-id: ${{ steps.request.outputs.runId }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: built
    - uses: actions/download-artifact@v4
      with:
        name: ${{ steps.request.outputs.reportArtifact }}
        run-id: ${{ steps.request.outputs.reportRunId }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: reports
    - name: Verify original signed APK and actual UI/SAF evidence
      run: "set -euo pipefail\nB=\"$ANDROID_HOME/build-tools/$(ls \"$ANDROID_HOME/build-tools\" | sort -V | tail -1)\"\npython3 - <<'PY'\nimport\
        \ hashlib,json,pathlib,re\nrequest=json.load(open('release/R31_REPORT_PUBLISH_REQUEST.json'))\nif request.get('sha256') == 'FROM_ACCEPTED_RELEASE_RECEIPT':\n\
        \    assert request['versionCode'] == 577311026\n    assert request['sourceCommit'] == '3002e30d0ee8d5fe3a8795c2ed3b2f7040920f50'\n  \
        \  results=list(pathlib.Path('reports').rglob('REPORT_ONLY_RESULT.json'))\n    assert len(results)==1\n    result=json.loads(results[0].read_text())\n\
        \    assert result['result']=='PASS' and result['sourceCommit']==request['sourceCommit']\n    assert int(result['runId'])==int(request.get('reportRunId',request['runId']))\n\
        \    digest=result['apkSha256'];assert re.fullmatch('[a-f0-9]{64}',digest)\n    apks=list(pathlib.Path('built').rglob(request['builtApk']));assert\
        \ len(apks)==1\n    with apks[0].open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()\n    assert actual==digest\n\
        \    request['sha256']=digest\npathlib.Path('effective-report-request.json').write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\\\
        n')\nPY\npython3 -B tools/r31/publish_report_package.py --request effective-report-request.json --built built --reports reports --out\
        \ pub --build-tools \"$B\"\n"
    - name: Publish the accepted bytes as direct APK and ZIP downloads
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "python3 - <<'PY'\nimport json,os,pathlib,shutil,subprocess\nr=json.load(open('release/R31_REPORT_PUBLISH_REQUEST.json'))\npathlib.Path('notes.txt').write_text(r['notes'])\n\
        publication=subprocess.run(['gh','release','create',r['tag'],*map(str,pathlib.Path('pub').iterdir()),'--target',r['sourceCommit'],'--title',r['title'],'--notes-file','notes.txt'])\n\
        if publication.returncode == 0:\n    subprocess.run(['gh','release','view',r['tag'],'--json','assets','--jq','.assets[]|.name+\" \"+.url'],check=True)\n\
        else:\n    # Match the existing final publisher's immutable delivery-branch fallback.\n    branch='delivery/'+r['tag']\n    folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'report-delivery'\n\
        \    shutil.copytree('pub',folder)\n    def git(*args): subprocess.run(['git',*args],cwd=folder,check=True)\n    git('init','-q');git('checkout','-q','-b',branch);git('add','-A')\n\
        \    git('-c','user.name=github-actions','-c','user.email=github-actions@users.noreply.github.com','commit','-q','-m','delivery: verified\
        \ report release '+r['sourceCommit'])\n    # The checkout's scoped credentials apply through its existing repository config.\n    git('config','include.path',str(pathlib.Path('.git/config').resolve()))\n\
        \    git('push','-q','https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git','HEAD:refs/heads/'+branch)\n    for name in [r['apk'],r['zipName'],'R31_REPORT_DELIVERY.json','PACKAGE_SHA256.txt']:\n\
        \        print('https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/raw/refs/heads/'+branch+'/'+name)\nPY\n"
