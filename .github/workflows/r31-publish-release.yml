# Publishes an already-built, already-verified R31 APK as a GitHub Release (direct browser download), as the R30 repair
# releases were. It never builds or re-signs: it takes the artifact of the signing run named in
# release/R31_PUBLISH_REQUEST.json and refuses unless the release APK's SHA-256 and signer match the request.
name: STARCORE R31 publish release
on:
  push:
    branches: ['construction/r31-final-20261104']
    paths: ['release/R31_PUBLISH_REQUEST.json']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: req
        run: |
          python3 - <<'PY'
          import json,os,re
          r=json.load(open('release/R31_PUBLISH_REQUEST.json'))
          keys=('runId','artifact','apk','sha256','tag','sourceCommit','title')
          for k in keys: assert r.get(k),k
          assert re.fullmatch('[0-9a-f]{64}',r['sha256']) and re.fullmatch('[0-9a-f]{40}',r['sourceCommit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              for k in keys: o.write(k+'='+str(r[k])+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.req.outputs.artifact }}
          run-id: ${{ steps.req.outputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Verify the exact signed bytes and assemble the package
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,importlib.util,json,pathlib,shutil,zipfile
          request=json.load(open('release/R31_PUBLISH_REQUEST.json'))
          root=pathlib.Path('built');out=pathlib.Path('pub');out.mkdir()
          spec=importlib.util.spec_from_file_location('package_release','tools/r31/package_release.py')
          package=importlib.util.module_from_spec(spec);spec.loader.exec_module(package)
          candidates=list(root.rglob(request['zipName']));assert len(candidates)==1,'EXACT_DELIVERY_ZIP_REQUIRED'
          archive=candidates[0];delivery=package.verify_zip(archive)
          assert delivery['sourceCommit']==request['sourceCommit'],'DELIVERY_SOURCE_MISMATCH'
          assert delivery['apk']['variant']=='release' and delivery['overlayInstall']['overlayInstallKeepsData']
          assert delivery['apk']['deliveredAs']==request['apk'],'DELIVERY_APK_NAME_MISMATCH'
          with zipfile.ZipFile(archive) as z:
              apk=z.read(request['apk']);assert hashlib.sha256(apk).hexdigest()==request['sha256']
              evidence=json.loads(z.read('acceptance/ACCEPTANCE_RESULTS.json'))
              assert evidence['identity']['source_head']==request['sourceCommit']
              assert evidence['identity']['state']=='PASS_ENGINEERING_ONLY','CURRENT_ENGINEERING_FAILURE'
              assert len(evidence['items'])==222 and len(evidence['cards'])==58
              (out/request['apk']).write_bytes(apk)
              for name in ['R31_DELIVERY.json','R31_VERIFICATION_RECEIPT.json','acceptance/ACCEPTANCE_RESULTS.json','acceptance/ACCEPTANCE_RESULTS.csv']:
                  (out/pathlib.Path(name).name).write_bytes(z.read(name))
          shutil.copyfile(archive,out/archive.name)
          PY
          f="pub/${{ steps.req.outputs.apk }}"
          echo "${{ steps.req.outputs.sha256 }}  $f" | sha256sum -c -
          B="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$B/apksigner" verify --print-certs "$f" > pub/public-certificate.txt
          grep -qE "Signer( #1|): certificate SHA-256 digest: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7" pub/public-certificate.txt
          (cd pub && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "import json;r=json.load(open('release/R31_PUBLISH_REQUEST.json'));open('notes.md','w',encoding='utf-8').write(r['notes'] if r.get('notes') else 'R31 overlay-install release')"
          if gh release create "${{ steps.req.outputs.tag }}" pub/* --target "${{ steps.req.outputs.sourceCommit }}" --title "${{ steps.req.outputs.title }}" --notes-file notes.md; then
            gh release view "${{ steps.req.outputs.tag }}" --json assets --jq '.assets[]|.name+" "+.url'
          else
            # Fallback when the release API is refused: an orphan delivery branch holding only the verified files.
            B="delivery/${{ steps.req.outputs.tag }}"
            mkdir deliver && cp pub/* deliver/ && cp notes.md deliver/README.md
            cd deliver && git init -q && git checkout -q -b "$B" && git add -A
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "delivery: ${{ steps.req.outputs.tag }} (verified signed bytes of ${{ steps.req.outputs.sourceCommit }})"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$B"
            for f in *; do echo "https://github.com/${GITHUB_REPOSITORY}/raw/$B/$f"; done
          fi
