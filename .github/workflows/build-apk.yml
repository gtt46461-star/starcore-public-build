name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify source assets
        run: |
          python3 scripts/verify_catalog_assets_cp12.py --check
          python3 scripts/r967_semantic_identity.py --check
          python3 scripts/r982_source_call_asset.py
      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STARCORE-C024-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
