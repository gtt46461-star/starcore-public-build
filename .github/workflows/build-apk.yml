name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish_verified_1025:
        description: Publish the already verified 10.25 APK as a direct download
        type: boolean
        required: false
        default: false
      verified_run_id:
        description: Successful R26 workflow run to publish as a direct APK download
        required: false
        default: ''
        type: string
      publish_runtime_117:
        description: Publish the signed source117 package after its matching runtime checks
        type: boolean
        required: false
        default: false
      reportfix_run_id:
        description: Publish the report export repair after matching Android verification
        type: string
        required: false
        default: ''
      reportfix_apk_sha256:
        description: Independently checked SHA256 of the exact report repair APK
        type: string
        required: false
        default: ''
      reportfix_ui_run_id:
        description: Successful actual UI-to-ZIP probe matching the repair package
        type: string
        required: false
        default: ''
      probe_report_export:
        description: Exercise the actual UI to final report ZIP for the fixed source120 APK
        type: boolean
        required: false
        default: false
      r342_batch:
        description: R34.2 batch to build and publish from the authorized signing ref
        type: string
        required: false
        default: ''
      r342_source:
        description: Full R34.2 application commit for the selected batch
        type: string
        required: false
        default: ''
  push:
    branches: ['construction/r27-20261028']
    paths: ['.github/r342-release-request.json']
permissions:
  contents: read
jobs:
  debug-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && !inputs.publish_verified_1025 && !inputs.publish_runtime_117 && !inputs.probe_report_export && inputs.verified_run_id == '' && inputs.reportfix_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify source assets
        run: |
          python3 scripts/verify_catalog_assets_cp12.py --check
          python3 scripts/r967_semantic_identity.py --check
          python3 scripts/r982_source_call_asset.py
      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STARCORE-C024-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  publish-verified-1025:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && inputs.publish_verified_1025 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R13-build-and-evidence
          run-id: 40167769430
          github-token: ${{ github.token }}
          path: verified
      - name: Verify and stage the exact tested release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          expected='4567df77d768005cbcc19ab2aa3a2ab346c6d90d226d7ee1f670fb60721cf21d'
          apks=list(Path('verified/app/build/outputs/apk/release').glob('*.apk'))
          assert len(apks)==1
          assert apks[0].stat().st_size==26727292
          assert hashlib.sha256(apks[0].read_bytes()).hexdigest()==expected
          receipt=json.loads(Path('construction/plan1025/delivery.json').read_text())
          assert receipt['apk_sha256']==expected and receipt['runtime_verification']=='PASS_API29_35_36'
          out=Path('release-download');out.mkdir()
          name='STARCORE-10.25-R16-P50-release.apk'
          shutil.copyfile(apks[0],out/name)
          (out/'SHA256SUMS.txt').write_text(expected+'  '+name+'\n')
          shutil.copyfile('construction/plan1025/delivery.json',out/'STARCORE-10.25-delivery.json')
          PY
      - name: Upload checked files and publish the download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view r13-5.4.3.04-20261025 --json isDraft > release-state.json
          python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"]'
          gh release upload r13-5.4.3.04-20261025 release-download/* --clobber
          gh api repos/gtt46461-star/starcore-public-build/releases/423190826 > uploaded-release.json
          python3 - <<'PY'
          import json
          j=json.load(open('uploaded-release.json'))
          assets={a['name']:a for a in j['assets']}
          a=assets['STARCORE-10.25-R16-P50-release.apk']
          assert a['size']==26727292
          assert a.get('digest') in (None,'sha256:4567df77d768005cbcc19ab2aa3a2ab346c6d90d226d7ee1f670fb60721cf21d')
          assert 'SHA256SUMS.txt' in assets and 'STARCORE-10.25-delivery.json' in assets
          PY
          gh release edit r13-5.4.3.04-20261025 --draft=false --prerelease --latest=false
          echo 'https://github.com/gtt46461-star/starcore-public-build/releases/download/r13-5.4.3.04-20261025/STARCORE-10.25-R16-P50-release.apk' >> "$GITHUB_STEP_SUMMARY"
  publish-r26:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && inputs.verified_run_id != '' }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run_id }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          run=os.environ['VERIFIED_RUN'];assert run.isdecimal()
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],text=True))
          r=api(f'actions/runs/{run}')
          assert r['status']=='completed' and r['conclusion']=='success',r['conclusion']
          assert r['path']=='.github/workflows/r13.yml'
          assert r['head_branch']=='construction/su1-20261022'
          jobs=api(f'actions/runs/{run}/jobs')['jobs']
          names={j['name']:j for j in jobs}
          for name in ['build','android-runtime (29)','android-runtime (35)','android-runtime (36)']:
              assert names[name]['conclusion']=='success',name
          open('verified-workflow.json','w').write(json.dumps({'run_id':int(run),'workflow_head':r['head_sha'],'url':r['html_url'],'jobs':{j['name']:j['conclusion'] for j in jobs}},indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: R13-build-and-evidence
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
      - name: Verify signed package receipt and prepare public assets
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil
          root=pathlib.Path('verified');apks=list(root.glob('app/build/outputs/apk/release/*.apk'));assert len(apks)==1
          apk=apks[0];receipt=root/'package-receipt'
          badging=(receipt/'package.txt').read_text();signature=(receipt/'signature.txt').read_text()
          assert "name='com.starcore.research.r13'" in badging
          assert "versionName='R26-2026.10.27-engineering'" in badging
          assert "versionCode='577271026'" in badging
          assert '9e6d5dc79d29d4ba5b435a171e6535386f8a56ea6fad71a6cc77aeb10ade3eca' in signature
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();assert digest in (receipt/'SHA256SUMS.txt').read_text()
          source=(receipt/'source-commit.txt').read_text().strip();assert re.fullmatch('[0-9a-f]{40}',source)
          protocol=json.loads((root/'build/r26/verification.json').read_text());assert protocol['status']=='PASS'
          out=pathlib.Path('public-assets');out.mkdir();name='STARCORE-R26-20261027-release.apk';shutil.copy2(apk,out/name)
          (out/'SHA256SUMS.txt').write_text(digest+'  '+name+'\n')
          metadata={'source_commit':source,'apk':name,'bytes':apk.stat().st_size,'sha256':digest,'package':'com.starcore.research.r13','versionName':'R26-2026.10.27-engineering','versionCode':577271026,'certificate_sha256':'9e6d5dc79d29d4ba5b435a171e6535386f8a56ea6fad71a6cc77aeb10ade3eca','overallAcceptance':'INCOMPLETE','naturalQuality':'INSUFFICIENT','physicalDevice':'NOT_RUN','workflow':json.load(open('verified-workflow.json'))}
          (out/'R26-delivery.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          shutil.copy2(root/'build/r26/verification.json',out/'R26-protocol-verification.json')
          pathlib.Path('release-notes.md').write_text('R26 工程验证版，尚未完成全方案验收。\n\n已加入持续研究队列、固定快照切片、无损策略身份、精确排列训练核、配对下界资格与40章状态报告。24家族/16专家完整机制、自然35/37/40%质量、用户真机与60分钟压力验收仍有缺项，不能视为100%完成。\n\n固定包名和签名，可覆盖此前R13版本。实际源码、APK校验值和CI回执见附件 R26-delivery.json。\n')
          pathlib.Path('release-target.txt').write_text(source)
          PY
      - name: Publish verified engineering prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$(cat release-target.txt)"
          gh release create r26-20261027-engineering --target "$target" --title 'STARCORE R26 · 工程验证版（未完成全方案验收）' --notes-file release-notes.md --draft --prerelease --latest=false
          gh release upload r26-20261027-engineering public-assets/*
          gh release edit r26-20261027-engineering --draft=false --prerelease --latest=false
  publish-r26-runtime-117:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && inputs.publish_runtime_117 }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact source117 build and runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/$GH_REPO/actions/runs/40645360647 > source117-workflow.json
          gh api 'repos/'$GH_REPO'/actions/runs/40645360647/jobs?per_page=100' > source117-jobs.json
          gh run download 40645360647 --name R13-build-and-evidence --dir verified117
          gh run download 40645360647 --name R13-Android-runtime-29 --dir runtime117
      - name: Verify immutable package and matching executed native tests
        run: python3 scripts/stage_r26_runtime_117.py --build verified117 --runtime runtime117 --workflow source117-workflow.json --jobs source117-jobs.json --out public-assets117
      - name: Upload verified assets and publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view r26-20261028-runtime-117 --json isDraft,targetCommitish > source117-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('source117-release.json'))
          assert r['isDraft'] and r['targetCommitish']=='a7f0052459331988ab58ccd667fa1fe43ccacd9d'
          PY
          gh release upload r26-20261028-runtime-117 public-assets117/* --clobber
          gh release view r26-20261028-runtime-117 --json assets > source117-assets.json
          python3 - <<'PY'
          import json
          a={x['name']:x for x in json.load(open('source117-assets.json'))['assets']}
          assert a['STARCORE-R26-20261028-117-release.apk']['size']==27047093
          assert {'R26-delivery.json','SHA256SUMS.txt','R26-native-117-results.json','R26-runtime-117-results.json'}<=a.keys()
          PY
          gh release edit r26-20261028-runtime-117 --draft=false --prerelease --latest=false --notes-file public-assets117/release-notes.md
  publish-report-export-repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && inputs.reportfix_run_id != '' }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source-bound repair package and executed regression
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_RUN: ${{ inputs.reportfix_run_id }}
          VERIFIED_SHA: ${{ inputs.reportfix_apk_sha256 }}
          VERIFIED_UI_RUN: ${{ inputs.reportfix_ui_run_id }}
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['VERIFIED_RUN']=='40661966851'
          assert os.environ['VERIFIED_UI_RUN'].isdecimal()
          assert re.fullmatch('[0-9a-f]{64}',os.environ['VERIFIED_SHA'])
          PY
          gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN > repair-workflow.json
          gh api 'repos/'$GH_REPO'/actions/runs/'$VERIFIED_RUN'/jobs?per_page=100' > repair-jobs.json
          gh run download "$VERIFIED_RUN" --name R13-build-and-evidence --dir verified-repair
          gh run download "$VERIFIED_RUN" --name R13-Android-runtime-29 --dir runtime-repair
          gh api repos/$GH_REPO/actions/runs/$VERIFIED_UI_RUN > repair-ui-workflow.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('repair-ui-workflow.json'))
          assert r['id']==int(os.environ['VERIFIED_UI_RUN']) and r['path']=='.github/workflows/build-apk.yml' and r['status']=='completed' and r['conclusion']=='success'
          PY
          gh run download "$VERIFIED_UI_RUN" --name R26-report-export-ui-to-zip-source120 --dir repair-ui
          python3 scripts/stage_r26_report_export_repair.py --build verified-repair --runtime runtime-repair --workflow repair-workflow.json --jobs repair-jobs.json --sha256 "$VERIFIED_SHA" --ui-probe repair-ui/receipt.json --ui-run-id "$VERIFIED_UI_RUN" --out repair-public-assets
      - name: Upload checked repair package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          target="$(cat repair-public-assets/source-commit.txt)"
          gh release create r26-20261028-reportfix2 --target "$target" --title 'STARCORE R26 · 完整检测报告导出修复' --notes-file repair-public-assets/release-notes.md --draft --prerelease --latest=false
          gh release upload r26-20261028-reportfix2 repair-public-assets/*
          gh release view r26-20261028-reportfix2 --json assets > repair-uploaded.json
          python3 - <<'PY'
          import json
          a={x['name']:x for x in json.load(open('repair-uploaded.json'))['assets']}
          r=json.load(open('repair-public-assets/R26-report-repair-delivery.json'))
          assert a['STARCORE-R26-20261028-reportfix2.apk']['size']==r['bytes']
          assert {'SHA256SUMS.txt','R26-report-repair-delivery.json','R26-native-results.json','R26-runtime-results.json'}<=a.keys()
          PY
          gh release edit r26-20261028-reportfix2 --draft=false --prerelease --latest=false
  probe-report-export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r342_batch == '' && inputs.probe_report_export }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R13-build-and-evidence
          run-id: 40661966851
          github-token: ${{ github.token }}
          path: delivered
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: python3 scripts/probe_r26_report_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R26-report-export-ui-to-zip-source120
          path: report-export-probe/
          if-no-files-found: error

  r342-candidate-build:
    if: ${{ github.repository == 'gtt46461-star/starcore-public-build' && github.ref == 'refs/heads/construction/r27-20261028' && (github.event_name == 'push' || inputs.r342_batch != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      source: ${{ steps.request.outputs.source }}
      stage: ${{ steps.request.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/r342-release-request.json
            .github/scripts/r343-integration-probes.py
          sparse-checkout-cone-mode: false
          path: dispatch
          persist-credentials: false
      - id: request
        name: Pin the authorized source and batch
        env:
          MANUAL_SOURCE: ${{ inputs.r342_source }}
          MANUAL_STAGE: ${{ inputs.r342_batch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            source=$(jq -er '.source' dispatch/.github/r342-release-request.json)
            stage=$(jq -er '.batch' dispatch/.github/r342-release-request.json)
          else
            source="$MANUAL_SOURCE"
            stage="$MANUAL_STAGE"
          fi
          [[ "$source" =~ ^[a-f0-9]{40}$ && "$stage" =~ ^B(0[1-9]|1[0-2])$ ]]
          printf 'source=%s\nstage=%s\n' "$source" "$stage" >> "$GITHUB_OUTPUT"
          printf 'SOURCE=%s\nSTAGE=%s\n' "$source" "$stage" >> "$GITHUB_ENV"
          git init -q app-source
          git -C app-source fetch -q --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" construction/r342-repair-20261125
          if ! git -C app-source merge-base --is-ancestor "$source" FETCH_HEAD; then
            # A fixed additional construction ref; arbitrary dispatch refs cannot use the signer.
            git -C app-source fetch -q --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" construction/r343-repair-20261126
            git -C app-source merge-base --is-ancestor "$source" FETCH_HEAD
            git -C app-source merge-base --is-ancestor 4d1de9d83692635b5c5ce39144fece1c8a31c8ac "$source"
          fi
          git -C app-source merge-base --is-ancestor eb8f82a8bda8db22f1f122095217132f07053bcb "$source"
          git -C app-source checkout -q --detach "$source"
          jq -e --arg name "R34.2-$stage-" '.versionCode > 577311152 and (.versionName | startswith($name))' app-source/release/release_manifest.json
          if [[ -f app-source/release/field173_plan_binding.json ]]; then
            git -C app-source merge-base --is-ancestor 4d1de9d83692635b5c5ce39144fece1c8a31c8ac "$source"
            jq -e '.versionCode > 577311173' app-source/release/release_manifest.json
            field_plan_commit=$(jq -er '.planCommit' app-source/release/field173_plan_binding.json)
            [[ "$field_plan_commit" == b5bf9de3c9a000f4f2f920f6f2c4b849ba22ee59 ]]
            git -C app-source fetch -q --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$field_plan_commit"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify independent sealed inputs
        run: bash app-source/tools/r342/ci_plan_inputs.sh
      - name: Install and preflight the project SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python3 -m pip install numpy==2.3.5 'cryptography>=41,<51'
          python3 -B "$RUNNER_TEMP/material/current-review/source/preflight_delivery.py" --repo app-source --android-sdk "$ANDROID_HOME" --baseline-apk "$RUNNER_TEMP/formal-033.apk" > "$RUNNER_TEMP/engineering/preflight.json"
      - name: Restore the existing authorized signer
        uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/r27-ci-temp-key
          key: starcore-r27-ci-temp-signing-v1
          fail-on-cache-miss: true
      - name: Restore the pinned input of the existing signing preflight
        uses: actions/download-artifact@v4
        with:
          name: r31-report-032-signed-build
          run-id: 43556844131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original032
      - name: Verify original signer and configure the release build
        working-directory: app-source
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          set -euo pipefail
          git diff --quiet bb7b49bbcc9266bad548ec37e71403256fc06a4d HEAD -- tools/r3251/prepare_existing_signer.py
          python3 -B tools/r3251/prepare_existing_signer.py
      - name: Run the B01 host identity and interrupted-version contracts
        if: env.STAGE == 'B01'
        working-directory: app-source
        run: |
          python3 -B tools/r342/test_b01_contracts.py --repo "$PWD" --plan "$STARCORE_R342_PLAN_ROOT" --legacy-plan "$STARCORE_R33_PLAN_ROOT" --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --baseline-apk "$RUNNER_TEMP/baseline152.apk" --out "$RUNNER_TEMP/engineering/b01-host-contracts.json"
      - name: Build the original-signed APK from the exact clean source
        working-directory: app-source
        run: |
          python3 -B tools/r33/run_release_build.py --repo "$PWD" --r342-plan "$STARCORE_R342_PLAN_ROOT" --out "$RUNNER_TEMP/build"
      - name: Verify and retain the signed build original independently of emulator acceptance
        working-directory: app-source
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} -eq 1 ]]
          receipt="$RUNNER_TEMP/build/CI_BUILD_RECEIPT.json"
          observed=$(sha256sum "${apks[0]}" | cut -d' ' -f1)
          jq -e --arg sha "$observed" --arg source "$SOURCE" '.gradleRelease == "PASS" and .sourceCommit == $source and .sourceClean == true and .apkSha256 == $sha' "$receipt"
          "$sdk/apksigner" verify --verbose --print-certs "${apks[0]}" > "$RUNNER_TEMP/build/original-apksigner.txt"
          grep -F 'certificate SHA-256 digest: d8d8cee7f406267b2bf18fc9aef0c6ab760423cf205ccd6613dd44085bcc74e7' "$RUNNER_TEMP/build/original-apksigner.txt"
          "$sdk/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/build/original-package.txt"
          version=$(jq -er .versionCode release/release_manifest.json)
          grep -F "package: name='com.starcore.research.r13' versionCode='$version'" "$RUNNER_TEMP/build/original-package.txt"
      - name: Enable KVM for the disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify R26 startup and the two predraw regressions on the original-signed APK
        if: env.STAGE == 'B12'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 8G
          ram-size: 4096M
          script: |
            if [ -f app-source/release/field173_plan_binding.json ]; then python3 -B dispatch/.github/scripts/r343-integration-probes.py --startup-first; fi
      - name: Verify cover upgrade, Android cases, and report exports on the same APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 8G
          ram-size: 4096M
          script: |
            set -e
            python3 -B app-source/tools/r342/ci_candidate_tests.py
            if [ "$STAGE" = B12 ] && [ -f app-source/release/field173_plan_binding.json ]; then python3 -B dispatch/.github/scripts/r343-integration-probes.py; fi
      - name: Build exact source, restorable history and test evidence packages
        working-directory: app-source
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/engineering" && zip -q "$RUNNER_TEMP/engineering-originals.zip" ./*)
          cover_baseline="$RUNNER_TEMP/baseline152.apk"
          if [[ -f release/field173_plan_binding.json ]]; then
            cover_baseline="$RUNNER_TEMP/baseline173.apk"
          fi
          python3 -B tools/r33/package_ci_candidate.py --repo "$PWD" --r342-plan "$STARCORE_R342_PLAN_ROOT" --out "$RUNNER_TEMP/candidate" --baseline-apk "$RUNNER_TEMP/formal-033.apk" --current-installed-apk "$cover_baseline" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --build-log "$RUNNER_TEMP/build/gradle-build.log" --build-receipt "$RUNNER_TEMP/build/CI_BUILD_RECEIPT.json" --engineering-evidence "$RUNNER_TEMP/engineering-originals.zip"
          if [[ "$STAGE" == B12 && -f release/field173_plan_binding.json ]]; then
            python3 -B tools/r342/release_delivery.py --candidate "$RUNNER_TEMP/candidate" --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --source "$SOURCE" --stage "$STAGE" --index "$RUNNER_TEMP/r343-publication-precheck.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r342-candidate-${{ steps.request.outputs.stage }}-${{ steps.request.outputs.source }}
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r342-run-${{ github.run_id }}-originals
          path: |
            ${{ runner.temp }}/build/CI_BUILD_RECEIPT.json
            ${{ runner.temp }}/build/gradle-build.log
            ${{ runner.temp }}/engineering/
            ${{ runner.temp }}/engineering-preflight/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.request.outputs.source != '' }}
        with:
          name: r343-signed-build-original-${{ steps.request.outputs.stage }}-${{ steps.request.outputs.source }}
          path: |
            ${{ runner.temp }}/build/CI_BUILD_RECEIPT.json
            ${{ runner.temp }}/build/original-apksigner.txt
            ${{ runner.temp }}/build/original-package.txt
            app-source/app/build/outputs/apk/release/*.apk
          compression-level: 0
          if-no-files-found: ignore

  r342-publish:
    needs: r342-candidate-build
    if: ${{ needs.r342-candidate-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    env:
      SOURCE: ${{ needs.r342-candidate-build.outputs.source }}
      STAGE: ${{ needs.r342-candidate-build.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.r342-candidate-build.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools/r33
            tools/r341
            tools/r342
            tools/r343
            release
            construction/plans/STARCORE_R34_3_REPAIR_20261126
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: r342-candidate-${{ needs.r342-candidate-build.outputs.stage }}-${{ needs.r342-candidate-build.outputs.source }}
          path: ${{ runner.temp }}/candidate
      - name: Validate same-run package and publish original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          candidate="$RUNNER_TEMP/candidate"
          if [[ -f release/field173_plan_binding.json ]]; then
            field_plan_commit=$(jq -er .planCommit release/field173_plan_binding.json)
            [[ "$field_plan_commit" =~ ^[a-f0-9]{40}$ ]]
            git fetch -q --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$field_plan_commit"
            export STARCORE_FIELD173_PLAN_ROOT="$PWD/construction/plans/STARCORE_R34_3_REPAIR_20261126"
          fi
          (cd "$candidate" && sha256sum -c SHA256SUMS.txt)
          python3 -B tools/r342/release_delivery.py --candidate "$candidate" --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --source "$SOURCE" --stage "$STAGE" --index "$RUNNER_TEMP/r342-index.json"
          tag="r34.2-${STAGE}-${SOURCE:0:12}"
          version=$(jq -er .versionCode "$RUNNER_TEMP/r342-index.json")
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "STARCORE R34.2 $STAGE · $version" --notes "Source $SOURCE and build $GITHUB_RUN_ID. See the attached engineering originals for the observed scope." --latest=false --draft
          fi
          release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
          [[ $(jq -r '.targetCommitish' <<< "$release") == "$SOURCE" ]]
          if [[ $(jq -r '.isDraft' <<< "$release") == true ]]; then
            mapfile -t assets < <(jq -er '.artifacts[].filename' "$RUNNER_TEMP/r342-index.json")
            for file in "${assets[@]}"; do
              gh release upload "$tag" "$candidate/$file" --repo "$GITHUB_REPOSITORY"
            done
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          python3 -B tools/r342/release_delivery.py --candidate "$candidate" --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --source "$SOURCE" --stage "$STAGE" --index "$RUNNER_TEMP/r342-index.json" --received "$RUNNER_TEMP/received"
          cat "$RUNNER_TEMP/received/DELIVERY_R342.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r342-received-${{ needs.r342-candidate-build.outputs.stage }}-${{ needs.r342-candidate-build.outputs.source }}
          path: |
            ${{ runner.temp }}/r342-index.json
            ${{ runner.temp }}/received/DELIVERY_R342.json
          if-no-files-found: warn
