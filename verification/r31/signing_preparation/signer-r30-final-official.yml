name: STARCORE R30 FINAL OFFICIAL_R13 (existing identity only)
on:
  push:
    branches: ['construction/su1-20261022']
    paths: ['.github/r30-final-official-request.json', '.github/workflows/r30-final-official.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: r30-final-OFFICIAL_R13-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      source: ${{ steps.request.outputs.source }}
      r27RunId: ${{ steps.request.outputs.r27RunId }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/r30-final-official-request.json
      - id: request
        run: |
          python3 - <<'CODE'
          import json,os,re
          r=json.load(open('.github/r30-final-official-request.json'));assert re.fullmatch('[a-f0-9]{40}',r['source'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+r['source']+'\nr27RunId='+str(r['r27RunId'])+'\n')
          CODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 'cryptography>=41,<51'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.starcore/su1-api-transport
          key: starcore-su1-api-transport-v1
          fail-on-cache-miss: true
      - name: Restore only the original official R13 identity and API configuration
        run: |
          python3 scripts/load_r13_signing.py
          python3 scripts/load_su1_bundled_api.py
          echo 'R29_SIGNING=OFFICIAL_R13' >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Exact-source complete gates and signed candidates
        run: |
          timeout 45s git fetch --no-tags origin construction/r30-20261031
          git merge-base --is-ancestor HEAD origin/construction/r30-20261031
          [ -n "${DUOQU_API_KEY:-}" ] || { echo FINAL_API_CONFIGURATION_UNAVAILABLE; exit 1; }
          bash tools/r30/ci_build.sh
          ./gradlew --no-daemon :app:lintDebug
          python3 tools/r30/package_final.py --lane OFFICIAL_R13 --expected-source '${{ steps.request.outputs.source }}'
          ./gradlew --no-daemon -q -Pr30Instrumentation=true :app:assembleDebugAndroidTest
          grep -Fq 'android:name="com.ethk3.novaonepro.R30FaultAndroidRunner"' app/build/intermediates/packaged_manifests/debugAndroidTest/processDebugAndroidTestManifest/AndroidManifest.xml
          mkdir -p r30-androidtest
          cp app/build/outputs/apk/androidTest/debug/*.apk r30-androidtest/
      - uses: actions/upload-artifact@v4
        with:
          name: R30-OFFICIAL-FINAL-CANDIDATE
          path: r30-final/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: R30-OFFICIAL-ANDROIDTEST
          path: r30-androidtest/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R30-OFFICIAL-HOST-EVIDENCE
          path: |
            evidence/r30/ci/
            app/build/test-results/
            app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: R30-OFFICIAL-FINAL-CANDIDATE
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: R30-OFFICIAL-ANDROIDTEST
          path: androidtest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: adb root && adb wait-for-device && adb install $(find candidate -name '*.apk' -print -quit) && adb install -t $(find androidtest -name '*.apk' -print -quit) && python3 scripts/probe_r13_startup.py --installed && bash tools/r30/run_android_regression.sh evidence/r30/android-regression && bash tools/r30/run_fault_matrix.sh evidence/r30/fault-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R30-OFFICIAL-ANDROID-EVIDENCE
          path: |
            evidence/r30/android-regression/
            evidence/r30/fault-matrix/
            startup-evidence/
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [CP06, CP16]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: R30-OFFICIAL-FINAL-CANDIDATE
          path: candidate
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash tools/r30/run_upgrade_drill.sh $(find candidate -name '*.apk' -print -quit) OFFICIAL_R13 ${{ matrix.checkpoint }} evidence/r30/upgrade-OFFICIAL_R13-${{ matrix.checkpoint }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R30-OFFICIAL-UPGRADE-${{ matrix.checkpoint }}
          path: |
            evidence/r30/upgrade-OFFICIAL_R13-${{ matrix.checkpoint }}/
            startup-evidence/
  publish:
    needs: [build, emulator, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: R30-OFFICIAL-FINAL-CANDIDATE
          path: final/official
      - name: Both identities must finish before the only public final release
        env:
          GH_TOKEN: ${{ github.token }}
          R27_RUN_ID: ${{ needs.build.outputs.r27RunId }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
        run: bash tools/r30/publish_final.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R30-FINAL-TWO-APK-DELIVERY
          path: final/delivery/

