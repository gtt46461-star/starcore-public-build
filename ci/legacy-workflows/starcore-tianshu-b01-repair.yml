name: Starcore Tianshu B01 Repair And Delivery

on:
  push:
    branches:
      - agent/starcore-tianshu-b01
    paths:
      - '.github/workflows/starcore-tianshu-b01-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcore-tianshu-b01-repair
  cancel-in-progress: false

env:
  BASELINE_SHA: 80b09c5e5921f18c4ef05ceee7332ad0ee621944
  DELIVERY_NAME: Starcore-Tianshu-B01-20260805
  ACCEPTED_TAG: starcore-tianshu-b01-accepted

jobs:
  repair-materialize-verify-build-deliver:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[b01-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact B01 branch
        uses: actions/checkout@v4
        with:
          ref: agent/starcore-tianshu-b01
          fetch-depth: 0
          persist-credentials: true

      - name: Verify frozen V51 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          test "$(git merge-base HEAD "${BASELINE_SHA}")" = "${BASELINE_SHA}"
          mkdir -p reports delivery tools
          printf '%s\n' "${BASELINE_SHA}" > reports/B01_BASELINE_SHA.txt

      - name: Reconstruct and repair deterministic source generator
        shell: bash
        run: |
          set -euo pipefail
          cat .github/starcore-tianshu-b01/materializer.part-* > /tmp/materializer.b64
          base64 --decode /tmp/materializer.b64 | gzip --decompress > tools/starcore_tianshu_b01_materialize.py
          cat .github/starcore-tianshu-b01/harness.part-* > /tmp/harness.b64
          base64 --decode /tmp/harness.b64 | gzip --decompress > tools/run_starcore_b01_harness.py
          echo 'f7f001d1cca8bbe619c0a917eb143daefe9a571c8d5fa10cff40648c6279e49e  tools/starcore_tianshu_b01_materialize.py' | sha256sum --check --strict
          echo 'ad0d964db1bd9d5b99a4dae41b8e8d303727ee5000fb2867f28d69d9bf9a2959  tools/run_starcore_b01_harness.py' | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/starcore_tianshu_b01_materialize.py')
          text=p.read_text(encoding='utf-8')
          replacements={
            '25563a5bb5b19aea8ac221b59853a9f97b08ebee1c686c9a21de6ac77c8c821a':'40f532fc8eabc4bb71f9aa6e60eeb5aa5a947c16ccafcc5003e76ceed9867d94',
            '6e800a72c0e6d2dd3ce950f2ba5ea1c659c8a3dece1b8086dee22c8bd538e9df':'9683562182798b5bd53142bd802e8ce1dff2bc7faad5de6134047d3ce60e476c'
          }
          for old,new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit('baseline hash replacement count mismatch: '+old)
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
          echo 'efa992a3b5b9e00f6629f01d0e86fd68389f544aa08282afe57e0fc02b9c22a5  tools/starcore_tianshu_b01_materialize.py' | sha256sum --check --strict
          python3 -m py_compile tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py

      - name: Materialize ten complete B01 Java files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/starcore_tianshu_b01_materialize.py --apply | tee reports/B01_MATERIALIZE.log
          python3 tools/starcore_tianshu_b01_materialize.py --verify | tee reports/B01_SOURCE_VERIFY.log
          git diff --check

      - name: Run B01 executable contracts and replay harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_starcore_b01_harness.py | tee reports/B01_HARNESS.log

      - name: Parse every Java source and XML resource
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check javalang==0.13.0
          python3 - <<'PY' | tee reports/B01_JAVA_XML_PARSE.log
          from pathlib import Path
          import javalang
          import xml.etree.ElementTree as ET
          errors=[]
          java_files=sorted(Path('app/src/main/java').rglob('*.java'))
          xml_files=sorted(Path('app/src/main').rglob('*.xml'))
          for p in java_files:
              try: javalang.parse.parse(p.read_text(encoding='utf-8'))
              except Exception as e: errors.append((str(p),str(e)))
          for p in xml_files:
              try: ET.parse(str(p))
              except Exception as e: errors.append((str(p),str(e)))
          print('java_files=%d xml_files=%d errors=%d' % (len(java_files),len(xml_files),len(errors)))
          for item in errors[:100]: print(item)
          raise SystemExit(1 if errors else 0)
          PY

      - name: Verify injected key and live Binance1 PK10 contract
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY || secrets.XINGCHEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DUOQU_API_KEY:-}"
          python3 - <<'PY' | tee reports/B01_LIVE_API_TEST.log
          import hashlib,json,os,re,urllib.parse,urllib.request
          key=os.environ['DUOQU_API_KEY']
          query=urllib.parse.urlencode({'code':'Binance1-PK10','limit':'20','key':key})
          req=urllib.request.Request('https://api.duoqu.online/data?'+query,headers={'Accept':'application/json','User-Agent':'Starcore-Tianshu-B01-CI'})
          with urllib.request.urlopen(req,timeout=15) as response:
              raw=response.read(2*1024*1024); status=response.status
          payload=json.loads(raw.decode('utf-8'))
          rows=payload.get('data')
          valid=0
          for row in rows if isinstance(rows,list) else []:
              if not all(k in row for k in ('betNo','gmtBetNo','openNumber','block','hash','openTime')): continue
              nums=[int(x) for x in re.split(r'[,\s-]+',str(row['openNumber']).strip()) if x]
              if len(nums)==10 and sorted(nums)==list(range(1,11)): valid+=1
          ok=(status==200 and str(payload.get('info','')).lower()=='success' and payload.get('lotteryCode')=='Binance1-PK10' and valid>0)
          result={'http_status':status,'business_ok':ok,'rows':len(rows) if isinstance(rows,list) else 0,'valid_permutations':valid,'response_sha256':hashlib.sha256(raw).hexdigest(),'key_fingerprint':hashlib.sha256(key.encode()).hexdigest()[:12]}
          open('reports/B01_LIVE_API_TEST.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          raise SystemExit(0 if ok else 1)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and verify real shadow APK
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY || secrets.XINGCHEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/B01_GRADLE_BUILD.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK" | tee reports/B01_APK_SIGNATURE.log
          aapt dump badging "$APK" | tee reports/B01_APK_BADGING.log
          cp "$APK" "delivery/${DELIVERY_NAME}-shadow-debug.apk"

      - name: Generate exact before and after file audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,subprocess
          names=['AppConfig.java','BuildIdentity.java','V51BuildManifest.java','V51ArtifactBundleManifest.java','KeyProvider.java','ApiClient.java','ApiParser.java','SafeLog.java','BinanceGameContract.java','ApiTransportGovernanceEngine.java']
          root=Path('app/src/main/java/com/ethk3/novaonepro'); base='80b09c5e5921f18c4ef05ceee7332ad0ee621944'; rows=[]
          for name in names:
              path=root/name; after=path.read_bytes()
              try: before=subprocess.check_output(['git','show',base+':'+str(path)])
              except subprocess.CalledProcessError: before=b''
              before_lines=len(before.decode('utf-8').splitlines()) if before else 0
              after_lines=len(after.decode('utf-8').splitlines())
              rows.append({'file':name,'action':'MODIFY' if before else 'ADD','before_lines':before_lines,'after_lines':after_lines,'delta_lines':after_lines-before_lines,'before_sha256':hashlib.sha256(before).hexdigest() if before else '','after_sha256':hashlib.sha256(after).hexdigest()})
          with open('reports/B01_FILE_AUDIT.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          PY
          git diff --stat "${BASELINE_SHA}" -- app/build.gradle app/src/main/java/com/ethk3/novaonepro > reports/B01_DIFF_STAT.txt
          git diff --numstat "${BASELINE_SHA}" -- app/build.gradle app/src/main/java/com/ethk3/novaonepro > reports/B01_DIFF_NUMSTAT.txt

      - name: Commit full materialized source and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/starcore-tianshu-b01
          rm -f .github/workflows/starcore-tianshu-b01-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(starcore): complete Tianshu B01 full source and APK [b01-materialized]'
          if git rev-parse -q --verify "refs/tags/${ACCEPTED_TAG}" >/dev/null; then
            echo "immutable tag already exists: ${ACCEPTED_TAG}" >&2
            exit 1
          fi
          git tag -a "${ACCEPTED_TAG}" -m 'Starcore Tianshu B01 accepted: source, live API, harness, compile and APK passed'
          git push origin HEAD:agent/starcore-tianshu-b01
          git push origin "${ACCEPTED_TAG}"

      - name: Assemble full source APK evidence and master bundle
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="delivery/${DELIVERY_NAME}-full-source.zip" HEAD
          zip -q -r "delivery/${DELIVERY_NAME}-incremental.zip" app/build.gradle \
            app/src/main/java/com/ethk3/novaonepro/AppConfig.java \
            app/src/main/java/com/ethk3/novaonepro/BuildIdentity.java \
            app/src/main/java/com/ethk3/novaonepro/V51BuildManifest.java \
            app/src/main/java/com/ethk3/novaonepro/V51ArtifactBundleManifest.java \
            app/src/main/java/com/ethk3/novaonepro/KeyProvider.java \
            app/src/main/java/com/ethk3/novaonepro/ApiClient.java \
            app/src/main/java/com/ethk3/novaonepro/ApiParser.java \
            app/src/main/java/com/ethk3/novaonepro/SafeLog.java \
            app/src/main/java/com/ethk3/novaonepro/BinanceGameContract.java \
            app/src/main/java/com/ethk3/novaonepro/ApiTransportGovernanceEngine.java
          zip -q -r "delivery/${DELIVERY_NAME}-evidence.zip" reports tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py
          git rev-parse HEAD > delivery/B01_COMMIT_SHA.txt
          printf '%s\n' "${ACCEPTED_TAG}" > delivery/B01_ACCEPTED_TAG.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          mkdir -p /tmp/master
          cp delivery/* /tmp/master/
          (cd /tmp/master && zip -q -r "/home/runner/work/eth-k3-v43-nova/eth-k3-v43-nova/delivery/${DELIVERY_NAME}-MASTER-with-APK.zip" .)
          sha256sum "delivery/${DELIVERY_NAME}-MASTER-with-APK.zip" >> delivery/SHA256SUMS.txt
          ls -lh delivery | tee reports/B01_DELIVERY_LIST.txt

      - name: Upload immutable B01 delivery
        uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-Accepted-Delivery
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
