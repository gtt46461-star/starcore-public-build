name: R77 scoped CI evidence recovery
on:
  workflow_call:
permissions:
  actions: read
  contents: read
jobs:
  recover-scoped-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and summarize this run's completed validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, time, urllib.error, urllib.parse, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'gtt46461-star/eth-k3-v43-nova'
          run = int(os.environ['GITHUB_RUN_ID'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  return urllib.request.build_opener(NoRedirect).open(request, timeout=60).read()
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  location = error.headers['Location']
                  assert urllib.parse.urlparse(location).scheme == 'https'
                  # A signed log download is a new request with no bearer token.
                  return urllib.request.urlopen(location, timeout=60).read()
          run_info = json.loads(api(f'/actions/runs/{run}'))
          assert run_info['head_sha'] == os.environ['GITHUB_SHA']
          jobs = json.loads(api(f'/actions/runs/{run}/jobs?filter=latest&per_page=100'))['jobs']
          candidates = [job for job in jobs if job['name'] == 'android-compile-native-dex-lint']
          assert len(candidates) == 1 and candidates[0]['status'] == 'completed'
          job = candidates[0]
          print('R77_ORIGINAL_JOB_STATUS|' + json.dumps({'run': run, 'job': job['id'],
              'commit': run_info['head_sha'], 'conclusion': job['conclusion'], 'steps': job['steps']}))
          for attempt in range(6):
              try:
                  raw = api(f"/actions/jobs/{job['id']}/logs")
                  break
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 502, 503, 504) or attempt == 5:
                      raise RuntimeError('Actions log HTTP ' + str(error.code)) from None
                  time.sleep(5)
          text = raw.decode('utf-8-sig')
          print('R77_ORIGINAL_JOB_LOG_SHA256|' + hashlib.sha256(raw).hexdigest())
          budget = [120000]
          def emit(value):
              value = str(value)
              size = min(len(value), budget[0])
              print(value[:size])
              budget[0] -= size
              if size < len(value):
                  print('R77_SCOPED_LOG_TRUNCATED|omitted_chars=' + str(len(value) - size))
          for line in text.splitlines():
              if any(token in line for token in ('O09_ANDROID_CLASS_START|', 'O09_ANDROID_CLASS_RESULT|',
                      'O09_ANDROID_RUNTIME_RECEIPT|', 'ANDROID_R77_BUSY_', '##[error]')):
                  emit(line[:20000])
          match = re.search(r'O09_EVIDENCE_MANIFEST\|(\{[^\r\n]+\})', text)
          assert match is not None, 'full fallback manifest missing; no acceptance inferred'
          manifest = json.loads(match.group(1))
          chunks = {}
          for index, content in re.findall(r'O09_EVIDENCE_CHUNK\|(\d+)\|([A-Za-z0-9+/=]+)', text):
              assert int(index) not in chunks, 'duplicate evidence chunk'
              chunks[int(index)] = content
          assert sorted(chunks) == list(range(len(chunks))), 'missing evidence chunk'
          archive = base64.b64decode(''.join(chunks[i] for i in sorted(chunks)), validate=True)
          assert len(archive) == manifest['bytes']
          assert hashlib.sha256(archive).hexdigest() == manifest['sha256']
          print('R77_FALLBACK_ARCHIVE_VERIFIED|' + json.dumps(manifest))
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              path = 'validation-o09/runtime/receipt.json'
              assert path in bundle.namelist(), 'runtime receipt missing; tests not accepted'
              receipt = json.loads(bundle.read(path))
              assert receipt['commit'] == run_info['head_sha']
              print('R77_RUNTIME_RECEIPT|' + json.dumps(receipt))
              selected = {'SqliteBusyPoolR77Test'} | {item['class'] for item in receipt.get('tests', []) if not item.get('passed')}
              for name in sorted(selected):
                  for suffix in ('.log', '-logcat.log'):
                      path = 'validation-o09/runtime/' + name + suffix
                      if path not in bundle.namelist():
                          continue
                      data = bundle.read(path)
                      print('R77_SCOPED_FILE|' + json.dumps({'path': path, 'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest()}))
                      value = data.decode('utf-8', errors='replace')
                      if suffix == '-logcat.log':
                          rows = value.splitlines()
                          hits = [i for i, line in enumerate(rows) if re.search(r'ANDROID_R77|AssertionError|FATAL EXCEPTION|ANR in|SQLITE|SQLite.*(Exception|locked)|TestRunner.*(failed|finished)|TimeoutException', line)]
                          chosen = sorted({j for i in hits for j in range(max(0, i - 3), min(len(rows), i + 12))})
                          value = '\n'.join(rows[i] for i in chosen[-150:])
                      emit(value[-20000:])
              print('R77_RECOVERY_SCOPE|Evidence extraction only; original job and test failures remain failures')
          PY
