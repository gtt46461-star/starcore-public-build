name: Starcore Tianshu B01-B07 Reinforced

on:
  push:
    branches:
      - work/starcore-tianshu-b07-reinforced-20260807
    paths:
      - '.github/starcore-tianshu-b07-reinforced/RUN_REINFORCEMENT'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: starcore-tianshu-b07-reinforced-20260807
  cancel-in-progress: false

jobs:
  reinforce-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact reinforcement branch
        uses: actions/checkout@v4
        with:
          ref: work/starcore-tianshu-b07-reinforced-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply B01-B07 reinforcement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/starcore-tianshu-b07-reinforced/apply_reinforcement.py | tee reports/B07R_PATCH_OUTPUT.log
          git diff --check

      - name: Bounded fast selfcheck
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s python3 .github/starcore-tianshu-b07-reinforced/selfcheck.py | tee reports/B07R_SELFCHECK_OUTPUT.log

      - name: Compile Android APK with hard timeout
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports delivery
          START=$(date +%s)
          printf 'build_start=%s\n' "$START" > reports/B07R_BUILD_TIMING.txt
          timeout 18m gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/B07R_GRADLE_BUILD.log
          END=$(date +%s)
          printf 'build_end=%s\nbuild_duration_sec=%s\n' "$END" "$((END-START))" >> reports/B07R_BUILD_TIMING.txt
          APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -n "$APK" -a -s "$APK"
          cp "$APK" delivery/Starcore-Tianshu-B01-B07-Reinforced-20260807.apk
          sha256sum delivery/Starcore-Tianshu-B01-B07-Reinforced-20260807.apk > delivery/APK_SHA256.txt

      - name: Generate before-after and delivery report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, hashlib, time
          r=Path('.')
          files=['app/build.gradle','app/src/main/java/com/ethk3/novaonepro/AppConfig.java','app/src/main/java/com/ethk3/novaonepro/BootReceiver.java','app/src/main/java/com/ethk3/novaonepro/AutoFetchService.java','app/src/main/java/com/ethk3/novaonepro/MainActivity.java','app/src/main/java/com/ethk3/novaonepro/CrashRecorder.java','app/src/main/java/com/ethk3/novaonepro/B07ReinforcedDiagnosticEngine.java']
          change=json.loads((r/'reports/B07R_CODE_CHANGE_MANIFEST.json').read_text())
          text=['# 星核天枢 B01-B07 加强修改优化版','', '范围：只返工/加强 B01-B07，不进入 B08。','', '## 修改文件（7个）']
          for x in change['files']:
              text += [f"- `{x['file']}`：{x['change']}",f"  - before={x['before_sha256']}",f"  - after={x['after_sha256']}"]
          text += ['', '## 核心变化','- 后台：退出界面/息屏后继续运行；taskRemoved主动重整运行循环、WakeLock、通知、Alarm/Job恢复。','- 假活修复：仅心跳新鲜但业务已陈旧时，不再阻止服务恢复。','- 闪退：持久记录 crash/OOM/SOE 次数与最近阶段，检测报告直接展示。','- 检测报告：加入 B01-B07批次完整性、唯一主链、后台/API/数据库/预测/结算、胜率/频率/ECE/Wilson、冲突根因、算法公式和具体新增模块建议。','- 复制：结构化完整报告一次复制，不再要求分段多次长按。','- 实时动作：保留 DecisionGate 唯一所有权；开启 LIVE_SIGNAL/人工确认研究轨道，不开启无人值守资金执行。','', '## 胜率真实性','本构建不会把40/50/60目标伪装成实测结果。是否达标必须由严格PIT/OOS、已结算样本、Wilson 95%下界、ECE、多时间块一致性证明。','', '## 自检','见 `reports/B07R_BOUNDED_SELFCHECK.json` 与 `reports/B07R_GRADLE_BUILD.log`。']
          (r/'reports/B07R_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md').write_text('\n'.join(text),encoding='utf-8')
          PY

      - name: Commit reinforced source and reports
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/ethk3/novaonepro/AppConfig.java app/src/main/java/com/ethk3/novaonepro/BootReceiver.java app/src/main/java/com/ethk3/novaonepro/AutoFetchService.java app/src/main/java/com/ethk3/novaonepro/MainActivity.java app/src/main/java/com/ethk3/novaonepro/CrashRecorder.java app/src/main/java/com/ethk3/novaonepro/B07ReinforcedDiagnosticEngine.java reports/B07R_*.json reports/B07R_*.md reports/B07R_*.txt reports/B07R_*.log || true
          if ! git diff --cached --quiet; then
            git commit -m 'feat(starcore): reinforce Tianshu B01-B07 runtime diagnosis live-signal'
            git push origin HEAD:work/starcore-tianshu-b07-reinforced-20260807
          fi
          git rev-parse HEAD | tee delivery/COMMIT_SHA.txt

      - name: Package complete source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p delivery
          git archive --format=zip --output=delivery/Starcore-Tianshu-B01-B07-Reinforced-20260807-FULL-SOURCE.zip HEAD
          cp reports/B07R_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/B07R_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md
          cp reports/B07R_BOUNDED_SELFCHECK.json delivery/B07R_BOUNDED_SELFCHECK.json
          cp reports/B07R_BUILD_TIMING.txt delivery/B07R_BUILD_TIMING.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-B07-Reinforced-20260807-Delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 30
