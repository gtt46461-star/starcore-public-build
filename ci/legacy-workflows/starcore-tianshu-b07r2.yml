name: Starcore Tianshu B01-B07 Reinforced R2

on:
  push:
    branches:
      - work/starcore-tianshu-b07r2-20260807
    paths:
      - '.github/starcore-tianshu-b07r2/RUN_R2'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: starcore-tianshu-b07r2-20260807
  cancel-in-progress: false

jobs:
  reinforce-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact R2 branch
        uses: actions/checkout@v4
        with:
          ref: work/starcore-tianshu-b07r2-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply B01-B07 R2 reinforcement
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports delivery
          timeout 60s python3 .github/starcore-tianshu-b07r2/apply_r2.py | tee reports/B07R2_PATCH_OUTPUT.log
          timeout 30s python3 .github/starcore-tianshu-b07r2/repair_after_patch.py | tee reports/B07R2_REPAIR_OUTPUT.log
          git diff --check

      - name: Bounded source and invariant selfcheck
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s python3 .github/starcore-tianshu-b07r2/selfcheck.py | tee reports/B07R2_SELFCHECK_OUTPUT.log

      - name: Compile Android APK with bounded resources
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set -Eeuo pipefail
          START=$(date +%s)
          printf 'build_start=%s\n' "$START" > reports/B07R2_BUILD_TIMING.txt
          timeout 15m gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/B07R2_GRADLE_BUILD.log
          END=$(date +%s)
          printf 'build_end=%s\nbuild_duration_sec=%s\n' "$END" "$((END-START))" >> reports/B07R2_BUILD_TIMING.txt
          APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -n "$APK" -a -s "$APK"
          cp "$APK" delivery/Starcore-Tianshu-B01-B07-Reinforced-R2-20260807.apk
          sha256sum delivery/Starcore-Tianshu-B01-B07-Reinforced-R2-20260807.apk > delivery/APK_SHA256.txt

      - name: Generate exact before-after report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('.')
          ch=json.loads((r/'reports/B07R2_CODE_CHANGE_MANIFEST.json').read_text(encoding='utf-8'))
          sc=json.loads((r/'reports/B07R2_BOUNDED_SELFCHECK.json').read_text(encoding='utf-8'))
          a=[]
          a += ['# 星核天枢 B01-B07 加强优化 R2 完整交付报告','', '范围：只返工/加强 B01-B07；B08 明确未开始。','']
          a += [f"## 修改代码/构建文件：{len(ch['files'])} 个",'']
          for x in ch['files']:
              a += [f"- `{x['file']}`：{x['change']}",f"  - 行数：{x['before_lines']} -> {x['after_lines']}",f"  - SHA：{x['before_sha256']} -> {x['after_sha256']}"]
          a += ['', '## 本轮核心修复',
                '- 后台：UI退出/taskRemoved继续运行，刷新runtime lease；进程重新创建且DB验收通过后主动重挂前台服务；Alarm/Job继续兜底。',
                '- 闪退/OOM：低内存时清理重型缓存但不停止服务；CrashRecorder增加10分钟崩溃窗口、fingerprint、maxMemory。',
                '- 真实出手：不伪造MODEL_PROVEN，不拆质量门；活动V51天枢链只要严格DecisionGate真实通过即可记录BET_ALLOWED_BY_STRICT_GATE。V50_PRIME未启用时V50 typed proof-lock不应支配天枢活动链。',
                '- 检测报告：构建时固化B01-B07全部54计划文件的存在性、行数、有效行、TODO命中、SHA；运行时再结合后台/API/DB/预测/结算/真实BET/SHADOW/OOS/ECE/Wilson/频率生成动态根因。',
                '- 40/50/60：明确区分观测、样本不足、Wilson未证明和真正达标，不把目标数字伪装成效果。',
                '- 频率：不使用频率债务补单；报告给出CertifiedCoverageExpansion等具体扩域方法。',
                '', '## 自检', f"PASS={sc['pass']} FAIL={sc['fail']} missingPlanFiles={len(sc['missing_plan_entries'])}",
                '详见 `reports/B07R2_BOUNDED_SELFCHECK.json`、`reports/B07R2_REPAIR_OUTPUT.log` 与 `reports/B07R2_GRADLE_BUILD.log`。']
          (r/'reports/B07R2_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md').write_text('\n'.join(a),encoding='utf-8')
          PY

      - name: Commit reinforced full source and reports
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/ethk3/novaonepro/AppConfig.java app/src/main/java/com/ethk3/novaonepro/BootReceiver.java app/src/main/java/com/ethk3/novaonepro/AutoFetchService.java app/src/main/java/com/ethk3/novaonepro/MainActivity.java app/src/main/java/com/ethk3/novaonepro/CrashRecorder.java app/src/main/java/com/ethk3/novaonepro/DecisionGateEngine.java app/src/main/java/com/ethk3/novaonepro/V50BootstrapProvider.java app/src/main/java/com/ethk3/novaonepro/B07R2BuildAuditManifest.java app/src/main/java/com/ethk3/novaonepro/B07R2FullDiagnosticEngine.java reports/B07R2_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'feat(starcore): B01-B07 reinforced R2 runtime action diagnosis'
            git push origin HEAD:work/starcore-tianshu-b07r2-20260807
          fi
          git rev-parse HEAD | tee delivery/COMMIT_SHA.txt

      - name: Package complete source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=zip --output=delivery/Starcore-Tianshu-B01-B07-Reinforced-R2-20260807-FULL-SOURCE.zip HEAD
          cp reports/B07R2_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/
          cp reports/B07R2_BOUNDED_SELFCHECK.json delivery/
          cp reports/B07R2_CODE_CHANGE_MANIFEST.json delivery/
          cp reports/B07R2_BUILD_TIMING.txt delivery/
          cp reports/B07R2_GRADLE_BUILD.log delivery/
          cp reports/B07R2_REPAIR_OUTPUT.log delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Promote accepted branch only when all 54 plan files are present
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,sys
          x=json.load(open('reports/B07R2_BOUNDED_SELFCHECK.json',encoding='utf-8'))
          if x['missing_plan_entries']:
              print('NOT_PROMOTED: missing plan files =',len(x['missing_plan_entries']))
              for m in x['missing_plan_entries']: print(m)
              sys.exit(0)
          print('PROMOTE_OK')
          PY
          if grep -q '^PROMOTE_OK$' <(python3 - <<'PY'
          import json
          x=json.load(open('reports/B07R2_BOUNDED_SELFCHECK.json',encoding='utf-8'))
          print('PROMOTE_OK' if not x['missing_plan_entries'] else 'NO')
          PY
          ); then
            git push origin HEAD:accepted/starcore-tianshu-b07r2-20260807 --force-with-lease || git push origin HEAD:accepted/starcore-tianshu-b07r2-20260807
          fi

      - name: Upload delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-B07-Reinforced-R2-20260807-Delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 30
