name: O09 current Android source validation
on:
  push:
    branches: [construction/optimized299-o01-20261008, construction/r75-live-chain-20261013, construction/r78-report1015-repair-20261015]
    paths:
      - 'app/**'
      - 'release/**'
      - 'scripts/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/o09-current-source-validation.yml'
      - '.github/workflows/r77-ci-log-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-compile-native-dex-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Free unused toolchains on disposable hosted runner
        shell: bash
        run: |
          python3 - <<'PYSPACE'
          import os, pathlib, shutil, subprocess
          if os.environ.get('GITHUB_ACTIONS') != 'true' or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted':
              raise SystemExit('Disk preparation is restricted to disposable GitHub-hosted runners')
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          manager = next(p for p in (sdk/'cmdline-tools/latest/bin/sdkmanager', sdk/'cmdline-tools/12.0/bin/sdkmanager') if p.is_file())
          for installed in sorted((sdk/'ndk').glob('*')):
              if installed.is_dir() and installed.name != '28.2.13676358':
                  subprocess.run([str(manager), '--uninstall', 'ndk;' + installed.name], check=True)
          # This workflow uses Java/Python/Android only. The hosted image's .NET SDK is disposable.
          unused = pathlib.Path('/usr/share/dotnet')
          if unused.is_dir() and not unused.is_symlink():
              subprocess.run(['sudo', 'rm', '-rf', '--', str(unused)], check=True)
          print('O09_RUNNER_FREE_BYTES=' + str(shutil.disk_usage(os.environ['RUNNER_TEMP']).free), flush=True)
          PYSPACE
      - name: Install exact existing Android toolchain
        shell: bash
        run: |
          python3 - <<'PYSDK'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk'))
          candidates = [sdk/'cmdline-tools/latest/bin/sdkmanager', sdk/'cmdline-tools/12.0/bin/sdkmanager']
          manager = next((p for p in candidates if p.is_file()), None)
          if manager is None:
              raise SystemExit('Android command-line tools are missing from the runner SDK')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_HOME={sdk}\nANDROID_SDK_ROOT={sdk}\n')
          subprocess.run([str(manager),'--licenses'],input='y\n'*200,text=True,check=True)
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0',
                          'ndk;28.2.13676358','cmake;3.22.1'],check=True)
          PYSDK
      - name: Verify disposable Android emulator boots before compiling
        id: emulator_boot
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 scripts/o09_android_emulator.py --boot-only
      - name: Validate current production Java, Android native ABI, D8 and lint
        shell: bash
        run: |
          mkdir -p validation-o09
          git rev-parse HEAD > validation-o09/input-commit.txt
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :app:compileDebugJavaWithJavac :app:externalNativeBuildDebug :app:mergeProjectDexDebug :app:lintDebug 2>&1 | tee validation-o09/android-validation.log
      - name: Prepare independent D04 NumPy and host Java parity fixtures
        shell: bash
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/o09-d04-python"
          "$RUNNER_TEMP/o09-d04-python/bin/python" -m pip install numpy==2.2.6
          echo "$RUNNER_TEMP/o09-d04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/o09-d04-python/bin/python" scripts/o09_d04_parity.py prepare --output validation-o09/d04 2>&1 | tee validation-o09/d04-prepare.log
      - name: Build internal Android test packages through normal gates
        id: android_packages
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee validation-o09/android-test-build.log
      - name: Run actual Android rolling and rollback contract
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 scripts/o09_android_emulator.py --tests-only
      - name: Run independent Android runtime contracts
        if: ${{ !cancelled() && steps.android_packages.outcome == 'success' && steps.emulator_boot.outcome == 'success' }}
        run: python3 scripts/o09_android_runtime_validation.py --output validation-o09/runtime --d04-parity-dir validation-o09/d04
      - name: Preserve exact validation evidence in job log
        if: always()
        run: python3 scripts/o09_validation_log_fallback.py
      - name: Preserve validation logs and generated identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o09-current-source-validation-${{ github.sha }}
          path: |
            validation-o09/
            app/build/reports/lint-results-debug.*
            app/build/generated/r815/source-manifest.json
            app/build/generated/r967/semantic_manifest.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  scoped-evidence-recovery:
    needs: android-compile-native-dex-lint
    if: ${{ always() && !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/r77-ci-log-recovery.yml
