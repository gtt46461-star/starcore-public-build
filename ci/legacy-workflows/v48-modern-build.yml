name: V48 Atomic Source Selfcheck Model Lab And APK
on:
  pull_request:
    branches:
      - agent/v47-modern-crossfit-final40
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v48-atomic-final-build
  cancel-in-progress: true
jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/v48-point-in-time-single-action-champion
          fetch-depth: 0
      - name: Detect imported V48 source
        id: source
        shell: bash
        run: |
          if [[ -f app/src/main/java/com/ethk3/novaonepro/V48BuildManifest.java ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap source not imported yet; final build safely skips this initial PR event.'
          fi
      - name: Upload exact remote bootstrap payload for byte audit
        if: steps.source.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: V48-remote-bootstrap-payload-byte-audit
          path: .github/v48-bootstrap/*
          if-no-files-found: error
          retention-days: 2
      - name: Set up Python
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static contracts, model lab and fifteen harnesses
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check javalang==0.13.0 numpy==2.3.5 scikit-learn==1.8.0 lightgbm==4.6.0 xgboost==3.1.3
          python tools/v48_static_selfcheck.py | tee reports/V48_FINAL_STATIC.log
          python tools/run_v48_harnesses.py | tee reports/V48_FINAL_HARNESSES.log
          git diff --name-only origin/agent/v47-modern-crossfit-final40...HEAD | sort > reports/V48_65_ITEM_MANIFEST.txt
          test "$(wc -l < reports/V48_65_ITEM_MANIFEST.txt | tr -d ' ')" -eq 65
          python - <<'PY' | tee reports/V48_FINAL_JAVA_PARSE.log
          from pathlib import Path
          import javalang
          files=list(Path('app/src/main/java/com/ethk3/novaonepro').glob('*.java'))
          errors=[]
          for path in files:
              try: javalang.parse.parse(path.read_text('utf-8'))
              except Exception as exc: errors.append((str(path),str(exc)))
          print('java_files=%d parse_errors=%d' % (len(files),len(errors)))
          raise SystemExit(1 if errors or len(files)!=157 else 0)
          PY
          python training/build_dataset.py research_data/ethpk10_draws_20260316_201059.csv --output /tmp/v48_dataset.npz | tee reports/V48_DATASET_BUILD.log
          python training/train_compare_export.py /tmp/v48_dataset.npz --output reports/V48_MODEL_LAB.json --max-train-rows 30000 | tee reports/V48_MODEL_LAB.log
      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Android SDK
        if: steps.source.outputs.present == 'true'
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        if: steps.source.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile V48 APK
        if: steps.source.outputs.present == 'true'
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p reports dist
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/V48_FINAL_GRADLE_BUILD.log
          status=${PIPESTATUS[0]}; echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 && -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/ETH-K3-Nova-One-Pro-V48.0.48072148-debug.apk
          fi
          exit 0
      - name: Package exact source and evidence
        if: always() && steps.source.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports dist
          git rev-parse HEAD > reports/V48_FINAL_COMMIT_SHA.txt
          git archive --format=zip --output=dist/ETH-K3-Nova-One-Pro-V48.0.48072148-full-source.zip HEAD
          grep -E -n 'error:|cannot find symbol|FAILURE:|What went wrong|Execution failed|Compilation failed' reports/V48_FINAL_GRADLE_BUILD.log > reports/V48_FINAL_GRADLE_ERRORS.txt || true
          sha256sum dist/* > reports/V48_FINAL_CHECKSUMS.txt || true
      - name: Upload V48 final delivery
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ETH-K3-Nova-One-Pro-V48.0.48072148-final-delivery
          path: |
            dist/*
            reports/V48_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce compile success
        if: always() && steps.source.outputs.present == 'true'
        run: test "${{ steps.build.outputs.status }}" = '0'
