name: R77 final Android evidence recovery
on:
  push:
    branches: [construction/r75-live-chain-20261013]
    paths: ['.github/workflows/r77-ci-final-evidence.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recover-scoped-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read prior job through normal Actions API and print scoped evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'gtt46461-star/eth-k3-v43-nova'
          job = 115330867042
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=60)
              raw = response.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise RuntimeError('Actions log API HTTP ' + str(error.code)) from None
              location = error.headers['Location']
              assert urllib.parse.urlparse(location).scheme == 'https'
              # The GitHub bearer token is never sent to the signed blob URL.
              raw = urllib.request.urlopen(location, timeout=60).read()
          text = raw.decode('utf-8-sig')
          print('R77_ORIGINAL_JOB_LOG_SHA256|' + hashlib.sha256(raw).hexdigest())
          for line in text.splitlines():
              if any(token in line for token in ('O09_ANDROID_CLASS_START|', 'O09_ANDROID_CLASS_RESULT|',
                      'O09_ANDROID_RUNTIME_RECEIPT|', 'ANDROID_R77_BUSY_', '##[error]')):
                  print(line[:20000])
          manifest = json.loads(re.search(r'O09_EVIDENCE_MANIFEST\|(\{[^\r\n]+\})', text).group(1))
          chunks = {}
          for index, content in re.findall(r'O09_EVIDENCE_CHUNK\|(\d+)\|([A-Za-z0-9+/=]+)', text):
              assert int(index) not in chunks, 'duplicate evidence chunk'
              chunks[int(index)] = content
          assert sorted(chunks) == list(range(len(chunks))), 'missing evidence chunk'
          archive = base64.b64decode(''.join(chunks[i] for i in sorted(chunks)), validate=True)
          assert len(archive) == manifest['bytes']
          assert hashlib.sha256(archive).hexdigest() == manifest['sha256']
          print('R77_FALLBACK_ARCHIVE_VERIFIED|' + json.dumps(manifest))
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              receipt = json.loads(bundle.read('validation-o09/runtime/receipt.json'))
              assert receipt['commit'] == 'ce2d7454992d6c140addfa48381a8d45cebe7c9a'
              print('R77_RUNTIME_RECEIPT|' + json.dumps(receipt))
              selected = {'SqliteBusyPoolR77Test'} | {item['class'] for item in receipt.get('tests', []) if not item.get('passed')}
              for name in sorted(selected):
                  path = 'validation-o09/runtime/' + name + '.log'
                  if path in bundle.namelist():
                      value = bundle.read(path).decode('utf-8', errors='replace')
                      print('R77_TEST_LOG_BEGIN|' + name)
                      print(value[-60000:])
                      print('R77_TEST_LOG_END|' + name)
                  path = 'validation-o09/runtime/' + name + '-logcat.log'
                  if path in bundle.namelist():
                      rows = bundle.read(path).decode('utf-8', errors='replace').splitlines()
                      hits = [i for i, line in enumerate(rows) if re.search(r'ANDROID_R77|AssertionError|FATAL EXCEPTION|ANR in|SQLITE|SQLite.*(Exception|locked)|TestRunner.*(failed|finished)|TimeoutException', line)]
                      chosen = sorted({j for i in hits for j in range(max(0, i - 3), min(len(rows), i + 12))})
                      print('R77_SCOPED_LOGCAT_BEGIN|' + name)
                      for i in chosen[-500:]: print(rows[i])
                      print('R77_SCOPED_LOGCAT_END|' + name)
          PY
