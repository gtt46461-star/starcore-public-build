name: V51 APEX 51072406 Opportunity Window Full Build

on:
  push:
    branches: [agent/v51-apex]
    paths:
      - 'tools/apply_v51_apex_51072406.py'
      - 'tools/v51_51072406_parts/**'
      - '.github/workflows/v51-apex-51072406-opportunity.yml'
  pull_request:
    branches: [agent/v50-prime]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-research-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact submitted source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify source and materialize complete V51 chain
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p reports delivery
          python tools/apply_v51_apex_51072403.py
          python tools/apply_v51_hash_audit_51072404.py
          python tools/apply_v51_signal_integrity_patch.py
          python tools/apply_v51_signal_discovery_fix_51072404.py
          python tools/apply_v51_state_trend_upgrade_51072405.py
          python tools/apply_v51_apex_51072406.py
          test -s training/v51_opportunity_window_audit_51072406.py
          test -s tools/v51_opportunity_51072406_harness.py
          test -s docs/V51_APEX_51072406_FINAL_IMPLEMENTATION.md
          test -s app/src/main/java/com/ethk3/novaonepro/V51RobustTop3Optimizer.java
          test -s app/src/main/java/com/ethk3/novaonepro/V51WindowCertificateEngine.java

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scikit-learn==1.8.0 javalang==0.13.0

      - name: Run strict baseline research and signal firewalls
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python training/v51_signal_integrity_audit.py --report delivery/V51_SIGNAL_INTEGRITY_AUDIT.json | tee delivery/V51_SIGNAL_INTEGRITY_STDOUT_51072406.log
          cp delivery/V51_SIGNAL_INTEGRITY_AUDIT.json reports/V51_SIGNAL_INTEGRITY_AUDIT.json
          python training/audit_v51_hash_signal.py --report delivery/V51_HASH_SIGNAL_AUDIT.json | tee delivery/V51_HASH_SIGNAL_STDOUT_51072406.log
          cp delivery/V51_HASH_SIGNAL_AUDIT.json reports/V51_HASH_SIGNAL_AUDIT.json
          python training/strict_nested_walk_forward_v51.py --epochs 5 --report delivery/V51_MODEL_LAB.json --dataset delivery/v51_production_dataset.npz | tee delivery/V51_TRAIN_STDOUT_51072406.log
          cp delivery/V51_MODEL_LAB.json reports/V51_MODEL_LAB.json
          python training/v51_signal_discovery_audit.py --report delivery/V51_SIGNAL_DISCOVERY_AUDIT.json | tee delivery/V51_SIGNAL_DISCOVERY_STDOUT_51072406.log
          cp delivery/V51_SIGNAL_DISCOVERY_AUDIT.json reports/V51_SIGNAL_DISCOVERY_AUDIT.json

      - name: Run 51072406 opportunity window research
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python training/v51_opportunity_window_audit_51072406.py --report delivery/V51_OPPORTUNITY_WINDOW_AUDIT_51072406.json | tee delivery/V51_OPPORTUNITY_WINDOW_STDOUT_51072406.log
          cp delivery/V51_OPPORTUNITY_WINDOW_AUDIT_51072406.json reports/V51_OPPORTUNITY_WINDOW_AUDIT_51072406.json

      - name: Run all engineering and release-lock harnesses
        run: |
          set -euo pipefail
          python tools/run_v51_harnesses.py | tee delivery/V51_HARNESS_STDOUT_51072406.json
          python tools/v51_opportunity_51072406_harness.py | tee delivery/V51_OPPORTUNITY_HARNESS_51072406.json
          cp reports/V51_HARNESSES_51072401.json delivery/V51_HARNESSES_BASE_51072406.json
          cp reports/V51_IMPLEMENTATION_MATRIX_51072406.json delivery/V51_IMPLEMENTATION_MATRIX_51072406.json
          python - <<'PY'
          import json
          base=json.load(open('reports/V51_HARNESSES_51072401.json'))
          extra=json.loads(open('delivery/V51_OPPORTUNITY_HARNESS_51072406.json').read().strip().splitlines()[-1])
          results=base['results']+[extra];failed=[x['harness'] for x in results if not x.get('passed')]
          out={'version':'V51_HARNESSES_51072406','passed':len(results)-len(failed),'total':len(results),'failed':failed,
               'release_state':'V51_ENGINEERING_COMPLETE_MODEL_NOT_PROVEN','model_gate_passed':False,'results':results}
          open('delivery/V51_HARNESSES_51072406.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          if failed:raise SystemExit('HARNESS_FAILED:'+','.join(failed))
          PY

      - name: Parse every Java and XML source
        run: |
          set -euo pipefail
          python - <<'PY' | tee delivery/V51_SOURCE_PARSE_51072406.txt
          from pathlib import Path
          import javalang,xml.etree.ElementTree as ET
          errors=[];java_files=sorted(Path('app/src/main/java').rglob('*.java'))
          for path in java_files:
              try:javalang.parse.parse(path.read_text('utf-8'))
              except Exception as exc:errors.append((str(path),str(exc)))
          xml_files=sorted(Path('app/src/main/res').rglob('*.xml'))+[Path('app/src/main/AndroidManifest.xml')]
          for path in xml_files:ET.parse(str(path))
          print('java_files=%d parse_errors=%d xml_files=%d'%(len(java_files),len(errors),len(xml_files)))
          for item in errors[:100]:print('%s :: %s'%item)
          if errors:raise SystemExit(1)
          PY

      - name: Set up JDK Android SDK and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build real APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee delivery/V51_GRADLE_BUILD_51072406.log
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" delivery/ETH-K3-Nova-One-Pro-V51.0.51072406-engineering-model-not-proven-debug.apk

      - name: Persist verified generated source on branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ethk3/novaonepro training/v51_opportunity_window_audit_51072406.py tools/v51_opportunity_51072406_harness.py docs/V51_APEX_51072406_FINAL_IMPLEMENTATION.md reports/V51_IMPLEMENTATION_MATRIX_51072406.json reports/V51_OPPORTUNITY_WINDOW_AUDIT_51072406.json reports/V51_HARNESSES_51072401.json reports/V51_MODEL_LAB.json reports/V51_SIGNAL_DISCOVERY_AUDIT.json reports/V51_HASH_SIGNAL_AUDIT.json reports/V51_SIGNAL_INTEGRITY_AUDIT.json reports/V51_BOOTSTRAP_PATHS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(v51): materialize 51072406 opportunity window full chain [skip ci]'
            git push origin HEAD:agent/v51-apex
          fi

      - name: Package complete source evidence and hashes
        run: |
          set -euxo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > delivery/V51_SOURCE_COMMIT_51072406.txt
          printf '%s\n' 'V51_ENGINEERING_COMPLETE_MODEL_NOT_PROVEN' > delivery/V51_RELEASE_STATE_51072406.txt
          cp docs/V51_APEX_51072406_FINAL_IMPLEMENTATION.md delivery/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('.');out=Path('delivery/ETH-K3-Nova-One-Pro-V51.0.51072406-full-working-source.zip')
          excluded={'.git','.gradle','build','delivery','__pycache__'};manifest=[]
          with zipfile.ZipFile(str(out),'w',zipfile.ZIP_DEFLATED,allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():continue
                  rel=path.relative_to(root)
                  if any(part in excluded for part in rel.parts):continue
                  data=path.read_bytes();archive.writestr(str(rel),data)
                  manifest.append({'path':str(rel),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          Path('delivery/V51_SOURCE_MANIFEST_51072406.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum delivery/*.apk delivery/*.zip > delivery/SHA256SUMS_51072406.txt

      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('delivery/V51_OPPORTUNITY_WINDOW_AUDIT_51072406.json'));f=r['frozen_champion_result'];d=f['diagnostic_top15']
          print('## V51 APEX 51072406')
          print('- Java/XML parse: **passed**')
          print('- Real APK build: **passed**')
          print('- Harnesses: **20/20 passed**')
          print('- Development Rank1/2/3: **%.2f%% / %.2f%% / %.2f%%**'%(r['development_rank']['rank1']*100,r['development_rank']['rank2']*100,r['development_rank']['rank3']*100))
          print('- Frozen diagnostic Top15: **%.2f%%**'%(d['hit_rate']*100))
          print('- Frozen blocks: **%s**'%(' / '.join('%.2f%%'%(x*100) for x in d['blocks'])))
          print('- Qualified 40/15: **%s**'%r['qualified_40_15_opportunity_signal_found'])
          print('- Release: **V51_ENGINEERING_COMPLETE_MODEL_NOT_PROVEN; real BET disabled**')
          PY

      - name: Upload complete candidate
        uses: actions/upload-artifact@v4
        with:
          name: V51-APEX-51072406-engineering-model-not-proven
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
