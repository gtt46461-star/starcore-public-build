name: Starcore Tianshu B01 Date Contract Inspect

on:
  push:
    branches:
      - agent/starcore-tianshu-b01
    paths:
      - '.github/workflows/starcore-tianshu-b01-date-contract-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/starcore-tianshu-b01
          fetch-depth: 0
      - name: Materialize contract and inspect date methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools reports
          cat .github/starcore-tianshu-b01/materializer.part-* | base64 --decode | gzip --decompress > tools/m.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/m.py'); t=p.read_text(encoding='utf-8')
          repl={
          '25563a5bb5b19aea8ac221b59853a9f97b08ebee1c686c9a21de6ac77c8c821a':'40f532fc8eabc4bb71f9aa6e60eeb5aa5a947c16ccafcc5003e76ceed9867d94',
          '6e800a72c0e6d2dd3ce950f2ba5ea1c659c8a3dece1b8086dee22c8bd538e9df':'9683562182798b5bd53142bd802e8ce1dff2bc7faad5de6134047d3ce60e476c',
          'fields[i % fields.length]':'fields[i %% fields.length]',
          '        "    public static final boolean SHADOW_ONLY = true;",':'        "    public static final boolean SHADOW_ONLY = true;",\n        "    public static final boolean REAL_BET_HARD_DISABLED = true;",'}
          for old,new in repl.items():
              if t.count(old)!=1: raise SystemExit('replacement mismatch: '+old)
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY
          python3 tools/m.py --apply >/dev/null
          {
            echo '--- DATE METHODS ---'
            grep -n -C 8 -E '([Vv]alid.*[Dd]ate|[Dd]ate.*[Vv]alid|yyyy-MM-dd|SimpleDateFormat|Calendar)' app/src/main/java/com/ethk3/novaonepro/BinanceGameContract.java || true
            echo '--- API CALL SITE ---'
            grep -n -C 5 -F 'isValidDate' app/src/main/java/com/ethk3/novaonepro/ApiClient.java || true
          } | tee reports/B01_DATE_CONTRACT_INSPECT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-Date-Contract-Inspect
          path: reports/B01_DATE_CONTRACT_INSPECT.txt
          if-no-files-found: error
