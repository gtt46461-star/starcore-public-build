name: C008 field follow-up recovery and diagnostic repair
# Original plan P014 KEEP_VERIFY; unchanged product sources, real host and release compilation.
on:
  push:
    branches: [construction/c008-field-followup-20261019]
    paths: ['.github/workflows/c008-field-followup.yml']
permissions:
  contents: write
concurrency:
  group: starcore-c008-field-followup
  cancel-in-progress: false
jobs:
  complete-source-contracts:
    if: github.ref == 'refs/heads/construction/c008-field-followup-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install formal Android API36 and the existing complete toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          sdk=pathlib.Path(os.environ['ANDROID_HOME']);manager=sdk/'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager),'--licenses'],input='y\n'*200,text=True,check=True)
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0','ndk;28.2.13676358','cmake;3.22.1'],check=True)
          PY
      - name: Fresh full host and release compilation, actual historical owner boundaries and retained contracts
        run: python3 construction/c_chain_20261018/C008-followup/ci_verify.py

