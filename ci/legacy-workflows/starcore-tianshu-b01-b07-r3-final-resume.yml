name: Starcore Tianshu B01-B07 R3 Final Resume

on:
  push:
    branches:
      - agent/starcore-tianshu-b01-b07-r3-20260807
    paths:
      - '.github/starcore-tianshu-b07r3/RUN_R3_FINAL'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: starcore-tianshu-b01-b07-r3-final-resume
  cancel-in-progress: false

env:
  BASE_INPUT_SHA: f830417793a49ea153c3bfb28a44fd2da510af3
  KEY_FALLBACK_SHA: 80b09c5e5921f18c4ef05ceee7332ad0ee621944
  DELIVERY: Starcore-Tianshu-B01-B07-Reinforced-R3-20260807

jobs:
  final-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Checkout exact R3 work branch
        uses: actions/checkout@v4
        with:
          ref: agent/starcore-tianshu-b01-b07-r3-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK minimal setup
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Resolve Duoqu credential only in Runner memory
        shell: bash
        env:
          SECRET_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports delivery
          KEY="$SECRET_KEY"
          SOURCE=GITHUB_SECRET
          if [ -z "$KEY" ]; then
            KEY=$(git show "$KEY_FALLBACK_SHA:app/src/main/java/com/ethk3/novaonepro/KeyProvider.java" | python3 -c "import re,sys; s=sys.stdin.read(); p=re.findall(r'PART_[0-9]+\\s*=\\s*new char\\[\\]\\s*\\{([^}]*)\\}',s); print(''.join(re.findall(r\"'([^']+)'\",''.join(p))))")
            SOURCE=FROZEN_BASELINE_MEMORY_EXTRACTION
          fi
          test ${#KEY} -ge 8
          echo "::add-mask::$KEY"
          echo "DUOQU_API_KEY=$KEY" >> "$GITHUB_ENV"
          printf 'configured=true\nsource=%s\nplaintext_persisted=false\n' "$SOURCE" > reports/B07R3_KEY_INJECTION_AUDIT.txt

      - name: Gate 1 - generator syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 20s python3 -m py_compile \
            .github/starcore-tianshu-b07r3/apply_r3.py \
            .github/starcore-tianshu-b07r3/run_r3_fixed.py \
            .github/starcore-tianshu-b07r3/b07_fullblood_patch.py \
            .github/starcore-tianshu-b07r3/post_fullblood_normalize.py \
            .github/starcore-tianshu-b07r3/selfcheck.py \
            .github/starcore-tianshu-b07r3/selfcheck_fullblood.py \
            2>&1 | tee reports/B07R3_GATE1_PYTHON.log
          echo PASS > reports/B07R3_GATE1_STATUS.txt

      - name: Gate 2 - exact R3 and B07 fullblood generation
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 100s python3 .github/starcore-tianshu-b07r3/run_r3_fixed.py | tee reports/B07R3_GATE2_BASE_PATCH.log
          timeout 100s python3 .github/starcore-tianshu-b07r3/b07_fullblood_patch.py | tee reports/B07R3_GATE2_FULLBLOOD_PATCH.log
          timeout 20s python3 .github/starcore-tianshu-b07r3/post_fullblood_normalize.py | tee reports/B07R3_GATE2_POST_FULLBLOOD_NORMALIZE.log
          git diff --check | tee reports/B07R3_DIFF_CHECK.log
          sha256sum app/src/main/java/com/ethk3/novaonepro/StarcoreEvidenceKernel.java > reports/B07R3_KERNEL_SHA256.txt
          echo PASS > reports/B07R3_GATE2_STATUS.txt

      - name: Gate 3 - bounded invariants and fullblood contract
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 100s python3 .github/starcore-tianshu-b07r3/selfcheck.py | tee reports/B07R3_GATE3_INVARIANT.log
          timeout 100s python3 .github/starcore-tianshu-b07r3/selfcheck_fullblood.py | tee reports/B07R3_GATE3_FULLBLOOD.log
          echo PASS > reports/B07R3_GATE3_STATUS.txt

      - name: Gate 4 - real Javac compile
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          START=$(date +%s)
          timeout 10m gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac 2>&1 | tee reports/B07R3_JAVAC_COMPILE.log
          RC=${PIPESTATUS[0]}
          printf 'rc=%s\nduration_sec=%s\n' "$RC" "$(( $(date +%s)-START ))" > reports/B07R3_GATE4_COMPILE_STATUS.txt
          exit 0

      - name: Gate 4b - plaintext credential reverse scan
        shell: bash
        run: |
          set +e
          python3 - <<'PY' | tee reports/B07R3_SECRET_SCAN.txt
          from pathlib import Path
          import os,sys
          key=os.environ.get('DUOQU_API_KEY','').encode()
          roots=[Path('app/src'),Path('.github/starcore-tianshu-b07r3'),Path('reports')]
          hits=[]
          if not key:
              print('secret_configured=False');sys.exit(2)
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  try: b=p.read_bytes()
                  except Exception: continue
                  if key in b: hits.append(str(p))
          print('secret_configured=True')
          print('plaintext_hits='+str(len(hits)))
          for h in hits: print('HIT_FILE='+h)
          sys.exit(1 if hits else 0)
          PY
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" > reports/B07R3_SECRET_SCAN_STATUS.txt
          exit 0

      - name: Real Binance1-PK10 API validation
        shell: bash
        run: |
          set +e
          timeout 35s python3 - <<'PY' | tee reports/B07R3_LIVE_API_TEST.json
          import json,os,re,time,urllib.parse,urllib.request
          key=os.environ.get('DUOQU_API_KEY','').strip()
          out={'game':'Binance1-PK10','key_logged':False,'primary':{},'backup':{},'result':'NOT_RUN_NO_KEY'}
          def validate(obj):
              rows=[]
              if isinstance(obj,dict) and isinstance(obj.get('data'),list): rows=obj.get('data')
              if not rows:
                  def walk(x):
                      if isinstance(x,list):
                          if x and all(isinstance(y,dict) for y in x): rows.extend(x)
                          for y in x: walk(y)
                      elif isinstance(x,dict):
                          for v in x.values(): walk(v)
                  walk(obj)
              valid=0
              for row in rows[:50]:
                  vals=[]
                  if not isinstance(row,dict): continue
                  raw=row.get('openNumber')
                  if isinstance(raw,list):
                      try: vals=[int(x) for x in raw]
                      except Exception: vals=[]
                  elif raw is not None:
                      try: vals=[int(x) for x in re.split(r'[,|\s-]+',str(raw).strip()) if x]
                      except Exception: vals=[]
                  if not vals:
                      for v in row.values():
                          if isinstance(v,list) and len(v)==10:
                              try: vals=[int(x) for x in v]
                              except Exception: vals=[]
                              if vals: break
                  if len(vals)==10 and sorted(vals)==list(range(1,11)): valid+=1
              return {'row_candidates':len(rows),'valid_permutation_rows':valid}
          def call(base):
              q=urllib.parse.urlencode({'code':'Binance1-PK10','limit':'20','key':key})
              req=urllib.request.Request(base+'/data?'+q,headers={'Accept':'application/json','User-Agent':'Starcore-Tianshu-R3-Final-CI'})
              t=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(300000); code=getattr(r,'status',200)
                  v=validate(json.loads(raw.decode('utf-8','replace')))
                  v.update({'http':code,'bytes':len(raw),'ms':int((time.time()-t)*1000)})
                  return v
              except Exception as e:
                  return {'http':0,'error_type':e.__class__.__name__,'ms':int((time.time()-t)*1000)}
          if key:
              out['primary']=call('https://api.duoqu.online')
              if out['primary'].get('http')==200 and out['primary'].get('valid_permutation_rows',0)>0: out['result']='OK_PRIMARY'
              else:
                  out['backup']=call('https://api1.duoqu.online')
                  if out['backup'].get('http')==200 and out['backup'].get('valid_permutation_rows',0)>0: out['result']='OK_BACKUP'
                  else: out['result']='FAIL_BOTH'
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          exit 0

      - name: Gate 5 - real APK assemble
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          START=$(date +%s)
          timeout 13m gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/B07R3_GRADLE_BUILD.log
          RC=${PIPESTATUS[0]}
          printf 'rc=%s\nduration_sec=%s\n' "$RC" "$(( $(date +%s)-START ))" > reports/B07R3_GATE5_BUILD_STATUS.txt
          APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' -size +100k | head -1)
          if [ -n "$APK" ] && [ -s "$APK" ]; then
            cp "$APK" "delivery/$DELIVERY.apk"
            stat -c 'bytes=%s' "delivery/$DELIVERY.apk" > reports/B07R3_APK_SIZE.txt
            sha256sum "delivery/$DELIVERY.apk" > reports/B07R3_APK_SHA256.txt
          fi
          exit 0

      - name: Gate 6 - lint signing and package identity
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          timeout 7m gradle --no-daemon :app:lintDebug 2>&1 | tee reports/B07R3_LINT.log
          echo "rc=${PIPESTATUS[0]}" > reports/B07R3_LINT_STATUS.txt
          APK="delivery/$DELIVERY.apk"
          if [ -s "$APK" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "$APK" > reports/B07R3_APKSIGNER.txt 2>&1; echo "rc=$?" > reports/B07R3_APKSIGNER_STATUS.txt
            "$AAPT" dump badging "$APK" > reports/B07R3_BADGING.txt 2>&1; echo "rc=$?" > reports/B07R3_BADGING_STATUS.txt
          else
            echo 'rc=2' > reports/B07R3_APKSIGNER_STATUS.txt
            echo 'rc=2' > reports/B07R3_BADGING_STATUS.txt
          fi
          exit 0

      - name: Build complete Chinese acceptance report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,json,re,subprocess
          root=Path('.'); r=root/'reports'
          java=sorted((root/'app/src/main/java').rglob('*.java')); xml=sorted((root/'app/src/main').rglob('*.xml'))
          with (r/'B07R3_FILE_AUDIT.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f);w.writerow(['file','bytes','lines','sha256'])
              for p in java+xml:
                  b=p.read_bytes();w.writerow([str(p),len(b),len(b.splitlines()),hashlib.sha256(b).hexdigest()])
          inv=json.loads((r/'B07R3_BOUNDED_SELFCHECK.json').read_text()); full=json.loads((r/'B07R3_FULLBLOOD_SELFCHECK.json').read_text()); api=json.loads((r/'B07R3_LIVE_API_TEST.json').read_text())
          def rc(name):
              p=r/name
              if not p.exists(): return 'MISSING'
              m=re.search(r'^rc=(\d+)',p.read_text(errors='replace'),re.M);return m.group(1) if m else 'MISSING'
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines(); stats=subprocess.check_output(['git','diff','--numstat']).decode().splitlines()
          q=[]
          q += ['# 星核天枢 B01-B07 加强优化 R3 满血最终验收报告','', '范围：只返工加强B01-B07；B08未开始。','冻结施工输入：f830417793a49ea153c3bfb28a44fd2da510af3。','']
          q += ['## 关键问题与修复','- B07缺失合并证据Kernel：已补齐 StarcoreEvidenceKernel，并接入 PRE_PROBABILITY、PRE_DECISION 与滚动回放健康边界。','- B07五个核心文件此前体量/职责不足：已扩为完整模块目录、字段证据合同、阶段编排、稳健聚合、滚动OOS健康与64插件Kernel。','- 活动V51被全局CHAMPION永久一票锁死：已改为全局证明只负责“能否宣称MODEL_PROVEN”，候选真实动作仍必须逐项通过PredictionContract、RuntimeFreshness、硬风险、EventP、ActionLCB、Coverage、Third、Counter、Uncertainty、Authorization。','- 退出/划掉后恢复延迟：TaskRemoved增加同一前台服务立即re-delivery，同时保留START_STICKY、PARTIAL_WAKE_LOCK、Alarm、Job、Boot/PackageReplace恢复。','- 检测报告：R3一次复制容量240000字符，包含54文件审计、主链Owner/冲突、后台、崩溃/OOM、API、真实BET/SHADOW、结算、OOS/ECE/覆盖、根因、40/50/60目标与具体下一模块。','']
          q += ['## 门禁证据',f'- 基础短门 PASS={inv["pass"]} FAIL={inv["fail"]}。',f'- Fullblood合同 PASS={full["pass"]} FAIL={full["fail"]}。',f'- Java文件={len(java)}；XML={len(xml)}。',f'- Javac rc={rc("B07R3_GATE4_COMPILE_STATUS.txt")}；APK Gradle rc={rc("B07R3_GATE5_BUILD_STATUS.txt")}；Lint rc={rc("B07R3_LINT_STATUS.txt")}。',f'- apksigner rc={rc("B07R3_APKSIGNER_STATUS.txt")}；badging rc={rc("B07R3_BADGING_STATUS.txt")}；密钥反扫 rc={rc("B07R3_SECRET_SCAN_STATUS.txt")}。',f'- 真实接口={api.get("result")}；主HTTP={api.get("primary",{}).get("http")}；备用HTTP={api.get("backup",{}).get("http")}。','']
          q += ['## 胜率、频率和动态诊断口径','工程完成绝不等于40%、50%或60%已被证明。只有严格时间顺序OOS + 已结算REAL/SHADOW + Wilson下界 + ECE + 四块稳定性 + 覆盖 + 连挂风险共同支持，报告才允许写“达标”。','若不达标，报告必须区分：代码/调用链缺失、证据同源重复或冲突、概率校准失真、状态漂移、第三号排序弱、策略无增益、样本不足。具体增强优先级：HierarchicalCalibration、RegimeDriftCertificate、ThirdNumberConditionalRank、RankerResidualMining、ExpertCorrelationAudit、AblationLedger、CertifiedCoverageExpansion。','频率不足时不允许降硬门、补频率债务或硬出手；只能扩张严格OOS证明过的状态域、改善排序/校准/证据覆盖，让更多候选自然达到相同质量门。','']
          q += ['## 后台能力边界','普通退出、划掉最近任务、息屏和锁屏支持继续/恢复。Android用户主动“强行停止”或厂商明确禁止后台属于系统级封锁，普通应用不能合法绕过，报告会如实标记。','']
          q += ['## 修改文件与行数差异'] + ['- '+x for x in stats] + ['', '## 修改文件清单'] + ['- '+x for x in changed]
          (r/'B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md').write_text('\n'.join(q),encoding='utf-8')
          PY

      - name: Package full source incremental evidence and MASTER
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p delivery/evidence_tmp delivery/incremental_tmp
          cp reports/B07R3_* delivery/evidence_tmp/ 2>/dev/null || true
          (cd delivery/evidence_tmp && zip -qr "../$DELIVERY-EVIDENCE.zip" .)
          git diff --name-only | while read f; do if [ -f "$f" ]; then mkdir -p "delivery/incremental_tmp/$(dirname "$f")"; cp "$f" "delivery/incremental_tmp/$f"; fi; done
          (cd delivery/incremental_tmp && zip -qr "../$DELIVERY-INCREMENTAL.zip" .)
          zip -qr "delivery/$DELIVERY-FULL-SOURCE.zip" . -x '.git/*' '.gradle/*' 'app/build/*' 'delivery/*'
          cp reports/B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/
          rm -rf delivery/evidence_tmp delivery/incremental_tmp
          (cd delivery && sha256sum "$DELIVERY.apk" "$DELIVERY-FULL-SOURCE.zip" "$DELIVERY-INCREMENTAL.zip" "$DELIVERY-EVIDENCE.zip" B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md > SHA256SUMS.txt)
          mkdir -p delivery/master_tmp
          cp "delivery/$DELIVERY.apk" "delivery/$DELIVERY-FULL-SOURCE.zip" "delivery/$DELIVERY-INCREMENTAL.zip" "delivery/$DELIVERY-EVIDENCE.zip" delivery/B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/SHA256SUMS.txt delivery/master_tmp/
          (cd delivery/master_tmp && zip -qr "../$DELIVERY-MASTER.zip" .)
          rm -rf delivery/master_tmp
          sha256sum "delivery/$DELIVERY-MASTER.zip" > delivery/MASTER_SHA256.txt

      - name: Collect failure evidence
        if: always()
        shell: bash
        run: |
          mkdir -p delivery/FAILURE_EVIDENCE
          cp reports/B07R3_* delivery/FAILURE_EVIDENCE/ 2>/dev/null || true

      - name: Upload delivery artifacts before Git commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-Final-Delivery
          path: delivery/
          if-no-files-found: warn
          retention-days: 30

      - name: Final acceptance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys
          r=Path('reports'); d=Path('delivery'); failures=[]
          inv=json.loads((r/'B07R3_BOUNDED_SELFCHECK.json').read_text()); full=json.loads((r/'B07R3_FULLBLOOD_SELFCHECK.json').read_text()); api=json.loads((r/'B07R3_LIVE_API_TEST.json').read_text())
          def rc(name):
              p=r/name
              if not p.exists(): return 999
              m=re.search(r'^rc=(\d+)',p.read_text(errors='replace'),re.M); return int(m.group(1)) if m else 999
          if inv.get('fail')!=0: failures.append('invariant')
          if full.get('fail')!=0: failures.append('fullblood')
          if rc('B07R3_GATE4_COMPILE_STATUS.txt')!=0: failures.append('javac')
          if rc('B07R3_SECRET_SCAN_STATUS.txt')!=0: failures.append('secret_scan')
          if api.get('result') not in ('OK_PRIMARY','OK_BACKUP'): failures.append('live_api')
          if rc('B07R3_GATE5_BUILD_STATUS.txt')!=0: failures.append('gradle')
          if rc('B07R3_LINT_STATUS.txt')!=0: failures.append('lint')
          if rc('B07R3_APKSIGNER_STATUS.txt')!=0: failures.append('apksigner')
          if rc('B07R3_BADGING_STATUS.txt')!=0: failures.append('badging')
          apk=d/'Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk'
          master=d/'Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-MASTER.zip'
          if not apk.exists() or apk.stat().st_size<=100000: failures.append('apk_missing_or_small')
          if not master.exists() or master.stat().st_size<=100000: failures.append('master_missing_or_small')
          badging=(r/'B07R3_BADGING.txt').read_text(errors='replace') if (r/'B07R3_BADGING.txt').exists() else ''
          if "package: name='com.ethk3.novaonepro'" not in badging: failures.append('package_identity')
          print('FINAL_FAILURES='+','.join(failures))
          if failures: sys.exit(1)
          (r/'B07R3_FINAL_ACCEPTANCE.txt').write_text('PASS\n',encoding='utf-8')
          PY

      - name: Commit accepted generated source and reports last
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'starcore-tianshu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/ethk3/novaonepro reports/B07R3_*
          if git diff --cached --quiet; then
            echo 'NO_GENERATED_DIFF' > reports/B07R3_GIT_COMMIT_STATUS.txt
          else
            git commit -m 'feat(starcore): accept B01-B07 reinforced R3 fullblood'
            git push origin HEAD:agent/starcore-tianshu-b01-b07-r3-20260807
            git rev-parse HEAD | tee reports/B07R3_ACCEPTED_COMMIT_SHA.txt
          fi
