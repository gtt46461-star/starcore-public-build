name: C013 authoritative SYSTEM failure matrix and signed release build
on:
  push:
    branches: [construction/c013-final-plan-20261020]
    paths: ['.github/workflows/c013-final-plan.yml']
permissions:
  contents: write
concurrency:
  group: starcore-c013-final-plan
  cancel-in-progress: true
jobs:
  complete-source-contracts:
    if: github.ref == 'refs/heads/construction/c013-final-plan-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/**
            /scripts/**
            /release/**
            /verification/**
            /training/**
            /gradle/**
            /construction/r997/**
            /construction/c_chain_20261018/C006/contract-inputs.zip
            /construction/c_chain_20261018/C013/**
          persist-credentials: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install formal Android API36 and complete existing toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          sdk=pathlib.Path(os.environ['ANDROID_HOME']);manager=sdk/'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager),'--licenses'],input='y\n'*200,text=True,check=True)
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0','ndk;28.2.13676358','cmake;3.22.1'],check=True)
          PY
      - name: C013 original owner contracts and formal complete Android build
        run: python3 construction/c_chain_20261018/C013/ci_verify.py

# Retry 2: preserve every indexed product/build input in complete isolated host copies.
