name: C019 C020 startup repair complete source formal Android release
on:
  push:
    branches: [construction/c019-c020-release-r2-20261021]
    paths: ['.github/workflows/r94-release.yml']
permissions:
  contents: write
concurrency:
  group: starcore-c019-c020-r94-release-r2
  cancel-in-progress: true
jobs:
  complete-source-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/**
            /scripts/**
            /release/**
            /verification/**
            /training/**
            /gradle/**
            /construction/r997/**
            /construction/c_chain_20261018/C006/contract-inputs.zip
            /construction/c_chain_20261018/C014/test-inputs.zip
            /construction/c_chain_20261018/C014/test-inputs-index.json
            /construction/c_chain_20261018/C019-C020/**
          persist-credentials: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Formal API36 AAPT2 NDK and Java17 test dependencies
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          sdk=pathlib.Path(os.environ['ANDROID_HOME']);manager=sdk/'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager),'--licenses'],input='y\n'*200,text=True,check=True)
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0','ndk;28.2.13676358','cmake;3.22.1'],check=True)
          subprocess.run(['python3','-m','pip','install','numpy==2.3.5'],check=True)
          PY
      - name: Apply exact C019 adaptation then all C001 C020 and normal Android release
        run: python3 construction/c_chain_20261018/C019-C020/r94/ci_release_repair.py

# Revision 2: cancel-aware initialization before and after DB open, before worker admission.

# Revision 3: invalidate transaction metadata after any failed ALTER or schema read; only latest unfinished fixture may run.

# Revision 4: commit measured invocation archives before the unchanged clean-HEAD Android provenance gate.
