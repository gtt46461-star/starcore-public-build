name: Starcore Tianshu B01 Final V2

on:
  push:
    branches: [agent/starcore-tianshu-b01]
    paths: ['.github/workflows/starcore-tianshu-b01-final-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SHA: 80b09c5e5921f18c4ef05ceee7332ad0ee621944
  BRANCH_NAME: agent/starcore-tianshu-b01
  DELIVERY_NAME: Starcore-Tianshu-B01-20260805-Accepted
  ACCEPTED_TAG: starcore-tianshu-b01-accepted-20260805

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/starcore-tianshu-b01
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve frozen baseline key in memory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASELINE_SHA")" = "$BASELINE_SHA"
          KEY=$(git show "$BASELINE_SHA:app/src/main/java/com/ethk3/novaonepro/KeyProvider.java" | python3 -c "import re,sys; s=sys.stdin.read(); p=re.findall(r'PART_[0-9]+\\s*=\\s*new char\\[\\]\\s*\\{([^}]*)\\}',s); print(''.join(re.findall(r\"'([^']+)'\",''.join(p))))")
          test ${#KEY} -ge 8
          echo "::add-mask::$KEY"
          echo "DUOQU_API_KEY=$KEY" >> "$GITHUB_ENV"
          mkdir -p reports delivery tools
          printf 'key_source=frozen_v51_split_chars\nkey_length=%s\n' "${#KEY}" > reports/B01_KEY_INJECTION_AUDIT.txt

      - name: Materialize the ten unit-tested full files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/starcore-tianshu-b01/materializer.part-* | base64 --decode | gzip --decompress > tools/starcore_tianshu_b01_materialize.py
          cat .github/starcore-tianshu-b01/harness.part-* | base64 --decode | gzip --decompress > tools/run_starcore_b01_harness.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/starcore_tianshu_b01_materialize.py'); t=p.read_text(encoding='utf-8')
          repl={
          '25563a5bb5b19aea8ac221b59853a9f97b08ebee1c686c9a21de6ac77c8c821a':'40f532fc8eabc4bb71f9aa6e60eeb5aa5a947c16ccafcc5003e76ceed9867d94',
          '6e800a72c0e6d2dd3ce950f2ba5ea1c659c8a3dece1b8086dee22c8bd538e9df':'9683562182798b5bd53142bd802e8ce1dff2bc7faad5de6134047d3ce60e476c',
          'fields[i % fields.length]':'fields[i %% fields.length]',
          '        "    public static final boolean SHADOW_ONLY = true;",':'        "    public static final boolean SHADOW_ONLY = true;",\n        "    public static final boolean REAL_BET_HARD_DISABLED = true;",'}
          for old,new in repl.items():
              if t.count(old)!=1: raise SystemExit('replacement mismatch: '+old)
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY
          python3 -m py_compile tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py
          python3 tools/starcore_tianshu_b01_materialize.py --apply | tee reports/B01_MATERIALIZE.log
          python3 tools/starcore_tianshu_b01_materialize.py --verify | tee reports/B01_SOURCE_VERIFY.log
          python3 tools/run_starcore_b01_harness.py | tee reports/B01_HARNESS.log
          git diff --check

      - name: Write deterministic Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          def injectedApiKey = System.getenv('DUOQU_API_KEY') ?: ''
          def escapedApiKey = injectedApiKey.replace('\\', '\\\\').replace('"', '\\"')

          android {
              namespace 'com.ethk3.novaonepro'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.ethk3.novaonepro'
                  minSdk 21
                  targetSdk 28
                  versionCode 571010805
                  versionName 'V57.1.0-tianshu-b01-shadow'
                  vectorDrawables.useSupportLibrary = false
                  buildConfigField 'String', 'DUOQU_API_KEY', '"' + escapedApiKey + '"'
                  setProperty('archivesBaseName', 'Starcore-Tianshu-B01-Binance-K3-Shadow')
              }

              buildFeatures {
                  buildConfig true
              }

              buildTypes {
                  debug { minifyEnabled false }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_7
                  targetCompatibility JavaVersion.VERSION_1_7
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(17)
              }
          }
          GRADLE
          grep -n "versionCode\|versionName\|buildConfigField\|archivesBaseName" app/build.gradle | sed 's/DUOQU_API_KEY.*/DUOQU_API_KEY [REDACTED]/' | tee reports/B01_BUILD_CONFIG_AUDIT.txt
          ! grep -F "$DUOQU_API_KEY" app/build.gradle

      - name: Full source, XML and security gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check javalang==0.13.0 >/dev/null
          python3 - <<'PY' | tee reports/B01_FULL_PARSE.log
          from pathlib import Path
          import javalang,xml.etree.ElementTree as ET
          errors=[]; java=list(Path('app/src/main/java').rglob('*.java')); xml=list(Path('app/src/main').rglob('*.xml'))
          for p in java:
              try:javalang.parse.parse(p.read_text(encoding='utf-8'))
              except Exception as e:errors.append((str(p),str(e)))
          for p in xml:
              try:ET.parse(str(p))
              except Exception as e:errors.append((str(p),str(e)))
          print('java=%d xml=%d errors=%d'%(len(java),len(xml),len(errors)))
          for e in errors[:100]:print(e)
          raise SystemExit(bool(errors))
          PY
          ROOT=app/src/main/java/com/ethk3/novaonepro
          grep -F 'Binance1-PK10' "$ROOT/AppConfig.java" >/dev/null
          grep -F 'REAL_BET_HARD_DISABLED = true' "$ROOT/V51BuildManifest.java" >/dev/null
          grep -F 'MODEL_PROVEN = false' "$ROOT/V51BuildManifest.java" >/dev/null
          grep -F 'BuildConfig.DUOQU_API_KEY' "$ROOT/KeyProvider.java" >/dev/null
          ! grep -R -E '/api/lottery/(latest|history)|Ethereum1-PK10' "$ROOT/AppConfig.java" "$ROOT/ApiClient.java" "$ROOT/ApiParser.java" "$ROOT/V51BuildManifest.java"
          ! grep -R -F "$DUOQU_API_KEY" "$ROOT" reports tools
          echo 'source_security=PASS' > reports/B01_SECURITY_GATE.txt

      - name: Live Duoqu Binance1-PK10 verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee reports/B01_LIVE_API_TEST.log
          import hashlib,json,os,re,urllib.parse,urllib.request
          key=os.environ['DUOQU_API_KEY']; result=None
          for base in ('https://api.duoqu.online/data','https://api1.duoqu.online/data'):
              try:
                  url=base+'?'+urllib.parse.urlencode({'code':'Binance1-PK10','limit':20,'key':key})
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Starcore-Tianshu-B01'})
                  with urllib.request.urlopen(req,timeout=15) as r: raw=r.read(2097152); status=r.status
                  obj=json.loads(raw.decode()); rows=obj.get('data'); valid=0
                  if isinstance(rows,list):
                      for row in rows:
                          if isinstance(row,dict) and all(k in row for k in ('betNo','gmtBetNo','openNumber','block','hash','openTime')):
                              nums=[int(x) for x in re.split(r'[,\\s-]+',str(row['openNumber']).strip()) if x]
                              valid += int(len(nums)==10 and sorted(nums)==list(range(1,11)))
                  ok=status==200 and str(obj.get('info','')).lower()=='success' and obj.get('lotteryCode')=='Binance1-PK10' and valid>0
                  result={'base':base,'http':status,'ok':ok,'rows':len(rows) if isinstance(rows,list) else 0,'valid':valid,'sha256':hashlib.sha256(raw).hexdigest(),'key_fp':hashlib.sha256(key.encode()).hexdigest()[:12]}
                  if ok:break
              except Exception as e:result={'base':base,'ok':False,'error':type(e).__name__}
          open('reports/B01_LIVE_API_TEST.json','w').write(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result or not result.get('ok'):raise SystemExit(1)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:clean :app:assembleDebug :app:lintDebug 2>&1 | tee reports/B01_GRADLE_BUILD.log
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -size +100k | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee reports/B01_APKSIGNER.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee reports/B01_BADGING.txt
          grep -F "package: name='com.ethk3.novaonepro'" reports/B01_BADGING.txt >/dev/null
          grep -F "versionName='V57.1.0-tianshu-b01-shadow'" reports/B01_BADGING.txt >/dev/null
          cp "$APK" "delivery/$DELIVERY_NAME-shadow-debug.apk"
          sha256sum "delivery/$DELIVERY_NAME-shadow-debug.apk" > reports/B01_APK_SHA256.txt

      - name: Audit, commit and tag full source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,json,subprocess
          base='80b09c5e5921f18c4ef05ceee7332ad0ee621944'; root=Path('app/src/main/java/com/ethk3/novaonepro')
          names=['AppConfig.java','BuildIdentity.java','V51BuildManifest.java','V51ArtifactBundleManifest.java','KeyProvider.java','ApiClient.java','ApiParser.java','SafeLog.java','BinanceGameContract.java','ApiTransportGovernanceEngine.java']
          rows=[]
          for n in names:
              p=root/n; a=p.read_bytes()
              try:b=subprocess.check_output(['git','show',base+':'+str(p)])
              except subprocess.CalledProcessError:b=b''
              bl=len(b.decode().splitlines()) if b else 0; al=len(a.decode().splitlines())
              rows.append({'file':n,'action':'ADD' if not b else 'MODIFY','before_lines':bl,'after_lines':al,'delta':al-bl,'before_sha256':hashlib.sha256(b).hexdigest() if b else '', 'after_sha256':hashlib.sha256(a).hexdigest()})
          with open('reports/B01_FILE_AUDIT.csv','w',encoding='utf-8-sig',newline='') as f:w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          Path('reports/B01_FILE_AUDIT.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          Path('reports/B01_TOTAL_LINES.txt').write_text('before=%d\nafter=%d\ndelta=%+d\n'%(sum(x['before_lines'] for x in rows),sum(x['after_lines'] for x in rows),sum(x['delta'] for x in rows)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/ethk3/novaonepro tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py reports
          git diff --cached --check
          git commit -m 'feat(starcore): complete Tianshu B01 full-source interface foundation [b01-materialized]'
          git push origin "HEAD:$BRANCH_NAME"
          git tag -a "$ACCEPTED_TAG" -m 'Starcore Tianshu B01 accepted: source, live API, Gradle and APK passed'
          git push origin "$ACCEPTED_TAG"
          git rev-parse HEAD > reports/B01_ACCEPTED_COMMIT_SHA.txt

      - name: Package accepted delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b01full /tmp/b01master
          git archive HEAD | tar -x -C /tmp/b01full
          rm -rf /tmp/b01full/.github/starcore-tianshu-b01
          (cd /tmp/b01full && zip -q -r "$GITHUB_WORKSPACE/delivery/$DELIVERY_NAME-full-source.zip" .)
          zip -q -r "delivery/$DELIVERY_NAME-incremental.zip" app/build.gradle app/src/main/java/com/ethk3/novaonepro reports/B01_* tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py
          zip -q -r "delivery/$DELIVERY_NAME-evidence.zip" reports/B01_* tools/starcore_tianshu_b01_materialize.py tools/run_starcore_b01_harness.py
          git rev-parse HEAD > delivery/B01_ACCEPTED_COMMIT_SHA.txt
          echo "$ACCEPTED_TAG" > delivery/B01_ACCEPTED_TAG.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          cp delivery/* /tmp/b01master/
          (cd /tmp/b01master && zip -q -r "$GITHUB_WORKSPACE/delivery/$DELIVERY_NAME-MASTER-with-APK.zip" .)
          sha256sum "delivery/$DELIVERY_NAME-MASTER-with-APK.zip" >> delivery/SHA256SUMS.txt
          ls -lh delivery | tee reports/B01_DELIVERY_LIST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-Accepted-Delivery
          path: delivery/*
          if-no-files-found: error
          retention-days: 90
