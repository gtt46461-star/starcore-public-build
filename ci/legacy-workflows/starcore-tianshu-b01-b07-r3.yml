name: Starcore Tianshu B01-B07 Reinforced R3

on:
  push:
    branches:
      - agent/starcore-tianshu-b01-b07-r3-20260807
    paths:
      - '.github/starcore-tianshu-b07r3/RUN_R3'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: starcore-tianshu-b01-b07-r3-20260807
  cancel-in-progress: false

jobs:
  short-gates-build-artifact-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Checkout exact R3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/starcore-tianshu-b01-b07-r3-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gate 1 - patcher syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports delivery
          timeout 15s python3 -m py_compile .github/starcore-tianshu-b07r3/apply_r3.py .github/starcore-tianshu-b07r3/run_r3_fixed.py .github/starcore-tianshu-b07r3/selfcheck.py | tee reports/B07R3_GATE1_PYTHON.log
          echo PASS > reports/B07R3_GATE1_STATUS.txt

      - name: Gate 2 - deterministic exact-anchor patch
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s python3 .github/starcore-tianshu-b07r3/run_r3_fixed.py | tee reports/B07R3_GATE2_PATCH.log
          git diff --check | tee reports/B07R3_DIFF_CHECK.log
          sha256sum app/src/main/java/com/ethk3/novaonepro/StarcoreEvidenceKernel.java | tee reports/B07R3_KERNEL_SHA256.txt
          echo PASS > reports/B07R3_GATE2_STATUS.txt

      - name: Gate 3 - bounded source and invariant selfcheck
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s python3 .github/starcore-tianshu-b07r3/selfcheck.py | tee reports/B07R3_GATE3_SELFCHECK.log
          echo PASS > reports/B07R3_GATE3_STATUS.txt

      - name: Gate 4 - fast Java compile
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          START=$(date +%s)
          timeout 10m gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac 2>&1 | tee reports/B07R3_JAVAC_COMPILE.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          printf 'rc=%s\nduration_sec=%s\n' "$RC" "$((END-START))" > reports/B07R3_GATE4_COMPILE_STATUS.txt
          exit 0

      - name: Real API sanitized validation
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
        run: |
          set +e
          timeout 35s python3 - <<'PY' | tee reports/B07R3_LIVE_API_TEST.json
          import json,os,urllib.parse,urllib.request,time
          key=os.environ.get('DUOQU_API_KEY','').strip()
          out={'game':'Binance1-PK10','key_logged':False,'primary':{},'backup':{},'result':'NOT_RUN_NO_SECRET'}
          def validate(obj):
              rows=[]
              def walk(x):
                  if isinstance(x,list):
                      if x and all(isinstance(y,dict) for y in x): rows.extend(x)
                      for y in x: walk(y)
                  elif isinstance(x,dict):
                      for v in x.values(): walk(v)
              walk(obj)
              valid=0
              for r in rows[:50]:
                  vals=[]
                  for v in r.values():
                      if isinstance(v,list) and len(v)==10:
                          try: vals=[int(z) for z in v]
                          except: vals=[]
                          if vals: break
                      if isinstance(v,str):
                          z=[q for q in v.replace(',',' ').replace('|',' ').replace('-',' ').split() if q.isdigit()]
                          if len(z)==10:
                              vals=[int(q) for q in z];break
                  if sorted(vals)==list(range(1,11)): valid+=1
              return {'row_candidates':len(rows),'valid_permutation_rows':valid}
          def call(base):
              q=urllib.parse.urlencode({'code':'Binance1-PK10','limit':'20','key':key})
              req=urllib.request.Request(base+'/data?'+q,headers={'User-Agent':'Starcore-Tianshu-R3-CI'})
              t=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(200000); code=getattr(r,'status',200)
                  obj=json.loads(raw.decode('utf-8','replace'))
                  v=validate(obj);v.update({'http':code,'bytes':len(raw),'ms':int((time.time()-t)*1000)})
                  return v
              except Exception as e:
                  return {'http':0,'error_type':e.__class__.__name__,'ms':int((time.time()-t)*1000)}
          if key:
              out['primary']=call('https://api.duoqu.online')
              if out['primary'].get('http')==200: out['result']='OK_PRIMARY'
              else:
                  out['backup']=call('https://api1.duoqu.online')
                  if out['backup'].get('http')==200: out['result']='OK_BACKUP'
                  else: out['result']='FAIL_BOTH'
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          exit 0

      - name: Gate 5 - APK assemble
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          START=$(date +%s)
          timeout 13m gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee reports/B07R3_GRADLE_BUILD.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          printf 'rc=%s\nduration_sec=%s\n' "$RC" "$((END-START))" > reports/B07R3_GATE5_BUILD_STATUS.txt
          APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          if [ -n "$APK" ] && [ -s "$APK" ]; then
            cp "$APK" delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk
            sha256sum delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk > reports/B07R3_APK_SHA256.txt
          fi
          exit 0

      - name: Gate 6 - lint signing badging
        shell: bash
        env:
          DUOQU_API_KEY: ${{ secrets.DUOQU_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set +e
          timeout 7m gradle --no-daemon :app:lintDebug 2>&1 | tee reports/B07R3_LINT.log
          LRC=${PIPESTATUS[0]}
          echo "rc=$LRC" > reports/B07R3_LINT_STATUS.txt
          APK=delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk
          if [ -s "$APK" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
            if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --verbose --print-certs "$APK" > reports/B07R3_APKSIGNER.txt 2>&1; echo "rc=$?" > reports/B07R3_APKSIGNER_STATUS.txt; else echo 'rc=127' > reports/B07R3_APKSIGNER_STATUS.txt; fi
            if [ -n "$AAPT" ]; then "$AAPT" dump badging "$APK" > reports/B07R3_BADGING.txt 2>&1; echo "rc=$?" > reports/B07R3_BADGING_STATUS.txt; else echo 'rc=127' > reports/B07R3_BADGING_STATUS.txt; fi
          else
            echo 'rc=2' > reports/B07R3_APKSIGNER_STATUS.txt
            echo 'rc=2' > reports/B07R3_BADGING_STATUS.txt
          fi
          exit 0

      - name: Build file audit and Chinese acceptance report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,json,re
          root=Path('.'); reports=root/'reports'; delivery=root/'delivery'
          files=[]
          for p in sorted(list((root/'app/src/main/java').rglob('*.java'))+list((root/'app/src/main/res').rglob('*.xml'))+[root/'app/src/main/AndroidManifest.xml']):
              if not p.exists(): continue
              b=p.read_bytes();files.append([str(p),len(b),b.count(b'\n')+1,hashlib.sha256(b).hexdigest()])
          with (reports/'B07R3_FILE_AUDIT.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f);w.writerow(['file','bytes','lines','sha256']);w.writerows(files)
          ch=json.loads((reports/'B07R3_CODE_CHANGE_MANIFEST.json').read_text(encoding='utf-8'))
          sc=json.loads((reports/'B07R3_BOUNDED_SELFCHECK.json').read_text(encoding='utf-8'))
          def val(path,key='rc'):
              p=reports/path
              if not p.exists():return 'MISSING'
              m=re.search(r'^'+re.escape(key)+r'=(.*)$',p.read_text(errors='replace'),re.M);return m.group(1).strip() if m else p.read_text(errors='replace').strip()[:100]
          api=json.loads((reports/'B07R3_LIVE_API_TEST.json').read_text(encoding='utf-8'))
          a=[]
          a += ['# 星核天枢 B01-B07 加强优化 R3 完整验收报告','', '范围：只修复和加强B01-B07；B08未开始。', '基线：f830417793a49ea153c3bfb28a44fd2da510af3。','']
          a += ['## 本轮确认的根因','- B07合同54文件此前缺 `StarcoreEvidenceKernel.java`，R2短门18 PASS / 1 FAIL，因此旧R2不能称1-7完美完成。','- 活动V51 LanePolicy此前把全局WalkForward `CHAMPION` 当作绝对真实BET前置条件；若状态为MODEL_NOT_PROVEN，所有候选直接SHADOW，即使候选本身严格OOS/风险门可评估。','- 后台原有START_STICKY/Alarm/Job/TaskRemoved，但TaskRemoved恢复会受“心跳仍健康”的跳过逻辑影响；R3增加同服务前台re-delivery，不等待心跳自然过期。','']
          a += ['## 修复原则','- 不伪造MODEL_PROVEN；全局Champion仍决定“能否宣称模型已经被证明”，但不再一票否决活动V51的候选级严格授权。','- 不降低硬风险、EventP、ActionLCB、覆盖、第三号、反证、Uncertainty、PredictionContract、RuntimeFreshness、DecisionAuthorization等候选级门。','- 不用频率债务补单；频率提升只能来自已证明状态域扩张、排序/校准/证据覆盖改善。','- StarcoreEvidenceKernel只聚合证据与回放健康，不写FinalP/Lane/BET。','']
          a += ['## 修改文件（修改前 -> 修改后）','']
          for x in ch['files']:
              a += ['- `%s`：%s'%(x['file'],x['change']),'  - 行数：%s -> %s'%(x['before_lines'],x['after_lines']),'  - SHA：%s -> %s'%(x['before_sha256'],x['after_sha256'])]
          a += ['', '## 短门/构建结果', '- 自检：PASS=%s FAIL=%s；Kernel lines=%s / effective=%s'%(sc['pass'],sc['fail'],sc.get('kernel_lines'),sc.get('kernel_effective')), '- 快速Javac rc='+val('B07R3_GATE4_COMPILE_STATUS.txt'), '- Gradle APK rc='+val('B07R3_GATE5_BUILD_STATUS.txt'), '- Lint rc='+val('B07R3_LINT_STATUS.txt'), '- apksigner rc='+val('B07R3_APKSIGNER_STATUS.txt'), '- aapt badging rc='+val('B07R3_BADGING_STATUS.txt'), '- 真实接口='+str(api.get('result'))+'；主HTTP='+str(api.get('primary',{}).get('http'))+'；备用HTTP='+str(api.get('backup',{}).get('http')),'']
          a += ['## 40/50/60与频率诊断口径','- 40%、50%、60%只能由严格时间顺序OOS + 已结算真实/影子证据、Wilson下界、ECE、四块稳定性和覆盖共同证明。工程完成不等于模型命中率已经达到这些数字。','- 若命中不足：优先检查Ranker残差、层级校准、状态漂移证书、第三号条件排序、专家相关性、消融效果与证据健康；报告会明确是“代码/调用链缺失、冲突、校准失真、策略无增益、样本不足、状态漂移”哪一类。','- 若胜率稳定但频率低：只能扩张经OOS证明的状态域与候选覆盖，不能降低硬门或制造频率债务。','']
          a += ['## 后台边界','支持普通退出、划掉最近任务、息屏和锁屏后的前台服务+WakeLock+Alarm+Job恢复；Android用户手动“强行停止”或厂商禁止后台属于系统级封锁，普通应用不能合法绕过，检测报告必须明确显示这类状态。']
          (reports/'B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md').write_text('\n'.join(a),encoding='utf-8')
          PY

      - name: Package full source incremental evidence and MASTER before Git commit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p delivery/evidence_tmp delivery/incremental_tmp
          cp reports/B07R3_* delivery/evidence_tmp/ 2>/dev/null || true
          (cd delivery/evidence_tmp && zip -qr ../Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-EVIDENCE.zip .)
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil
          root=Path('.'); out=root/'delivery/incremental_tmp'; out.mkdir(parents=True,exist_ok=True)
          ch=json.loads((root/'reports/B07R3_CODE_CHANGE_MANIFEST.json').read_text(encoding='utf-8'))
          for x in ch['files']:
              p=root/x['file']
              if p.exists():
                  d=out/p.parent;d.mkdir(parents=True,exist_ok=True);shutil.copy2(p,d/p.name)
          PY
          (cd delivery/incremental_tmp && zip -qr ../Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-INCREMENTAL.zip .)
          zip -qr delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-FULL-SOURCE.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'delivery/*'
          cp reports/B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/
          rm -rf delivery/evidence_tmp delivery/incremental_tmp
          (cd delivery && sha256sum Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-FULL-SOURCE.zip Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-INCREMENTAL.zip Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-EVIDENCE.zip B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md > SHA256SUMS.txt) || true
          mkdir -p delivery/master_tmp
          cp delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk delivery/master_tmp/ 2>/dev/null || true
          cp delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-FULL-SOURCE.zip delivery/master_tmp/
          cp delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-INCREMENTAL.zip delivery/master_tmp/
          cp delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-EVIDENCE.zip delivery/master_tmp/
          cp delivery/B07R3_FULL_CHANGE_AND_DIAGNOSIS_REPORT.md delivery/master_tmp/
          cp delivery/SHA256SUMS.txt delivery/master_tmp/
          (cd delivery/master_tmp && zip -qr ../Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-MASTER.zip .)
          rm -rf delivery/master_tmp
          sha256sum delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-MASTER.zip > delivery/MASTER_SHA256.txt

      - name: Upload delivery artifacts BEFORE source commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starcore-Tianshu-B01-B07-Reinforced-R3-20260807-Delivery
          path: delivery/
          if-no-files-found: warn
          retention-days: 30

      - name: Final acceptance gate after artifact upload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys
          r=Path('reports')
          sc=json.loads((r/'B07R3_BOUNDED_SELFCHECK.json').read_text())
          api=json.loads((r/'B07R3_LIVE_API_TEST.json').read_text())
          def rc(name):
              p=r/name
              if not p.exists(): return 999
              m=re.search(r'^rc=(\d+)',p.read_text(),re.M);return int(m.group(1)) if m else 999
          failures=[]
          if sc['fail']!=0: failures.append('selfcheck')
          if rc('B07R3_GATE4_COMPILE_STATUS.txt')!=0: failures.append('javac')
          if rc('B07R3_GATE5_BUILD_STATUS.txt')!=0: failures.append('gradle')
          if rc('B07R3_LINT_STATUS.txt')!=0: failures.append('lint')
          if rc('B07R3_APKSIGNER_STATUS.txt')!=0: failures.append('apksigner')
          if rc('B07R3_BADGING_STATUS.txt')!=0: failures.append('badging')
          if api.get('result') not in ('OK_PRIMARY','OK_BACKUP'): failures.append('live_api')
          if not Path('delivery/Starcore-Tianshu-B01-B07-Reinforced-R3-20260807.apk').exists(): failures.append('apk_missing')
          print('FINAL_GATE failures=',failures)
          if failures: sys.exit(1)
          PY

      - name: Commit only accepted generated source and reports
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/ethk3/novaonepro/AppConfig.java \
            app/src/main/java/com/ethk3/novaonepro/StarcoreEvidenceKernel.java \
            app/src/main/java/com/ethk3/novaonepro/UnifiedStrategyEvidenceEngine.java \
            app/src/main/java/com/ethk3/novaonepro/RollingCausalBacktestEngine.java \
            app/src/main/java/com/ethk3/novaonepro/LanePolicyCompiler.java \
            app/src/main/java/com/ethk3/novaonepro/BootReceiver.java \
            app/src/main/java/com/ethk3/novaonepro/AutoFetchService.java \
            app/src/main/java/com/ethk3/novaonepro/B07R2FullDiagnosticEngine.java \
            app/src/main/java/com/ethk3/novaonepro/B07R2BuildAuditManifest.java \
            app/src/main/java/com/ethk3/novaonepro/MainActivity.java \
            reports/B07R3_* || true
          git diff --cached --check
          git commit -m 'feat(starcore): B01-B07 reinforced R3 full repair'
          git push origin HEAD:agent/starcore-tianshu-b01-b07-r3-20260807
          git rev-parse HEAD | tee delivery/COMMIT_SHA.txt
          git push origin HEAD:accepted/starcore-tianshu-b01-b07-r3-20260807 --force-with-lease || git push origin HEAD:accepted/starcore-tianshu-b01-b07-r3-20260807
