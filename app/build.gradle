        buildConfigField 'int', 'CRITICAL_DOMAIN_REVISION', requiredIdentity('criticalDomainRevision')
        buildConfigField 'int', 'RESEARCH_DOMAIN_REVISION', requiredIdentity('researchDomainRevision')
