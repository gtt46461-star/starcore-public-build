        legacyR815Revision: String.valueOf(schemaManifest.legacyR815Revision),
        legacyR906Revision: String.valueOf(schemaManifest.legacyR906Revision),
        r925Revision: String.valueOf(schemaManifest.r925Revision),
        criticalDomainRevision: String.valueOf(schemaManifest.criticalDomainRevision),
        researchDomainRevision: String.valueOf(schemaManifest.researchDomainRevision),
        legacyDomainRevision: String.valueOf(schemaManifest.legacyDomainRevision),
