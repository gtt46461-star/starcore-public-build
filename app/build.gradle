}
// The committed tree and current build-input bytes are distinct identities.
// A developer build may be dirty; a release must be reproducible from its commit.
def r31BuildIdentity = new groovy.json.JsonSlurper().parseText(providers.exec {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tools/r31/verify_baseline.py').absolutePath, '--identity-only'
}.standardOutput.asText.get())
if (r31BuildIdentity.format != 'R31_BUILD_IDENTITY_V1') throw new GradleException('R31_BUILD_IDENTITY_INVALID')
if (requestedRelease && r31BuildIdentity.source_dirty) throw new GradleException('R31_DIRTY_SOURCE_NOT_PUBLISHABLE')
if (requestedRelease && !(releaseApiKey ==~ /[A-Za-z0-9]{8,128}/)) {
    throw new GradleException('R995_RELEASE_DEFAULT_API_KEY_REQUIRED')
}
def releaseApiKeySplit = releaseApiKey.length().intdiv(2)
def releaseApiKeyA = releaseApiKey.substring(0, releaseApiKeySplit)
def releaseApiKeyB = releaseApiKey.substring(releaseApiKeySplit)
