        buildConfigField 'String', 'SOURCE_WORKTREE_SHA256_R31', '"' + r31BuildIdentity.product_worktree_sha256 + '"'
        buildConfigField 'String', 'PLAN_MANIFEST_SHA256_R31', '"' + r31BuildIdentity.plan_manifest_sha256 + '"'
        buildConfigField 'String', 'MIGRATION_CONTRACT_SHA256_R31', '"' + r31BuildIdentity.migration_contract_sha256 + '"'
        buildConfigField 'int', 'DB_USER_VERSION', requiredIdentity('dbVersion')
