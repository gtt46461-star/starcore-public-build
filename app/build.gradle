gradle.taskGraph.whenReady { graph ->
    if (r312Development) {
        def forbidden = graph.allTasks.findAll { task ->
            task.project == project && (task.name in ['verifyFinalR31BuildIdentity', 'lintRelease',
                    'generateR982SourceCallAsset', 'assembleDebug', 'assembleDebugAndroidTest',
                    'assembleRelease', 'assembleReleaseAndroidTest', 'bundleDebug', 'bundleRelease',
                    'packageDebug', 'packageDebugAndroidTest', 'packageRelease', 'packageReleaseAndroidTest'] ||
                    task.name.startsWith('validateSigning') || task.name.startsWith('sign'))
        }
        if (!forbidden.isEmpty()) throw new GradleException('R312_DEVELOPMENT_FORBIDS_RELEASE_SIGNING_APK|' + forbidden*.path.join(','))
    }
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?:assemble|bundle|package)Release(?:Bundle)?/ }) {
        if (r31BuildIdentity.source_dirty) throw new GradleException('R31_DIRTY_SOURCE_NOT_PUBLISHABLE')
        if (!(releaseApiKey ==~ /[A-Za-z0-9]{8,128}/)) {
            throw new GradleException('R995_RELEASE_DEFAULT_API_KEY_REQUIRED')
        }
        def independentR13 = requiredIdentity('applicationId') == 'com.starcore.research.r13'
        def config = android.signingConfigs.findByName(independentR13 ? 'r13Independent' : 'originalRelease')
        def expectedCert = (System.getenv(independentR13 ? 'R13_EXPECTED_CERT_SHA256' : 'STARCORE_EXPECTED_CERT_SHA256') ?: '').toLowerCase()
        if (config == null || !config.storeFile.isFile() || !config.storePassword || !config.keyPassword
                || !(expectedCert ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('CP12_ORIGINAL_RELEASE_SIGNING_INPUTS_REQUIRED')
        }
        try {
            def store = java.security.KeyStore.getInstance(config.storeType)
            config.storeFile.withInputStream { store.load(it, config.storePassword.toCharArray()) }
            if (!store.isKeyEntry(config.keyAlias)
                    || !(store.getKey(config.keyAlias, config.keyPassword.toCharArray()) instanceof java.security.PrivateKey)) {
                throw new GradleException('CP12_ORIGINAL_RELEASE_PRIVATE_KEY_REQUIRED')
            }
            def actualCert = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(store.getCertificate(config.keyAlias).encoded)
                    .collect { String.format('%02x', it) }.join('')
            if (actualCert != expectedCert) throw new GradleException('CP12_ORIGINAL_RELEASE_CERTIFICATE_MISMATCH')
        } catch (GradleException problem) {
            throw problem
        } catch (Exception ignored) {
            throw new GradleException('CP12_ORIGINAL_RELEASE_KEY_UNREADABLE')
        }
    }
}

