// Bind packaged metadata to the same bytes used when BuildConfig was configured.
// Do not serialize filenames from Git status or any private signing inputs.
def r31IdentityKeys = ['source_commit', 'source_tree', 'source_dirty', 'product_worktree_sha256',
                      'plan_manifest_sha256', 'migration_contract_sha256']
def checkR31Identity = {
    def current = new groovy.json.JsonSlurper().parseText(providers.exec {
        workingDir rootProject.projectDir
        commandLine 'python3', rootProject.file('tools/r31/verify_baseline.py').absolutePath, '--identity-only'
    }.standardOutput.asText.get())
    r31IdentityKeys.each { key ->
        if (current[key] != r31BuildIdentity[key]) throw new GradleException('R31_BUILD_INPUT_CHANGED_' + key)
    }
}
def verifyR31Baseline = tasks.register('verifyR31Baseline', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tools/r31/verify_baseline.py').absolutePath,
            '--output', layout.buildDirectory.file('r31/baseline-verification.json').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}
def generateR31BuildIdentity = tasks.register('generateR31BuildIdentity') {
    dependsOn verifyR31Baseline
    outputs.upToDateWhen { false }
    doLast {
        checkR31Identity()
        def publicIdentity = new LinkedHashMap(r31BuildIdentity)
        publicIdentity.remove('git_status')
        def output = layout.buildDirectory.file('generated/assets/r31/diagnostics/build-identity-r31.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(publicIdentity)) + '\n'
    }
}
def verifyFinalR31BuildIdentity = tasks.register('verifyFinalR31BuildIdentity') {
    doLast { checkR31Identity() }
}
