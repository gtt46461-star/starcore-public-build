        gameCode: String.valueOf(releaseManifest.gameCode),
        releaseMode: String.valueOf(releaseManifest.releaseMode),
        releaseManifestSha256: manifestSha256
]
expectedIdentity.each { key, expected ->
    def actual = releaseIdentity.getProperty(key, '').trim()
    if (actual != expected) throw new GradleException('R926_IDENTITY_DRIFT_' + key + '|expected=' + expected + '|actual=' + actual)
}
def requiredIdentity = { String key ->
    def value = expectedIdentity[key]
    if (value == null || String.valueOf(value).trim().isEmpty()) throw new GradleException('R926_IDENTITY_MISSING_' + key)
    String.valueOf(value)
}
// R995 restores the user's authorized legacy release default. Keep its value in
// the local build environment; never write it into tracked source or build logs.
def releaseApiKey = (System.getenv('DUOQU_API_KEY') ?: '').trim()
if (!releaseApiKey.isEmpty() && !(releaseApiKey ==~ /[A-Za-z0-9]{8,128}/)) {
    throw new GradleException('R995_RELEASE_DEFAULT_API_KEY_INVALID')
}
def requestedRelease = gradle.startParameter.taskNames.any {
