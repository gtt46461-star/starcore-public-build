    }
    buildFeatures { buildConfig true }
    androidResources { noCompress += ["jsonl"] }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    def r13SigningFile = System.getenv('R13_SIGNING_P12')
    if (r13SigningFile) {
        signingConfigs {
            r13Independent {
                storeFile rootProject.file(r13SigningFile)
                storeType 'PKCS12'
                storePassword System.getenv('R13_SIGNING_PASSWORD')
                keyAlias 'starcore-r13'
                keyPassword System.getenv('R13_SIGNING_PASSWORD')
            }
        }
        buildTypes.debug.signingConfig signingConfigs.r13Independent
        buildTypes.release.signingConfig signingConfigs.r13Independent
    }
    if (requiredIdentity('applicationId') == 'com.starcore.research.r13' &&
        gradle.startParameter.taskNames.any { it.tokenize(':').last() ==~ /(?:assemble|package)Debug(?:AndroidTest)?/ } && !r13SigningFile) {
        throw new GradleException('R13_FIXED_SIGNING_KEY_REQUIRED')
    }
    // Packaging requires the existing signing identity. Lint/unit tasks need no secrets.
    def signingFile = System.getenv('STARCORE_SIGNING_P12')
    if (signingFile && requiredIdentity('applicationId') != 'com.starcore.research.r13') {
        signingConfigs {
            originalRelease {
                storeFile rootProject.file(signingFile)
                storeType System.getenv('STARCORE_SIGNING_TYPE') ?: 'PKCS12'
                storePassword System.getenv('STARCORE_SIGNING_PASSWORD')
                keyAlias System.getenv('STARCORE_SIGNING_ALIAS') ?: 'starcore-r902'
                keyPassword System.getenv('STARCORE_SIGNING_KEY_PASSWORD') ?: System.getenv('STARCORE_SIGNING_PASSWORD')
            }
        }
        buildTypes.release.signingConfig signingConfigs.originalRelease
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { baseline file("lint-baseline.xml"); abortOnError true; checkReleaseBuilds true; warningsAsErrors true
        // R31Q: "a newer Gradle is available" is an upstream release notice, not a defect of this source; the wrapper stays pinned by SHA-256.
        disable "AndroidGradlePluginVersion" }
}
